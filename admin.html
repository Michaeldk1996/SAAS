<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not Found</title>
<script src="./admin-config.js"></script>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2230;--line:#2a3240;--txt:#d6dee8;--dim:#7d8794;--accent:#4da3ff;--good:#3fb950;--warn:#d29922;--bad:#f85149;--p1:#4da3ff;--p2:#e0883b;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  code,.mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace}
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:100}
  #gate .box{text-align:center}
  #gate h1{font-size:44px;color:#30363d;margin:0 0 4px;font-weight:600}
  #gate p{color:#30363d;margin:0 0 18px}
  #gate input{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:8px 12px;border-radius:6px;width:220px;outline:none}
  #gate input:focus{border-color:var(--accent)}
  #app{display:none;max-width:1200px;margin:0 auto;padding:18px}
  header.top{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:8px}
  header.top h1{font-size:18px;margin:0;font-weight:600}
  header.top .meta{color:var(--dim);font-size:12px}
  nav.tabs{display:flex;gap:4px;margin:14px 0;flex-wrap:wrap}
  nav.tabs button{background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px}
  nav.tabs button.active{background:var(--panel2);color:var(--txt);border-color:var(--accent)}
  section.tab{display:none}
  section.tab.active{display:block}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden}
  .card .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--line);cursor:pointer}
  .card .hd .title{font-weight:600}
  .card .hd .sub{color:var(--dim);font-size:12px}
  .card .body{padding:12px 14px;display:none}
  .card.open .body{display:block}
  .card .body.always{display:block}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0}
  .kv{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
  .kv .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.03em}
  .kv .v{font-size:15px;margin-top:2px;font-weight:600}
  table{width:100%;border-collapse:collapse;margin:6px 0;font-size:12px}
  th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
  td.num{text-align:right;font-family:'SF Mono',ui-monospace,Menlo,monospace}
  tr.applied td:first-child{border-left:3px solid var(--good)}
  tr.gated td:first-child{border-left:3px solid var(--warn)}
  tr.missing td:first-child{border-left:3px solid #444}
  .pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:600}
  .pill.good{background:rgba(63,185,80,.15);color:var(--good)}
  .pill.warn{background:rgba(210,153,34,.15);color:var(--warn)}
  .pill.bad{background:rgba(248,81,73,.15);color:var(--bad)}
  .pill.dim{background:rgba(125,135,148,.15);color:var(--dim)}
  .pill.p1{background:rgba(77,163,255,.15);color:var(--p1)}
  .pill.p2{background:rgba(224,136,59,.15);color:var(--p2)}
  .pos{color:var(--good)} .neg{color:var(--bad)}
  .stub{padding:26px;text-align:center;color:var(--dim);border:1px dashed var(--line);border-radius:8px}
  .detail{color:var(--dim);font-size:11px}
  .flagline{margin-top:8px;padding:8px 10px;border-radius:6px;background:var(--panel2);border:1px solid var(--line)}
  .err{color:var(--bad)}
  .barwrap{background:#0b0f16;border-radius:4px;height:6px;overflow:hidden;margin-top:4px}
  .bar{height:100%}
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <h1>404</h1>
    <p>This page could not be found.</p>
    <input id="pw" type="password" autocomplete="off" aria-label="x" />
  </div>
</div>
<div id="app"></div>

<script>
'use strict';
const CFG = window.ADMIN_CONFIG || {};
const TOKEN_KEY = 'bsp.admin.ok';

// ---- gate ----------------------------------------------------------------
function authed(){ return sessionStorage.getItem(TOKEN_KEY) === '1'; }
function tryPassword(v){
  if (CFG.password === '' || v === CFG.password){ sessionStorage.setItem(TOKEN_KEY,'1'); reveal(); }
}
function reveal(){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  document.title = 'BSP Admin';
  boot();
}
document.getElementById('pw').addEventListener('keydown',e=>{ if(e.key==='Enter') tryPassword(e.target.value); });
if (authed()) reveal(); else document.getElementById('pw').focus();

// ---- helpers -------------------------------------------------------------
const $ = (h)=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;};
const esc = (s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (x,d=1)=>x==null||!isFinite(x)?'—':(x*100).toFixed(d)+'%';
const pp = (x,d=1)=>x==null||!isFinite(x)?'—':(x>=0?'+':'')+(x*100).toFixed(d)+'pp';
const dec = (x,d=2)=>x==null||!isFinite(x)?'—':(+x).toFixed(d);
const fmtTs = (t)=>{ if(!t) return '—'; const d=new Date(t); return isNaN(d)?'—':d.toISOString().replace('T',' ').slice(0,16)+'Z'; };
const agoH = (t)=>{ if(!t) return null; const h=(Date.now()-new Date(t).getTime())/3.6e6; return isFinite(h)?h:null; };
async function getJson(url){ const r=await fetch(url+'?cb='+Date.now()); if(!r.ok) throw new Error(r.status+' '+url); return r.json(); }

let DATA = { model:null, matches:null, health:null, harvest:null, adminLog:null, errors:[] };

async function boot(){
  const app = document.getElementById('app');
  app.innerHTML = '<header class="top"><h1>BSP Consult · Admin</h1><span class="meta" id="topmeta">loading…</span></header>'
    + '<nav class="tabs" id="tabs"></nav>'
    + '<section class="tab active" id="tab1"></section>'
    + '<section class="tab" id="tab2"></section>'
    + '<section class="tab" id="tab3"></section>'
    + '<section class="tab" id="tab4"></section>'
    + '<section class="tab" id="tab5"></section>';
  const tabs = [
    ['tab1','1 · Live board'],['tab2','2 · Performance log'],['tab3','3 · Summary'],
    ['tab4','4 · Value-flag history'],['tab5','5 · Model state'],
  ];
  const nav = document.getElementById('tabs');
  tabs.forEach(([id,label],i)=>{
    const b=document.createElement('button'); b.textContent=label; if(i===0)b.className='active';
    b.onclick=()=>{ document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('section.tab').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); document.getElementById(id).classList.add('active'); };
    nav.appendChild(b);
  });

  // Load data (best-effort; harvest state may be 404 on Pages).
  const [model,matches,health] = await Promise.all([
    getJson('./model-output.json').catch(e=>{DATA.errors.push('model-output.json: '+e.message);return null;}),
    getJson('./matches.json').catch(e=>{DATA.errors.push('matches.json: '+e.message);return null;}),
    getJson('./pipeline-health.json').catch(e=>{DATA.errors.push('pipeline-health.json: '+e.message);return null;}),
  ]);
  DATA.model=model; DATA.matches=matches; DATA.health=health;
  DATA.harvest = await getJson('./atp-entry-harvest-state.json').catch(()=>null); // not exposed => null
  // Option A (founder, TEN-8): admin-log.json is deliberately NOT published to
  // _site, so this same-origin fetch 404s on the public Pages site and the
  // ledger is never exposed at a public URL. Sections 2/3/4 therefore show the
  // "data not published" stub on Pages by design. To render the real ledger
  // behind genuine auth, serve it from the authenticated Firebase host (the
  // password gate here is obscurity-only, per admin-config.js) — see report.
  DATA.adminLog = await getJson('./admin-log.json').catch(()=>null);

  document.getElementById('topmeta').innerHTML =
    'model generated ' + esc(fmtTs(model&&model.generatedAt)) + ' · pipeline last-success ' + esc(fmtTs(health&&health.lastSuccess));

  renderSection1();
  renderSection2();
  renderSection3();
  renderSection4();
  renderSection5();
}

function matchList(model){
  if(!model||!model.matches) return [];
  const M=model.matches;
  return Array.isArray(M)?M.map((v,k)=>[k,v]):Object.entries(M);
}

// ---- Section 1: Live board overview -------------------------------------
function renderSection1(){
  const el=document.getElementById('tab1');
  const model=DATA.model;
  if(!model){ el.innerHTML='<div class="err">model-output.json unavailable.</div>'; return; }
  const list=matchList(model);
  el.innerHTML='';
  const head=$('<div class="detail" style="margin-bottom:8px">'+list.length+' priced matches · click a card to expand · full model output (everything the member view hides)</div>');
  el.appendChild(head);
  list.forEach(([id,m])=>{ el.appendChild(matchCard(id,m)); });
}

function matchCard(id,m){
  const mt=m.match||{}, pl=m.players||{}, s1=m.stage1||{}, bs=(s1.baseState)||{}, s2=m.stage2||{}, s3=m.stage3||{};
  const adjs=(s2.adjustments)||[];
  const applied=adjs.filter(a=>a.applied), gated=adjs.filter(a=>a.gated&&!a.applied), missing=adjs.filter(a=>!a.applied&&!a.gated);
  const fair=s3.fair||{}, sharp=s3.sharp||{}, soft=s3.soft||{};
  const state=bs.state;
  const hrsToStart = mt.date ? ((new Date(mt.date+'T12:00:00Z').getTime()-Date.now())/3.6e6) : null;
  // Value flag "showing to members": State 2 confirmed + a positive edge vs Pinnacle + within the display window.
  const edgeP1=(sharp.edge&&sharp.edge.p1), edgeP2=(sharp.edge&&sharp.edge.p2);
  const bestEdge=Math.max(edgeP1==null?-9:edgeP1, edgeP2==null?-9:edgeP2);
  const winP = (edgeP1!=null&&edgeP2!=null)?(edgeP1>=edgeP2?'p1':'p2'):null;
  const openTs = bs.anchorPrice&&bs.anchorPrice.ts;
  const openAgo = agoH(openTs);
  const showing = state===2 && bestEdge>0 && openAgo!=null && openAgo<=(CFG.stateWindowHours||30);

  const c=$('<div class="card"></div>');
  c.innerHTML =
    '<div class="hd"><div><span class="title">'+esc(mt.p1)+' vs '+esc(mt.p2)+'</span> '
      + '<span class="sub">· '+esc(mt.round||mt.tour)+' · '+esc(mt.surface)+' · Bo'+esc(mt.bestOf)+' · '+esc(mt.date)+'</span></div>'
      + '<div>'+statePill(state)+' '+(showing?'<span class="pill good">FLAG SHOWING</span>':'<span class="pill dim">flag hidden</span>')+'</div></div>'
    + '<div class="body"></div>';
  const body=c.querySelector('.body');

  // Base probability breakdown
  const comp=s1.components||{}; const er=comp.eloRaw||{},es=comp.eloSurface||{},e50=comp.elo5050||{};
  body.appendChild($('<div class="grid">'
    + kv('State', stateLabel(state)+(bs.pinnacleFrozen?' · frozen':''))
    + kv('Base P1 / P2', pct(s1.baseP1)+' / '+pct(s1.baseP2))
    + kv('Blended Elo', pct(er.p1)+' <span class="detail">('+esc(er.ratingP1)+' vs '+esc(er.ratingP2)+', w'+dec(er.weight,2)+')</span>')
    + kv('Surface Elo', (es.surfaceAvailable===false?'<span class="detail">n/a</span>':pct(es.p1))+' <span class="detail">'+esc(es.surfaceKey||'')+' w'+dec(es.weight,2)+'</span>')
    + kv('Elo 50/50', pct(e50.p1)+' <span class="detail">w'+dec(e50.weight,2)+'</span>')
    + kv('Market anchor', esc(bs.anchorBook||'—')+' '+pct(bs.marketProb)+' <span class="detail">'+(bs.anchorPrice?dec(bs.anchorPrice.p1)+'/'+dec(bs.anchorPrice.p2):'')+'</span>')
    + '</div>'));

  // Coverage
  body.appendChild($('<div class="grid">'
    + kv('Coverage', '<span class="pos">'+applied.length+' full</span> · <span class="warn" style="color:var(--warn)">'+gated.length+' partial</span> · <span class="detail">'+missing.length+' missing</span>')
    + kv('Applied / Gated', s2.appliedCount+' / '+s2.gatedCount)
    + kv('Total ΔP1', pp(s2.totalDeltaP1))
    + kv('Adjusted P1', pct(s2.adjustedP1))
    + '</div>'));
  body.appendChild($('<div class="detail">missing: '+(missing.map(a=>esc(a.name)).join(', ')||'none')+'</div>'));

  // Adjustment stack
  const rows=adjs.map(a=>{
    const cls=a.applied?'applied':(a.gated?'gated':'missing');
    const st=a.applied?'<span class="pill good">applied</span>':(a.gated?'<span class="pill warn">gated</span>':'<span class="pill dim">missing</span>');
    const dir=a.direction==='p1'?'<span class="pill p1">P1</span>':a.direction==='p2'?'<span class="pill p2">P2</span>':'';
    const src=a.key==='winnerUE'?wueSourceBadge(a):'';
    return '<tr class="'+cls+'"><td>'+esc(a.id)+'</td><td>'+esc(a.name)+' '+dir+' '+src+'</td><td>'+st+'</td>'
      + '<td class="num">'+dec(a.signal,3)+'</td><td class="num '+(a.deltaP1>0?'pos':a.deltaP1<0?'neg':'')+'">'+pp(a.deltaP1)+'</td>'
      + '<td class="detail">'+esc(a.detail)+'</td></tr>';
  }).join('');
  body.appendChild($('<table><thead><tr><th>#</th><th>Layer</th><th>Status</th><th>Signal</th><th>ΔP1</th><th>Explanation</th></tr></thead><tbody>'+rows+'</tbody></table>'));

  // Final pricing + edges
  body.appendChild($('<div class="grid">'
    + kv('Fair price', dec(fair.p1&&fair.p1.odds)+' / '+dec(fair.p2&&fair.p2.odds)+' <span class="detail">('+pct(fair.p1&&fair.p1.prob)+')</span>')
    + kv('Edge vs Pinnacle (vig-free)', edgeCell(edgeP1)+' / '+edgeCell(edgeP2)+' <span class="detail">'+esc(sharp.source||'')+'</span>')
    + kv('Edge vs best soft', edgeCell(soft.edge&&soft.edge.p1)+' / '+edgeCell(soft.edge&&soft.edge.p2)+' <span class="detail">'+esc((soft.book&&soft.book.p1)||'')+'</span>')
    + '</div>'));

  // Flag status detail
  body.appendChild($('<div class="flagline">'
    + '<b>Member value flag:</b> '+(showing?'<span class="pos">SHOWING</span> on '+(winP==='p1'?esc(mt.p1):esc(mt.p2)):'<span class="detail">hidden</span>')
    + ' · state '+esc(state)+' · best edge '+pp(bestEdge>-9?bestEdge:null)
    + ' · pinnacleOpen '+esc(fmtTs(openTs))+' ('+(openAgo!=null?dec(openAgo,1)+'h ago':'—')+')'
    + ' · hrs to start '+(hrsToStart!=null?dec(hrsToStart,1):'—')
    + '</div>'));
  if(m.summary&&m.summary.text) body.appendChild($('<div class="detail" style="margin-top:8px">'+esc(m.summary.text)+'</div>'));

  c.querySelector('.hd').onclick=()=>c.classList.toggle('open');
  return c;
}

function kv(k,v){ return '<div class="kv"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'; }
function edgeCell(x){ if(x==null||!isFinite(x)) return '—'; return '<span class="'+(x>0?'pos':x<0?'neg':'')+'">'+pp(x)+'</span>'; }
function statePill(s){ return s===2?'<span class="pill good">State 2</span>':s===1?'<span class="pill warn">State 1</span>':'<span class="pill dim">State '+esc(s)+'</span>'; }
function stateLabel(s){ return s===1?'1 · single-book':s===2?'2 · Pinnacle confirmed':s===3?'3 · Elo-only':String(s); }

// Layer #8 (winnerUE) per-match W/UE data-source badge, for data-quality
// monitoring over time. The pipeline embeds the combined source note in the
// adjustment's `detail` as "(<srcNote>, m/n matches)", where <srcNote> is one
// per-player source ('api-tennis' | 'ATP_Entry_OCR' | 'mixed') or two joined by
// '/' when the two players differ. We collapse that to one of three buckets the
// founder asked for — api-tennis only / mixed / OCR only — favouring the
// conservative reading (any OCR contribution downgrades the badge from pure
// api-tennis). Display-only: reads existing model-output.json, no reprice.
function wueSourceBadge(a){
  if(!a || a.applied!==true) return ''; // parenthetical only present when the layer fires
  const m=/\(([^,()]+),\s*[\d/]+\s*matches\)/.exec(a.detail||'');
  if(!m) return '';
  const raw=m[1].trim();
  const parts=raw.split('/').map(s=>s.trim().toLowerCase());
  const isOcr=s=>s.includes('ocr')||s.includes('atp_entry');
  const isApi=s=>s.includes('api-tennis');
  const anyOcr=parts.some(p=>p==='mixed'||isOcr(p));
  const anyApi=parts.some(p=>p==='mixed'||isApi(p));
  let cls,label;
  if(anyApi&&!anyOcr){ cls='good'; label='api-tennis'; }
  else if(anyOcr&&!anyApi){ cls='dim'; label='OCR'; }
  else { cls='warn'; label='mixed'; } // both present, or any 'mixed' per-player source
  return '<span class="pill '+cls+'" title="W/UE source: '+esc(raw)+'">src: '+label+'</span>';
}

// ---- Section 5: Model state monitor -------------------------------------
function renderSection5(){
  const el=document.getElementById('tab5');
  const model=DATA.model, matches=DATA.matches, health=DATA.health, harvest=DATA.harvest;
  const list=matchList(model);
  el.innerHTML='';

  // Pipeline / feed health
  const lastAgo=agoH(health&&health.lastSuccess);
  const healthPill = health? (health.consecutiveFailures>0?'<span class="pill bad">'+health.consecutiveFailures+' consecutive failures</span>':(lastAgo!=null&&lastAgo<0.75?'<span class="pill good">healthy</span>':'<span class="pill warn">stale ('+dec(lastAgo,1)+'h)</span>')) : '<span class="pill dim">no health file</span>';
  const c1=$('<div class="card open"><div class="hd"><div class="title">Pipeline & feed</div><div>'+healthPill+'</div></div><div class="body"></div></div>');
  c1.querySelector('.body').appendChild($('<div class="grid">'
    + kv('Last pipeline run', fmtTs(health&&health.lastSuccess)+(lastAgo!=null?' <span class="detail">('+dec(lastAgo,1)+'h ago)</span>':''))
    + kv('Last trigger', esc((health&&health.lastTrigger)||'—'))
    + kv('Run duration', health&&health.lastSuccessDurationMs?Math.round(health.lastSuccessDurationMs/1000)+'s':'—')
    + kv('Consecutive failures', esc(health?health.consecutiveFailures:'—'))
    + kv('Last error', (health&&health.lastError)?'<span class="err">'+esc(health.lastError)+'</span>':'<span class="pos">none</span>')
    + kv('api-tennis', (model&&model.generatedAt&&agoH(model.generatedAt)<1)?'<span class="pos">responding</span> <span class="detail">(model fresh)</span>':'<span class="warn" style="color:var(--warn)">unverified</span>')
    + '</div>'));
  el.appendChild(c1);

  // Board coverage stats
  let s1c=0,s2c=0,s3c=0,pinn=0,wue=0;
  list.forEach(([id,m])=>{
    const bs=(m.stage1&&m.stage1.baseState)||{};
    if(bs.state===1)s1c++; else if(bs.state===2)s2c++; else if(bs.state===3)s3c++;
    if(bs.anchorBook==='Pinnacle'||(bs.anchorPrice&&bs.anchorPrice.p1))pinn++;
    const w=((m.stage2&&m.stage2.adjustments)||[]).find(a=>a.key==='winnerUE');
    if(w&&w.applied)wue++;
  });
  const N=list.length||1;
  let weather=0, wxTotal=0;
  if(matches){ const arr=Array.isArray(matches)?matches:(matches.matches||[]); wxTotal=arr.length; weather=arr.filter(x=>x.weather&&x.weather.temperature!=null).length; }

  const c2=$('<div class="card open"><div class="hd"><div class="title">Current board coverage</div><div class="sub">'+list.length+' priced matches</div></div><div class="body"></div></div>');
  c2.querySelector('.body').appendChild($('<div class="grid">'
    + kv('Pinnacle line', pinn+' / '+list.length+coverageBar(pinn,N))
    + kv('State 1 / 2 / 3', '<span style="color:var(--warn)">'+s1c+'</span> / <span class="pos">'+s2c+'</span> / <span class="detail">'+s3c+'</span>')
    + kv('Layer #8 W/UE (api-tennis)', wue+' / '+list.length+coverageBar(wue,N)+'<div class="detail">matches where winnerUE fired on real W/UE</div>')
    + kv('Weather', weather+' / '+wxTotal+coverageBar(weather,wxTotal||1))
    + '</div>'));
  el.appendChild(c2);

  // @ATP_Entry harvest
  const c3=$('<div class="card open"><div class="hd"><div class="title">@ATP_Entry harvest</div></div><div class="body"></div></div>');
  if(harvest){
    c3.querySelector('.body').appendChild($('<div class="grid">'
      + kv('Last seen id', esc(harvest.lastSeenId||harvest.since_id||'—'))
      + kv('Last harvest', fmtTs(harvest.lastRunAt||harvest.updatedAt||harvest.ts))
      + kv('Cards in queue', esc(harvest.queueCount!=null?harvest.queueCount:(harvest.newCards!=null?harvest.newCards:'—')))
      + '</div>'));
  } else {
    c3.querySelector('.body').appendChild($('<div class="stub">Harvest state file is not published to Pages (<code>atp-entry-harvest-state.json</code> is committed to the repo but not in the <code>_site</code> copy list). Exposing it at a public URL is a deliberate choice — flagged for the founder rather than done silently.</div>'));
  }
  el.appendChild(c3);

  if(DATA.errors.length) el.appendChild($('<div class="err" style="margin-top:8px">load warnings: '+esc(DATA.errors.join(' · '))+'</div>'));
}

function coverageBar(n,d){ const p=Math.round(100*n/(d||1)); const col=p>=80?'var(--good)':p>=40?'var(--warn)':'var(--bad)'; return '<div class="barwrap"><div class="bar" style="width:'+p+'%;background:'+col+'"></div></div>'; }

// ---- Sections 2/3/4: value-flag ledger (admin-log.json) -----------------
// admin-log.json = { schema, updated, runs:[{ts,run,priced,logged,flagged,
// newlyLogged,newlyFrozen}], flags:{ id:{ p1,p2,date,surface,tour,status,
// finalScore, valueSnapshot:{fairP1,fairP2,edgeVsPinnacleP1,edgeVsPinnacleP2,ts} }}}.
// The frozen valueSnapshot is written once, on a match's first State-2 entry.
function flagList(){ const al=DATA.adminLog; return (al&&al.flags)?Object.values(al.flags):[]; }
// The flagged (value) side is the one with the positive frozen edge vs Pinnacle.
function valueSide(f){ const vs=f.valueSnapshot||{}; const e1=vs.edgeVsPinnacleP1,e2=vs.edgeVsPinnacleP2;
  if(e1==null&&e2==null) return null; return (e1==null?-9:e1)>=(e2==null?-9:e2)?'p1':'p2'; }
function valueEdge(f){ const vs=f.valueSnapshot||{}; const s=valueSide(f); return s?(s==='p1'?vs.edgeVsPinnacleP1:vs.edgeVsPinnacleP2):null; }
function valueFair(f){ const vs=f.valueSnapshot||{}; const s=valueSide(f); return s?(s==='p1'?vs.fairP1:vs.fairP2):null; }
function avg(xs){ const a=xs.filter(x=>x!=null&&isFinite(x)); return a.length?a.reduce((p,c)=>p+c,0)/a.length:null; }
// admin-log.json is committed to the repo but is NOT in the pipeline's _site copy
// list, so it 404s on Pages. Exposing it publishes internal performance + value
// history at a public URL — a founder decision, flagged not done silently (same
// convention as the @ATP_Entry harvest block in Section 5).
function adminLogStub(tabId,title){
  document.getElementById(tabId).innerHTML='<div class="card"><div class="hd"><div class="title">'+title+'</div><div><span class="pill warn">data not published</span></div></div><div class="body always"><div class="stub"><code>admin-log.json</code> is built every pipeline run and committed to the repo, but it is <b>not in the <code>_site</code> copy list</b>, so it 404s on Pages and this section has no data. Publishing it exposes internal model performance + value-flag history at a public URL — a deliberate choice, flagged for the founder rather than done silently. Approve it (add <code>cp admin-log.json _site/</code> to pipeline.yml) and this section renders automatically.</div></div></div>';
}

// ---- Section 2: pipeline performance log --------------------------------
function renderSection2(){
  const al=DATA.adminLog; if(!al) return adminLogStub('tab2','Section 2 — Performance log');
  const runs=(al.runs||[]).slice().reverse();       // newest first
  const latest=runs[0]||{};
  let h='<div class="card open"><div class="hd"><div class="title">Pipeline performance log</div><div class="sub">'+runs.length+' run'+(runs.length===1?'':'s')+' logged · updated '+esc(fmtTs(al.updated))+'</div></div><div class="body">';
  h+='<div class="grid">'+kv('Latest run','<span class="mono">'+esc(latest.run||'—')+'</span> <span class="detail">'+esc(fmtTs(latest.ts))+'</span>')
    +kv('Priced',esc(latest.priced))+kv('Logged',esc(latest.logged))+kv('Flagged',esc(latest.flagged))+kv('Newly frozen',esc(latest.newlyFrozen))+'</div>';
  h+='<table><thead><tr><th>Run</th><th>Time</th><th class="num">Priced</th><th class="num">Logged</th><th class="num">Flagged</th><th class="num">New log</th><th class="num">New frozen</th></tr></thead><tbody>';
  h+=runs.map(r=>'<tr><td class="mono">'+esc(r.run)+'</td><td>'+esc(fmtTs(r.ts))+'</td><td class="num">'+esc(r.priced)+'</td><td class="num">'+esc(r.logged)+'</td><td class="num">'+esc(r.flagged)+'</td><td class="num">'+esc(r.newlyLogged)+'</td><td class="num">'+esc(r.newlyFrozen)+'</td></tr>').join('')||'<tr><td colspan="7" class="detail">No runs logged yet.</td></tr>';
  h+='</tbody></table></div></div>';
  document.getElementById('tab2').innerHTML=h;
}

// ---- Section 3: value-flag performance summary --------------------------
function renderSection3(){
  const al=DATA.adminLog; if(!al) return adminLogStub('tab3','Section 3 — Summary');
  const flags=flagList();
  const settled=flags.filter(f=>f.status==='finished');
  const pending=flags.filter(f=>f.status!=='finished');
  const avgEdge=avg(flags.map(valueEdge));
  const bySurf={}; flags.forEach(f=>{const s=f.surface||'—';(bySurf[s]=bySurf[s]||[]).push(f);});
  const surfRows=Object.keys(bySurf).sort().map(s=>{const g=bySurf[s];
    return '<tr><td>'+esc(s)+'</td><td class="num">'+g.length+'</td><td class="num">'+g.filter(f=>f.status==='finished').length+'</td><td class="num">'+pp(avg(g.map(valueEdge)))+'</td></tr>';}).join('')||'<tr><td colspan="4" class="detail">No flags yet.</td></tr>';
  let h='<div class="card open"><div class="hd"><div class="title">Value-flag performance summary</div><div class="sub">'+flags.length+' flag'+(flags.length===1?'':'s')+' tracked</div></div><div class="body">';
  h+='<div class="grid">'+kv('Flags tracked',flags.length)
    +kv('Settled / pending','<span class="pos">'+settled.length+'</span> / <span class="detail">'+pending.length+'</span>')
    +kv('Avg edge vs Pinnacle',pp(avgEdge)+' <span class="detail">value side, frozen</span>')+'</div>';
  h+='<table><thead><tr><th>Surface</th><th class="num">Flags</th><th class="num">Settled</th><th class="num">Avg edge</th></tr></thead><tbody>'+surfRows+'</tbody></table>';
  h+='<div class="detail" style="margin-top:8px">Realized hit-rate / CLV / ROI are intentionally not shown: <code>admin-log.json</code> carries no per-flag <code>winner</code> field, and inferring it from <code>finalScore</code> strings (retirements, walkovers) would be unreliable. Wiring a winner into <code>build-admin-log.js</code> is the clean follow-up that unlocks realized performance here — flagged, not faked.</div>';
  h+='</div></div>';
  document.getElementById('tab3').innerHTML=h;
}

// ---- Section 4: value-flag history --------------------------------------
function renderSection4(){
  const al=DATA.adminLog; if(!al) return adminLogStub('tab4','Section 4 — Value-flag history');
  const flags=flagList().slice().sort((a,b)=>String(b.firstSeen||b.date||'').localeCompare(String(a.firstSeen||a.date||'')));
  let h='<div class="card open"><div class="hd"><div class="title">Value-flag history</div><div class="sub">'+flags.length+' flag'+(flags.length===1?'':'s')+' · frozen valueSnapshot per match</div></div><div class="body">';
  if(!flags.length){ h+='<div class="stub">No value flags logged yet.</div>'; }
  else {
    h+='<table><thead><tr><th>Date</th><th>Match</th><th>Surface</th><th>Value on</th><th class="num">Model fair</th><th class="num">Edge vs Pinn</th><th>Status</th><th>Score</th></tr></thead><tbody>';
    h+=flags.map(f=>{
      const side=valueSide(f);
      const sidePill=side==='p1'?'<span class="pill p1">'+esc(f.p1)+'</span>':side==='p2'?'<span class="pill p2">'+esc(f.p2)+'</span>':'—';
      const st=f.status==='finished'?'<span class="pill good">finished</span>':'<span class="pill dim">'+esc(f.status||'pending')+'</span>';
      const e=valueEdge(f);
      return '<tr><td>'+esc(f.date)+'</td><td>'+esc(f.p1)+' vs '+esc(f.p2)+' <span class="detail">'+esc(f.tour||'')+'</span></td><td>'+esc(f.surface)+'</td><td>'+sidePill+'</td><td class="num">'+pct(valueFair(f))+'</td><td class="num '+((e||0)>0?'pos':(e||0)<0?'neg':'')+'">'+pp(e)+'</td><td>'+st+'</td><td class="mono">'+esc(f.finalScore||'—')+'</td></tr>';
    }).join('');
    h+='</tbody></table>';
  }
  h+='</div></div>';
  document.getElementById('tab4').innerHTML=h;
}

function renderStub(tabId,title,note){
  document.getElementById(tabId).innerHTML='<div class="card"><div class="hd"><div class="title">'+title+'</div><div><span class="pill dim">pending valueSnapshot</span></div></div><div class="body always"><div class="stub">'+note+'</div></div></div>';
}
</script>
