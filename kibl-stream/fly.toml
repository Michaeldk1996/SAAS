# TEN-270: runs now_worker.py (the Kibl stream -> live "Now" worker). Deployed by
# .github/workflows/ten270-stream-now.yml, action deploy-worker.
#
# FOUNDER RULING 2026-09-23T04:08Z (TEN-253): **sea**.
#
# The brief said "fill primary_region to match Supabase", but its `[REGION]` was
# the literal unsubstituted placeholder, so the ruling arrived without its value.
# Measured rather than guessed:
#
#   Supabase project  eu-west-1  (Ireland)  — from the Management API, which
#                                             STATES the region. DNS cannot: the
#                                             host resolves to Cloudflare edges
#                                             that geolocate to whoever asks.
#   Kibl broker       us-west-2  (Boardman, Oregon; 34.223.29.158, AS16509)
#
# An ocean apart, ~130 ms, and this worker talks to both continuously — so
# "match Supabase" turned out to be a trade-off, not an instruction. Put as one,
# and the founder ruled for the BROKER: the irreplaceable resource is the
# MESSAGE. Kibl serves no history, so a message missed during a reconnect is
# gone permanently, while a Supabase write is batched and absorbs the latency.
# `sea` is Fly's Seattle region, the nearest to us-west-2.
#
# ⚠️ SUPERSEDED BY FLY ITSELF, TEN-270 2026-09-24T07:24Z (deploy run 35969328376):
#   "Region sea is deprecated and cannot have new resources provisioned.
#    Please consider using an alternate region such as sjc"
# Same test as the ruling — the non-deprecated Fly region nearest the broker
# (Boardman OR): sjc, San Jose, ~900 km, vs ~1,400 km for den/lax. The worker
# measures TCP RTT to the broker at start-up and reports it in its heartbeat,
# so the choice is checked against a measurement, not just the map.
app = "kibl-stream"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"
  # ⚠️ Build from the REPO ROOT, not from this directory — the image copies
  # archive-kibl.py and kibl_client.py, which live at the root because the
  # worker imports the sweep's own row-key function rather than reimplementing it:
  #   fly deploy --dockerfile kibl-stream/Dockerfile --config kibl-stream/fly.toml .

[env]
  WORKER_VERSION = "0.4.1"
  # Writes are opt-in in the code; this deployment is the one place they are on.
  KIBL_NOW_WRITE = "1"
  # bet105 line prices (founder 2026-10-25): their OWN switch, on top of KIBL_NOW_WRITE. "0" = dry run — computed,
  # counted in the heartbeat's `lines`, never written. ON since the 2026-10-25 dry run (deploy 05:33Z, verified
  # 05:47Z: 286 stream rows -> 306 would-be writes, the Now path's counts and write lag unchanged).
  KIBL_LINES_WRITE = "1"
  # Without this, print() is block-buffered in a container with no TTY and the
  # worker's own log never reaches `fly logs` (measured: silent after start).
  PYTHONUNBUFFERED = "1"
  # Card worker pause switch ("1" = no builds; the GitHub card job builds instead). ON again 4 Nov 09:00Z: the 3 Nov
  # database starvation was the Bet105 drop bot re-reading 14 days of kibl_line_observations every 30 s (fixed
  # 4 Nov 05:16Z, ten280_bot.tick_cache, seeded 06:38Z; ticks 3-6 s). The worker builds with the incremental
  # observations read and a 5-min minimum gap (15 min after a failed build; cards_worker.py MIN_GAP_S / FAIL_GAP_S).
  CARDS_PAUSED = "0"

# One machine, always on. `auto_stop_machines = false` is the whole point: a
# worker that scales to zero is a worker that is not listening, and this exists
# precisely to be listening between our sweeps.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["app"]

# Architecture program stage 3 (2026-11-03): the card-state worker, its OWN machine in this app (same image, same
# secrets, same deploy token), so the stream's machine is never shared with a heavy job. Every 10 min it builds the
# card state from a fresh clone of main and writes the published doc to public.card_state_doc (cards_worker.py).
# 1 GB: the builder holds ~68k card rows + ~45k observations + ~62k Oddspapi fixtures in memory.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["cards"]

[processes]
  app = "python3 kibl-stream/now_worker.py"
  cards = "python3 kibl-stream/cards_worker.py"

# NO [http_service] AND NO [[services]] BLOCK, and that is the correction.
#
# The previous revision carried:
#     [http_service]
#       auto_stop_machines = false
#       min_machines_running = 1
# This worker serves no HTTP. Fly's autostop/autostart machinery lives under a
# service and is driven by REQUEST traffic — so an http_service block on a
# process with no listener asks the platform to make availability decisions from
# a signal that can never arrive, and `fly deploy` would additionally have
# failed its health check on a port nothing binds.
#
# A Fly app with no service defined has nothing to stop it: the machine runs
# until it is stopped explicitly. That is exactly the always-on behaviour
# wanted, expressed by the absence of a service rather than by flags on one that
# does not exist.
#
# ⚠️ UNVERIFIED AGAINST A REAL DEPLOY. Nothing here has been run through
# `fly deploy` or even `fly config validate` — there is no Fly account or CLI in
# this environment, and deploying is not authorised. Treat this file as a
# reviewed draft, and expect to run `fly config validate` as step 1 of launch.
