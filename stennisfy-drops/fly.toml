# TEN-294: the stennisfy-drops endpoint (founder ruling 2026-09-26: path B′, a SEPARATE Fly app — not Pages,
# not kibl-stream). Rules: .claude/rules/drops.md. Deployed by .github/workflows/ten294-drops.yml with the
# app-scoped token FLY_DROPS_API_TOKEN (never printed).
#
# Region: lhr (London), the nearest Fly region to the Supabase project (eu-west-1, Dublin) — every read goes
# there and nothing else does. The deploy workflow checks lhr is not deprecated (the kibl-stream `sea` trap)
# before deploying, and /status.json carries the measured read time.
app = "stennisfy-drops"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ALLOWED_ORIGINS = "https://michaeldk1996.github.io"

# ALWAYS ON. The read loop IS the cache: a machine stopped for lack of traffic would wake to the first
# viewer with no fresh snapshot. Hence autostop off and one machine always running.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/status.json"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
