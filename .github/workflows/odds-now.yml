name: BSP odds capture loop

# TEN-179 item 1, founder authorised 2026-09-11: ONE job that loops internally
# instead of one cron delivery per capture.
#
# THE MEASUREMENT THAT CAUSED THIS
#   Configured: `0 * * * *`. Delivered: 3 of 11 slots = 27%, gaps of 2.6-2.7h.
#   odds-history.yml at `0 */3 * * *` delivered ~5/day against 8. That shortfall
#   is what left a NOW price 76 minutes behind a bet365 move — the write path and
#   the pipeline's observedAt/capturedAt guard were both healthy throughout.
#   A tighter cron does not help: GitHub sheds short-interval schedules first.
#
# WHAT CHANGED, AND WHAT DELIBERATELY DID NOT
#   Changed: one delivery now buys ~5h30m of 15-minute captures instead of one.
#   NOT changed: the METERED cadence. refresh-odds.py still runs once an hour —
#   flat hourly is the approved option (a) and this loop exists to make hourly
#   real, not to spend more. The 15-minute tick runs only the FREE
#   /v4/historical-odds sweep (item 3), which bills nothing and is asserted
#   against the live meter every run.
#
# THE SCHEDULE IS NOW A SUPERVISOR, NOT A CAPTURE TRIGGER
#   The hourly cron no longer times a capture; it restarts the loop. Combined
#   with the concurrency queue below, a tick that arrives while a loop is
#   running simply waits and becomes its successor — so a loop that dies (or is
#   cancelled, or hits its timeout) is replaced by the pending run immediately
#   rather than after the next delivered cron slot. Coverage survives a 27%
#   delivery rate because it only takes ONE delivery to restart.
#
# SETUP: repo secrets ODDSPAPI_KEY (required), TELEGRAM_BOT_TOKEN +
# TELEGRAM_OPS_CHAT_ID for the quota-runway alert.

on:
  schedule:
    - cron: '0 * * * *'     # supervisor tick; one delivered slot restarts the loop
  workflow_dispatch:

# Queue, never cancel. GitHub holds at most one running + one pending run per
# group, so the hourly ticks collapse into a single standing successor that
# takes over the moment the current loop ends. cancel-in-progress MUST stay
# false — cancelling the running loop mid-window is precisely the interrupt this
# design is built to avoid.
concurrency:
  group: bsp-odds-now
  cancel-in-progress: false

permissions:
  contents: write
  # actions: write is what lets the loop queue its OWN successor before standing down
  # on a stale checkout (TEN-179 item 4). Without it the loop would exit and wait for a
  # delivered cron slot, and Actions delivers ~27% of an hourly schedule — so the fix
  # for "a shipped change waits 5h30m" would have created a capture gap of its own.
  actions: write

jobs:
  capture-loop:
    runs-on: ubuntu-latest
    # LOOP_MINUTES (330) + headroom for the final iteration's API pacing and
    # push. GitHub hard-caps a job at 360 minutes; staying under it means we
    # exit on our own terms, having committed everything, rather than being
    # killed at the cap.
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run the capture loop
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OPS_CHAT_ID: ${{ secrets.TELEGRAM_OPS_CHAT_ID }}
          # Used only to dispatch this same workflow as the loop's successor.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$ODDSPAPI_KEY" ]; then
            echo "::error::ODDSPAPI_KEY secret is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          chmod +x odds-capture-loop.sh ci-commit-push.sh
          ./odds-capture-loop.sh

      # A safety net only. The loop commits after EVERY iteration (see
      # ci-commit-push.sh), so in the normal case — and on a trapped SIGTERM —
      # this finds nothing to do. It exists for the kill modes bash cannot trap,
      # such as the runner being evicted outright.
      - name: Flush any uncommitted capture
        if: always()
        run: |
          chmod +x ci-commit-push.sh
          ./ci-commit-push.sh "chore(odds): flush capture at job end [skip ci]" \
            matches.json odds-fixture-map.json odds-quota-history.json \
            alert-state.json odds-open-monitor.json odds-capture-cadence.json \
            odds-now-staleness.json || true
