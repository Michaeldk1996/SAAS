name: probe-te
on:
  push:
    branches: ['claude/probe-*']
    paths: [tools/probe-te/**]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: bash tools/probe-te/bergs.sh
