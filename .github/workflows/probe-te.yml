name: probe-te
on:
  push:
    branches: ['claude/probe-*']
    paths: [tools/probe-te/**]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe-te/queue.py
        env:
          OPS_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          STORE_TOKEN: ${{ secrets.TE_STORE_READ_TOKEN }}
