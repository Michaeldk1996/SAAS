name: probe-te
on:
  push:
    branches: ['claude/probe-*']
    paths: [tools/probe-te/**]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/probe-te/run.sh
        env:
          TE_STORE_READ_TOKEN: ${{ secrets.TE_STORE_READ_TOKEN }}
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
