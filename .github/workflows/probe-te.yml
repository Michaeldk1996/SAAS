name: probe-te
on:
  push:
    branches: ['claude/probe-*']
    paths: [tools/probe-te/**]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe-te/timing.py
        env:
          GH_TOKEN: ${{ github.token }}
