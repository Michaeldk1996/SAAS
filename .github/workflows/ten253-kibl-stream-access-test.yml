name: TEN-253 Kibl stream access test

# ⚠️ BRANCH ten274-probe ONLY — this file on main is untouched. It is reused as a
# dispatch vehicle (a workflow must exist on main to be dispatched; the run
# executes the dispatched ref's copy). TEN-274: read-only REST probe.
# No RabbitMQ connection, no Supabase writes, contents: read, artifact only.

on:
  workflow_dispatch:
    inputs:
      listen_minutes:
        description: 'Live poll window in minutes'
        required: true
        default: '90'
      drop_minutes:
        description: 'Poll interval seconds (reused input)'
        required: true
        default: '5'

concurrency:
  group: ten253-kibl-stream-access-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  access-test:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: TEN-274 read-only REST probe
        env:
          KIBL_USERNAME: ${{ secrets.KIBL_USERNAME }}
          KIBL_PASSWORD: ${{ secrets.KIBL_PASSWORD }}
          KIBL_CLIENT_ID: ${{ secrets.KIBL_CLIENT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TEN274_POLL_MIN: ${{ inputs.listen_minutes }}
          TEN274_POLL_S: ${{ inputs.drop_minutes }}
          TEN274_START_AT: "2026-09-25T04:45:00Z"
          TEN274_OUT: ${{ github.workspace }}/ten274-out
        run: python3 ten274-probe.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ten274-probe
          path: ten274-out/
          retention-days: 7
          if-no-files-found: warn
