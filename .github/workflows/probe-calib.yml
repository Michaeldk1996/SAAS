name: probe-calib
on:
  push:
    branches:
      - claude/wonderful-fermat-clvs94
    paths:
      - tools/probe-calib/**
      - .github/workflows/probe-calib.yml
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bash tools/probe-calib/run.sh
        env:
          TE_STORE_READ_TOKEN: ${{ secrets.TE_STORE_READ_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
