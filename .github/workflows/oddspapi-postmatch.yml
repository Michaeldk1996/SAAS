name: BSP oddspapi post-match archive

# TEN-270. Founder rulings (verbatim):
#   "Find a way to archive it straight after the game."
#   "Separate 15-min job, offset so it never runs at the same minute as the odds
#    loop (e.g. :07, :22, :37, :52). On a 429 it backs off and retries next run;
#    the live price loop always wins the key. Report 429 counts for both jobs
#    after 24 h."
#
# Pulls every FINISHED board match that has an oddspapi fixtureId and no object
# in the private `oddspapi-raw` bucket yet, into the same canonical path the
# daily oddspapi-raw-archive.yml uses (which then skips it), and projects the
# bet365 match-winner ticks of bet365 cards into `bet365_mw_ticks` for the
# price-history box. `archive-oddspapi-raw.py postmatch`.
#
# COST: zero billable calls. Only /v4/historical-odds (free, ~1 call / 5 s per
# key) and /v4/account (the meter, read before and after the pulls). The script
# refuses any other oddspapi path. No budget gate: the gate reserves metered
# units, and this job spends none.
#
# THE KEY IS SHARED with the odds loop (odds-now.yml), which ticks at
# :00/:15/:30/:45 and has run up to 590 s. Before every call the script needs
# BOTH :05-:14 of the quarter hour AND the loop's own evidence that its
# iteration is over (no odds-now run in progress, or its `capture tick` commit
# on main since the quarter hour — read with this job's GITHUB_TOKEN). It stops
# the run (exit 0) on the first 429.
#
# ONE TRIGGER ONLY (founder 2026-09-25: "install the dispatcher and remove the
# GitHub schedule"). The pg_cron job in oddspapi-postmatch-pinger.sql dispatches
# this workflow at :07/:22/:37/:52; it is applied by ten270-stream-now.yml
# action=schema. There is deliberately NO `schedule:` here — both active would
# fire every slot twice (test-oddspapi-postmatch.py, section 8e).
#
# mode=verify-report prints the 20-fixture completeness table (read-only: no
# oddspapi call, no write).
#
# Commits nothing. The run's counts, 429s included, are in the job log and in
# the bucket at _meta/postmatch-last-run.json.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'postmatch (the pinger''s run) | verify-report (read-only)'
        required: false
        default: 'postmatch'

concurrency:
  group: bsp-oddspapi-postmatch
  cancel-in-progress: false

permissions:
  contents: read
  actions: read                # the loop gate reads odds-now's in-progress runs

jobs:
  postmatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            archive-oddspapi-raw.py
            ten225_names.py
            test-oddspapi-postmatch.py
            test-archive-oddspapi-raw.py
            kibl-stream/now-schema.sql
            kibl-now-stream.js
            line-prices-schema.sql
            matches.json
            odds-fixture-map.json
            odds-card-state.json
            oddspapi-postmatch-pinger.sql
            ten216-collector-watchdog.sql
            .github/workflows/
            supabase/migrations/
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Guard — credentials present
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          missing=
          [ -z "$ODDSPAPI_KEY" ] && missing="$missing ODDSPAPI_KEY"
          [ -z "$SUPABASE_URL" ] && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_SECRET_KEY" ] && missing="$missing SUPABASE_SECRET_KEY"
          if [ -n "$missing" ]; then
            echo "::error::missing secret(s):$missing"
            exit 1
          fi
          echo "all three credentials present"

      # Offline, before anything touches the key or the bucket: the target rule,
      # the wait, the checkpoint, the 429 stop, the 404 record, zero billable.
      - name: Unit tests (offline)
        run: |
          python3 test-archive-oddspapi-raw.py
          python3 test-oddspapi-postmatch.py

      - name: Completeness report (read-only)
        if: inputs.mode == 'verify-report'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 archive-oddspapi-raw.py postmatch-verify-report | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Post-match archive
        if: inputs.mode != 'verify-report'
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 archive-oddspapi-raw.py postmatch

  # Founder brief 2026-10-14 (item 2): after each ATP / Challenger match starts, pull its free /v4/historical-odds
  # (pinnacle+30) in the first key window, store the payload in the permanent Pinnacle archive and derive the close at
  # our live-flip start (tools/pinarch.py pull; .claude/rules/pinnacle-archive.md). Runs AFTER the post-match job, so
  # the two never call Oddspapi at once; the same key gate (the :05–:14 window + loop_idle) applies to every call.
  pinnacle-history:
    needs: postmatch
    if: always() && inputs.mode != 'verify-report'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/pinarch.py
            archive-oddspapi-raw.py
            ten225-load-line-summary.py
            refresh-odds-history.py
            chart_series.py
            odds-fixture-map.json
          sparse-checkout-cone-mode: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Oddspapi fixtures cache (one metered /v4/fixtures call per 6-day window, re-asked every 6 h)
        uses: actions/cache@v4
        with:
          path: .pinarch-fixtures.json
          key: pinarch-fixtures-${{ github.run_id }}
          restore-keys: pinarch-fixtures-
      - name: Pull and derive the Pinnacle history of the matches that just started
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PINARCH_FIXTURES: .pinarch-fixtures.json
        run: python3 tools/pinarch.py pull --budget 600
  # founder 2026-11-06 ("price it about 30-45 minutes after the match, automatically", "every match, everywhere"): every
  # dispatch (pg_cron, :07/:22/:37/:52) also prices today's and yesterday's finished matches at every level that hold no
  # snapshot yet (ATP main draw: the before-start Pinnacle snapshot; lower levels: api-tennis's stored prices), with
  # the self-heal (an unmapped match is mapped, a missing payload pulled). Insert-only; the next data run publishes it.
  # It shares te-import-scheduled.yml's lock so two archive writers never run at once. A failure here is caught by the
  # 3-hourly run of the same import, which alerts.
  before-start-prices:
    needs: pinnacle-history
    if: always() && inputs.mode != 'verify-report'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: historical-archive
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refuse to run off main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then echo "::error::the archive jobs run from main only (got ${GITHUB_REF})"; exit 1; fi
      - name: Pinnacle (approx.) before the start — today's finished matches (insert-only)
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        # ATP first (founder 2026-11-06): three days back, so a match the run before missed (fixture not mapped yet,
        # payload not out yet) heals on the next 15-minute run instead of waiting for the 3-hourly one (Paris 3-4 Nov)
        run: python3 tools/tdarch.py sched-import --recent 3 --fresh
      # Challenger, qualifying, ITF and the team events: api-tennis's stored Pinnacle / Bet365 / other-book prices for today's
      # and yesterday's finished matches with no snapshot yet (the daily 05:17 run re-checks the whole window and writes
      # the unpriced list; this run writes no list)
      - name: Lower levels — today's finished matches (insert-only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        run: python3 tools/tdarch.py lower-import --recent 1 --fresh
