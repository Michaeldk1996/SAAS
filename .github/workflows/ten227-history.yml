name: TEN-227 match-winner history download

# TEN-227, board ruling 4 (2026-09-17T10:23Z): download the full BetsAPI
# match-winner SERIES per match, 2026 first and then backwards to 2020, using
# what is left of the trial window after the upcoming campaign's needs. Report
# bytes per match before loading and the projected total; stop if it passes 25%
# of the database.
#
# REPORT ONLY. Nothing here is a product surface, and nothing here writes
# outside tables prefixed `betsapi_raw_`.
#
# ISOLATION
#   * No `schedule:` trigger. It runs only when dispatched and hands off to its
#     own successor, because this repo's cron has been throttled to 27%
#     delivery before and a trial window does not wait for GitHub.
#   * A DDL allowlist, unit-tested BEFORE the job may reach the database, is the
#     only thing standing between this download and the TEN-216 / TEN-225 / live
#     pipeline tables the brief says not to touch.
#   * Makes no Oddspapi and no api-tennis call at all.
#
# BUDGET
#   * 1,000 BetsAPI requests/hour. The TEN-227 upcoming campaign is already
#     spending 400/h and the brief's ceiling is 1,600/h: 400 + 1,000 = 1,400.
#   * Each successor re-reads its own checkpoint table, so a killed run costs
#     one day of the calendar, never a year.
#
# TEN-221 RULINGS, as implemented below
#   * 5-minute redispatch floor — a run that ends sooner waits out the remainder.
#   * Circuit breaker — three consecutive failed runs of this workflow stop the
#     chain instead of re-dispatching into the same wall.
#
# OFF SWITCH: re-dispatch with stop=yes, or disable this workflow in the UI.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'setup | size | download | report'
        required: true
        default: 'size'
      years:
        description: 'Comma-separated, newest first'
        required: false
        default: '2026,2025,2024,2023,2022,2021,2020'
      download_minutes:
        description: 'Minutes to download before handing off to a successor'
        required: false
        default: '300'
      download_max_req:
        description: 'BetsAPI request ceiling for this run'
        required: false
        default: '4500'
      max_matches:
        description: 'Stop once the table holds this many matches (0 = no cap)'
        required: false
        default: '0'
      rate_per_hour:
        description: 'BetsAPI requests/hour for this tool (campaign uses 400 of the 1,600)'
        required: false
        default: '1000'
      trial_end:
        description: 'ISO UTC after which no successor is dispatched'
        required: false
        default: ''
      stop:
        description: 'Set to "yes" to stand down without re-dispatching'
        required: false
        default: 'no'

concurrency:
  group: ten227-history          # a second dispatch queues; it never double-downloads
  cancel-in-progress: false

permissions:
  contents: read
  actions: write                 # lets the download dispatch its own successor

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # The allowlist and the ruling-1 Close derivation, both tested BEFORE
      # anything can reach the database or spend a request.
      - name: Guard test — DDL allowlist, Close derivation, scope filter
        run: node --test tools/test-ten227-history.js

      - name: Run
        id: run
        env:
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BETSAPI_RATE_PER_HOUR: ${{ github.event.inputs.rate_per_hour }}
          HISTORY_YEARS: ${{ github.event.inputs.years }}
          DOWNLOAD_MINUTES: ${{ github.event.inputs.download_minutes }}
          DOWNLOAD_MAX_REQ: ${{ github.event.inputs.download_max_req }}
          DOWNLOAD_MAX_MATCHES: ${{ github.event.inputs.max_matches }}
        run: |
          set -o pipefail
          node tools/ten227-history.mjs "${{ github.event.inputs.mode }}" 2>&1 | tee run.log
          rc=${PIPESTATUS[0]}
          # A `tee` without pipefail reports the tee's exit code, which is how a
          # dead probe once produced a green run on this repo. Keep both.
          exit $rc

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ten227-history-${{ github.event.inputs.mode }}-${{ github.run_id }}
          path: |
            betsapi-out/
            run.log
          if-no-files-found: warn
          retention-days: 14

      # Hand off only while calendar days remain unfetched. The tool writes
      # more_work=0 once every day of every in-scope year is marked done, which
      # is how this chain ENDS rather than running forever.
      - name: Hand off to successor
        if: ${{ always() && github.event.inputs.mode == 'download' && github.event.inputs.stop != 'yes' && steps.run.outputs.more_work != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TRIAL_END: ${{ github.event.inputs.trial_end }}
        run: |
          set -euo pipefail

          # --- the trial wall. Past it, every request 403s and a successor
          # would just burn Actions minutes discovering that.
          if [ -n "${TRIAL_END:-}" ]; then
            if [ "$(date -u +%s)" -ge "$(date -u -d "$TRIAL_END" +%s)" ]; then
              echo "::notice::past trial_end ${TRIAL_END} — standing down"; exit 0
            fi
          fi

          # --- TEN-221 circuit breaker: three consecutive failed runs stop the
          # chain. Counted from the API, not from this run's own memory, so a
          # crash loop cannot reset it.
          FAILS=$(gh run list --workflow ten227-history.yml --limit 3 \
                    --json conclusion,status --jq \
                    '[.[] | select(.status=="completed") | .conclusion] | if length==3 and all(.[]; .!="success") then 3 else 0 end')
          if [ "$FAILS" = "3" ]; then
            echo "::error::three consecutive non-success runs — circuit breaker OPEN, not dispatching"
            exit 1
          fi

          # --- TEN-221 5-minute redispatch floor.
          STARTED=$(gh run view "${GITHUB_RUN_ID}" --json createdAt --jq '.createdAt')
          AGE=$(( $(date -u +%s) - $(date -u -d "$STARTED" +%s) ))
          if [ "$AGE" -lt 300 ]; then
            echo "run was only ${AGE}s long — waiting out the 5-minute floor"
            sleep $(( 300 - AGE ))
          fi

          BEFORE=$(gh run list --workflow ten227-history.yml --limit 20 --json databaseId \
                     --jq 'map(.databaseId) | max')
          # Standing rule (founder, 2026-09-19): "a self-chaining workflow runs
          # from main or it does not run." Was --ref of the run's own ref_name,
          # which is what let ten227-upcoming chain from its own branch past the
          # ruling that stopped it, with the gated copy on main never executing.
          gh workflow run ten227-history.yml --ref main \
             -f mode=download \
             -f years="${{ github.event.inputs.years }}" \
             -f download_minutes="${{ github.event.inputs.download_minutes }}" \
             -f download_max_req="${{ github.event.inputs.download_max_req }}" \
             -f max_matches="${{ github.event.inputs.max_matches }}" \
             -f rate_per_hour="${{ github.event.inputs.rate_per_hour }}" \
             -f trial_end="${TRIAL_END}" \
             -f stop=no
          # A dead chain and a healthy one otherwise produce identical logs.
          for i in $(seq 1 12); do
            sleep 5
            AFTER=$(gh run list --workflow ten227-history.yml --limit 20 --json databaseId \
                      --jq 'map(.databaseId) | max')
            if [ "$AFTER" != "$BEFORE" ]; then
              echo "successor dispatched: run $AFTER"; exit 0
            fi
          done
          echo "::error::successor run never appeared — the download chain is BROKEN"
          exit 1
