name: Deploy Whop Webhook (Firebase Functions)

# Manual, one-click deploy of the whopWebhook Cloud Function.
# No terminal needed: set the repository secrets (below), then run this
# workflow from the GitHub Actions tab -> "Run workflow".
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   FIREBASE_SERVICE_ACCOUNT  - full JSON of a service-account key with deploy
#                               rights on project tennis-edge-75cd9
#   WHOP_WEBHOOK_SECRET       - the whsec_... value from the Whop webhook
#   WHOP_API_KEY              - (recommended) Whop API key that can read
#                               memberships and member emails
# The Sharp / Sharp+ product ids are in functions/index.js (PRODUCT_TIER).

on:
  workflow_dispatch:

concurrency:
  group: deploy-whop-webhook
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # TEN-273: every job carries a timeout-minutes so none can hold a runner indefinitely.
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT: tennis-edge-75cd9
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-sa.json
    steps:
      - name: Check out the Whop integration branch
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install function dependencies
        working-directory: functions
        run: npm install

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service-account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing repository secret FIREBASE_SERVICE_ACCOUNT"; exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Write function params (functions/.env)
        env:
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
          WHOP_WEBHOOK_SECRET: ${{ secrets.WHOP_WEBHOOK_SECRET }}
        run: |
          if [ -z "$WHOP_WEBHOOK_SECRET" ]; then
            echo "::error::Missing repository secret WHOP_WEBHOOK_SECRET"; exit 1
          fi
          if [ -z "$WHOP_API_KEY" ]; then
            echo "::warning::No WHOP_API_KEY: buyers are matched only when the webhook carries their email"
          fi
          # Written from GitHub secrets at deploy time, never committed. The
          # function reads both with defineString (no Secret Manager IAM needed).
          printf 'WHOP_WEBHOOK_SECRET=%s\nWHOP_API_KEY=%s\n' "$WHOP_WEBHOOK_SECRET" "$WHOP_API_KEY" > functions/.env

      - name: Self-check the access logic
        run: node functions/test/access.test.js

      - name: Deploy whopWebhook
        run: |
          firebase deploy --only functions:whopWebhook \
            --project "$FIREBASE_PROJECT" --non-interactive --force

      - name: Print webhook URL
        run: |
          echo "Deployed. Configure this URL in Whop -> Settings -> Webhooks:"
          echo "https://us-central1-${FIREBASE_PROJECT}.cloudfunctions.net/whopWebhook"
