# Code gate — every `npm test` command, once per code commit on main, split across machines.
#
# Founder 2026-10-12 ("do not mix the data with it and wait so long"): code and data deploy on their own clocks.
# This workflow tests CODE; publish.yml publishes only a commit whose gate passed here. Data-bot commits carry
# [skip ci] and start no run, so a run here is always a code commit.
#
# TEN-351 holds: every command runs, exactly once per code commit (de-duplicated across the 10-minute data
# rebuilds, which the ruling allows; never skipped, never after publishing). The shard plan is gate-run.mjs's own
# (deterministic), so the GATE_SHARDS machines together run every command exactly once. The run passes only when
# every shard passed.
#
# A newer code push cancels an older run still in progress: publish.yml publishes the newest gated commit, so the
# older result could never be published anyway.
name: Code gate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: code-gate-${{ github.ref }}   # per branch: a branch run (dispatch) never cancels main's gate
  cancel-in-progress: true

permissions:
  contents: read

env:
  GATE_SHARDS: 6

jobs:
  shard:
    name: shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Draw source (founder brief 2026-10-20, C): tools/test-draws.py parses the official draw-sheet PDFs with pymupdf.
      # Pinned; --user keeps the runner's system python3 for every other python suite.
      - name: Install the draw-sheet parser (pymupdf, pinned)
        run: python3 -m pip install --quiet --user --break-system-packages 'pymupdf==1.26.5'

      - name: Run this shard of every npm test command
        run: node tools/gate-run.mjs --shards "$GATE_SHARDS" --shard ${{ matrix.shard }}

  # Architecture program stage 5 (2026-11-05): the data pipeline's fail-closed gates (archive chain + archive gate,
  # market shards, Series row gate, the reconcile suite, the H2H reconciliation) run with THIS commit's code against the
  # DEPLOYED store (the newest site-data artifact). A code change that would trip one fails here, and pipeline.yml builds
  # data only with gated code (tools/gated-code.mjs), so the site's data keeps flowing instead of freezing. Read-only:
  # the archive exports are SELECTs, nothing is committed, uploaded or sent. No store or no archive = SKIPPED out loud.
  data-dry-run:
    name: data dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download the deployed store (the newest site-data artifact)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          AID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=site-data&per_page=5" -q '[.artifacts[] | select(.expired|not)][0].id' 2>/dev/null)
          if [ -z "$AID" ] || [ "$AID" = null ]; then echo "::warning::no site-data artifact — the dry-run will skip out loud"; exit 0; fi
          for i in 1 2 3; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AID/zip" > .site-data.zip && unzip -q -o .site-data.zip -d .deployed-site && break
            echo "::warning::download attempt $i failed"; rm -rf .deployed-site .site-data.zip; sleep 10
          done
          rm -f .site-data.zip
          ls .deployed-site 2>/dev/null | wc -l

      - name: The data gates on this code (tools/data-dry-run.sh)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        run: bash tools/data-dry-run.sh .deployed-site

  result:
    name: all shards passed
    needs: [shard, data-dry-run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed, or the gate fails
        run: |
          echo "shards: ${{ needs.shard.result }} · data dry-run: ${{ needs['data-dry-run'].result }}"
          [ "${{ needs.shard.result }}" = "success" ] || { echo "::error title=Code gate::a shard failed or did not run. This commit is not published."; exit 1; }
          [ "${{ needs['data-dry-run'].result }}" = "success" ] || { echo "::error title=Code gate::the data dry-run failed or did not run. This commit is not published and the data pipeline does not build with it."; exit 1; }
