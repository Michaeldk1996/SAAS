name: TEN-270 Kibl stream -> live Now

# MANUAL ONLY. Four actions:
#   schema         apply kibl-stream/now-schema.sql (idempotent), then `verify`
#   verify         prove, WITH THE PAGE'S OWN PUBLISHABLE KEY, that the browser
#                  can SELECT kibl_now_price and nothing else: history refused,
#                  inserts refused. Also that the table is in supabase_realtime.
#   deploy-worker  build + deploy now_worker.py to Fly (kibl-stream/fly.toml,
#                  region sjc). Needs the FLY_API_TOKEN repository secret; the
#                  Kibl + Supabase credentials go from GitHub secrets straight
#                  into Fly secrets over stdin — never into a log or an argv.
#   status         read the worker's heartbeat row and the price-table counts.
#   realtime-config  READ the project's Realtime settings; with `max_events` set,
#                  PATCH max_events_per_second to it (08:58Z brief, item 4) and
#                  read them back.
#   unpublish-price  take kibl_now_price out of supabase_realtime (after the
#                  new page has been live long enough for old tabs to reload).
#   usage          READ-ONLY: the API gateway's response bytes by route and
#                  caller over the log window (08:58Z brief, egress question).
#   heartbeat-check  READ-ONLY: Realtime writes vs realtime_logs over `window`
#                  (TEN-277, the founder's Realtime Messages readings).
#
# Nothing here touches the poller, its tables, or its workflows.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'schema | verify | deploy-worker | status | logs | realtime-config | usage | unpublish-price | heartbeat-check'
        required: true
        default: 'status'
      max_events:
        description: 'realtime-config only: new max_events_per_second (blank = read only)'
        required: false
        default: ''
      window:
        description: 'heartbeat-check only: START..END as ISO Z (blank = the first reading, 2026-09-24T08:54:00Z..2026-09-25T00:52:00Z)'
        required: false
        default: ''

concurrency:
  group: ten270-stream-now
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Schema / verify / status
        if: inputs.action != 'deploy-worker' && inputs.action != 'logs'
        env:
          ACTION: ${{ inputs.action }}
          MAX_EVENTS: ${{ inputs.max_events }}
          WINDOW: ${{ inputs.window }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # TEN-270 post-match dispatcher: the PAT the pg_cron job dispatches with.
          # Stored in Vault as gh_postmatch_dispatch_pat; never printed.
          POSTMATCH_DISPATCH_PAT: ${{ secrets.POSTMATCH_DISPATCH_PAT }}
          # bsp_alerts.py's Telegram bot + ops chat: copied into Vault for the
          # dispatcher's dead-token alarm (ops_telegram_bot_token / _chat_id).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OPS_CHAT_ID: ${{ secrets.TELEGRAM_OPS_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.parse, urllib.request, urllib.error
          act = os.environ["ACTION"]
          url = os.environ["SUPABASE_URL"].rstrip("/")
          ref = (urllib.parse.urlparse(url).hostname or "").split(".")[0]
          print(f"::add-mask::{ref}")
          def call(u, method="GET", body=None, key=None, bearer=None, prefer=None):
              req = urllib.request.Request(u, method=method,
                                           data=None if body is None else json.dumps(body).encode())
              if key: req.add_header("apikey", key)
              req.add_header("Authorization", "Bearer " + (bearer or key))
              req.add_header("Content-Type", "application/json")
              if prefer: req.add_header("Prefer", prefer)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()
          def sql(q):
              return call(f"https://api.supabase.com/v1/projects/{ref}/database/query", "POST",
                          {"query": q}, bearer=os.environ["SUPABASE_ACCESS_TOKEN"])
          # Logs API (TEN-277). `analytics/endpoints/logs.all` answers 410 since
          # 2026-09-23. Its replacement takes ClickHouse SQL over ONE table, `logs`,
          # filtered by source_name, with nested fields in the log_attributes map
          # (log_attributes['request.path'], not unnest(metadata)). The source column
          # is `source` ('edge_logs', 'realtime_logs'; the changelog's `source_name`
          # does not exist here). Keys are from Supabase's log field reference; a
          # wrong key reads as '' — a silent zero — so each action prints the keys
          # it found first. Window params must end in Z; ~14 queries then 429.
          def z(x):
              return x.strftime("%Y-%m-%dT%H:%M:%S.000Z")   # the API refuses "+00:00"
          def logq(text, lo, hi):
              import time as _t
              qs = urllib.parse.urlencode({"sql": text, "iso_timestamp_start": z(lo), "iso_timestamp_end": z(hi)})
              for wait in (0, 45, 90, 120):
                  _t.sleep(wait)
                  st, r = call(f"https://api.supabase.com/v1/projects/{ref}/analytics/endpoints/logs?{qs}",
                               bearer=os.environ["SUPABASE_ACCESS_TOKEN"])
                  if st != 429:
                      break
              try:
                  body = json.loads(r) if st == 200 else None
              except ValueError:
                  body = None
              rows = body.get("result") if isinstance(body, dict) and not body.get("error") else None
              return st, rows, r
          bad = []
          if act == "schema":
              st, r = sql(open("kibl-stream/now-schema.sql").read())
              print(f"schema apply HTTP {st}")
              if st >= 400:
                  print(r[:500]); sys.exit(1)
              # TEN-270 post-match dispatcher (founder 2026-09-25). The PAT goes to
              # Vault the way ten232-kibl-sweep-cron.py stores its own: delete +
              # vault.create_secret under this job's OWN name. Absent PAT = the
              # vault write is skipped and the pinger installs fail-safe (it
              # dispatches nothing and logs a WARNING until the secret exists).
              pat = (os.environ.get("POSTMATCH_DISPATCH_PAT") or "").strip()
              if pat:
                  lit = "'" + pat.replace("'", "''") + "'"
                  st, r = sql("delete from vault.secrets where name = 'gh_postmatch_dispatch_pat'; "
                              f"select vault.create_secret({lit}, 'gh_postmatch_dispatch_pat', "
                              "'TEN-270 post-match dispatch PAT');")
                  print(f"vault gh_postmatch_dispatch_pat store -> HTTP {st}")
                  # A warning, not a failure: the schema above is already applied, and a
                  # pinger with no secret dispatches nothing (odds.md, post-match trigger).
                  if st >= 400: print(f"::warning::post-match PAT not stored in Vault (HTTP {st})")
              else:
                  print("POSTMATCH_DISPATCH_PAT not set: the Vault secret gh_postmatch_dispatch_pat is left exactly as it is")
              # The alarm's Telegram credentials, same path: copy only when the repo
              # secret exists, never printed, a failure is a warning.
              for env_name, vault_name in (("TELEGRAM_BOT_TOKEN", "ops_telegram_bot_token"),
                                           ("TELEGRAM_OPS_CHAT_ID", "ops_telegram_chat_id")):
                  val = (os.environ.get(env_name) or "").strip()
                  if not val:
                      print(f"{env_name} not set: Vault {vault_name} left as it is (alerts are recorded as unsent until it exists)")
                      continue
                  lit = "'" + val.replace("'", "''") + "'"
                  st, r = sql(f"delete from vault.secrets where name = '{vault_name}'; "
                              f"select vault.create_secret({lit}, '{vault_name}', 'TEN-270 post-match alarm');")
                  print(f"vault {vault_name} store -> HTTP {st}")
                  if st >= 400: print(f"::warning::{vault_name} not stored in Vault (HTTP {st})")
              st, r = sql(open("oddspapi-postmatch-pinger.sql").read())
              print(f"oddspapi-postmatch-pinger.sql apply HTTP {st}")
              if st >= 400: print(f"::warning::oddspapi-postmatch-pinger.sql not applied (HTTP {st})")
          if act in ("schema", "verify"):
              pk = os.environ["SUPABASE_PUBLISHABLE_KEY"]
              st, r = call(f"{url}/rest/v1/kibl_now_price?select=card_key&limit=1", key=pk)
              print(f"[publishable] SELECT kibl_now_price  -> HTTP {st}  (want 200)")
              if st != 200: bad.append("price table not readable")
              st, r = call(f"{url}/rest/v1/kibl_now_card?select=card_key&limit=1", key=pk)
              print(f"[publishable] SELECT kibl_now_card  -> HTTP {st}  (want 200)")
              if st != 200: bad.append("card table not readable")
              st, r = call(f"{url}/rest/v1/kibl_now_card", "POST",
                           [{"card_key": "__rls_probe__", "a_side": "a", "a_price": 2, "a_at": "2026-01-01T00:00:00Z",
                             "b_side": "b", "b_price": 2, "b_at": "2026-01-01T00:00:00Z"}], key=pk)
              print(f"[publishable] INSERT kibl_now_card -> HTTP {st}  (want 401/403)")
              if st not in (401, 403):
                  bad.append(f"publishable key could INSERT a card row ({st})")
                  call(f"{url}/rest/v1/kibl_now_card?card_key=eq.__rls_probe__", "DELETE",
                       key=os.environ["SUPABASE_SECRET_KEY"])
              # The newer-only trigger, exercised for real on a probe row (secret key,
              # server-side only), then removed.
              sk = os.environ["SUPABASE_SECRET_KEY"]
              P = "__newer_probe__"
              def up(ap, aat, bp, bat):
                  return call(f"{url}/rest/v1/kibl_now_card?on_conflict=card_key", "POST",
                              [{"card_key": P, "a_side": "a", "a_price": ap, "a_at": aat,
                                "b_side": "b", "b_price": bp, "b_at": bat}], key=sk,
                              prefer="resolution=merge-duplicates,return=minimal")[0]
              def read():
                  st, r = call(f"{url}/rest/v1/kibl_now_card?card_key=eq.{P}&select=a_price,a_at,b_price,b_at,written_at", key=sk)
                  return json.loads(r)[0] if st == 200 and json.loads(r) else None
              s1 = up(2.0, "2026-01-01T10:00:00Z", 1.8, "2026-01-01T10:00:00Z"); r1 = read()
              s2 = up(3.0, "2026-01-01T09:00:00Z", 1.5, "2026-01-01T11:00:00Z"); r2 = read()
              s3 = up(3.0, "2026-01-01T09:00:00Z", 1.4, "2026-01-01T10:30:00Z"); r3 = read()
              call(f"{url}/rest/v1/kibl_now_card?card_key=eq.{P}", "DELETE", key=sk)
              print(f"newer-only trigger: writes {s1},{s2},{s3}")
              ok_mixed = r2 and float(r2["a_price"]) == 2.0 and float(r2["b_price"]) == 1.5
              ok_skip = r3 and r2 and r3["written_at"] == r2["written_at"] and float(r3["b_price"]) == 1.5
              print(f"  older a-side kept out, newer b-side in: {'PASS' if ok_mixed else 'FAIL'} ({r2})")
              print(f"  nothing newer -> row untouched (no message): {'PASS' if ok_skip else 'FAIL'} ({r3})")
              if not (ok_mixed and ok_skip): bad.append("newer-only trigger")
              # price_history RPC (item 6): EXECUTE with the publishable key works,
              # the gaps table itself stays unreadable. Measured per-call bytes.
              st, r = call(f"{url}/rest/v1/kibl_now_gaps?select=id&limit=1", key=pk)
              print(f"[publishable] SELECT kibl_now_gaps -> HTTP {st}  (want 401/403)")
              if st not in (401, 403): bad.append(f"gaps readable ({st})")
              # RLS on with no policy (ten232-kibl-schema.sql) keeps the table
              # grant, so PostgREST answers 200 with []: zero rows is the pass.
              st, r = call(f"{url}/rest/v1/kibl_line_observations?select=row_key&limit=1", key=pk)
              try:
                  body_obs = json.loads(r) if st == 200 else []
                  n_obs = len(body_obs) if isinstance(body_obs, list) else -1
              except (ValueError, TypeError):
                  n_obs = -1
              print(f"[publishable] SELECT kibl_line_observations -> HTTP {st}, {n_obs} row(s)  (want 401/403, or 200 with 0 rows)")
              if st not in (401, 403) and not (st == 200 and n_obs == 0):
                  bad.append(f"line observations readable ({st}, {n_obs} rows)")
              st, r = call(f"{url}/rest/v1/kibl_now_card?select=card_key&order=written_at.desc&limit=5",
                           key=os.environ["SUPABASE_SECRET_KEY"])
              keys = [x["card_key"] for x in json.loads(r)] if st == 200 else []
              for ck in keys[:5]:
                  st, r = call(f"{url}/rest/v1/rpc/price_history", "POST", {"p_card_key": ck}, key=pk)
                  try:
                      d = json.loads(r) if st == 200 else {}
                  except ValueError:
                      d = {}
                  print(f"[publishable] rpc price_history({ck}) -> HTTP {st}, {len(r)} bytes: "
                        f"fixtures {len(d.get('fixtures') or [])}, poller {len(d.get('poller') or [])}, "
                        f"stream {len(d.get('stream') or [])}, gaps {len(d.get('gaps') or [])}, "
                        f"sweep_gaps {len(d.get('sweep_gaps') or [])}")
                  if st != 200: bad.append(f"price_history {st}")
              st, r = call(f"{url}/rest/v1/kibl_now_history?select=id&limit=1", key=pk)
              print(f"[publishable] SELECT kibl_now_history -> HTTP {st}  (want 401/403)")
              if st not in (401, 403): bad.append(f"history readable ({st})")
              # TEN-270 post-match archive: the tick table is server-side only; the
              # page reads one card at a time through bet365_history().
              st, r = call(f"{url}/rest/v1/bet365_mw_ticks?select=card_key&limit=1", key=pk)
              print(f"[publishable] SELECT bet365_mw_ticks -> HTTP {st}  (want 401/403)")
              if st not in (401, 403): bad.append(f"bet365_mw_ticks readable ({st})")
              st, r = call(f"{url}/rest/v1/rpc/bet365_history", "POST", {"p_card_key": "__rls_probe__"}, key=pk)
              try:
                  d = json.loads(r) if st == 200 else {}
              except ValueError:
                  d = {}
              if not isinstance(d, dict):
                  d = {}
              print(f"[publishable] rpc bet365_history(__rls_probe__) -> HTTP {st}, stored {d.get('stored')}, "
                    f"rows {len(d.get('rows') or [])}  (want 200, 0 rows)")
              if st != 200 or d.get("rows"): bad.append(f"bet365_history {st}")
              probe = {"card_key": "__rls_probe__", "side_key": "__rls_probe__", "kind": "heartbeat"}
              st, r = call(f"{url}/rest/v1/kibl_now_price", "POST", [probe], key=pk)
              print(f"[publishable] INSERT kibl_now_price -> HTTP {st}  (want 401/403)")
              if st not in (401, 403):
                  bad.append(f"publishable key could INSERT ({st})")
                  call(f"{url}/rest/v1/kibl_now_price?card_key=eq.__rls_probe__", "DELETE",
                       key=os.environ["SUPABASE_SECRET_KEY"])
              st, r = call(f"{url}/rest/v1/odds_card_state?select=match_key&limit=1", key=pk)
              print(f"[publishable] SELECT odds_card_state -> HTTP {st}  (unchanged: want 401)")
              st, r = sql("select tablename from pg_publication_tables where pubname='supabase_realtime' "
                          "and tablename in ('kibl_now_price','kibl_now_history','kibl_now_card') order by 1")
              print(f"realtime publication -> {r}")
              if "kibl_now_card" not in r: bad.append("card table not in supabase_realtime")
              if "kibl_now_price" in r:
                  print("note: kibl_now_price still published — old-client tabs only; run `unpublish-price` once they have reloaded")
              if "kibl_now_history" in r: bad.append("history table published")
              st, r = sql("select polname, polcmd, polroles::regrole[]::text from pg_policy p join pg_class c on c.oid=p.polrelid "
                          "where c.relname in ('kibl_now_price','kibl_now_history','kibl_now_card') order by 1")
              print(f"policies -> {r}")
              # TEN-270 post-match dispatcher + alarm (founder 2026-09-25T00:53Z).
              st, r = sql("select jobname, schedule, active, "
                          "(select count(*) from vault.secrets where name = 'gh_postmatch_dispatch_pat') as pat_stored, "
                          "(select count(*) from vault.secrets where name in ('ops_telegram_bot_token', 'ops_telegram_chat_id')) as telegram_stored "
                          "from cron.job where jobname in ('ten270-oddspapi-postmatch-ping', 'ten270-oddspapi-postmatch-check') order by 1")
              print(f"post-match jobs -> HTTP {st} {r[:600]}  (want both active; pat_stored 1; telegram_stored 2)")
              try:
                  # The Management API query endpoint answers 201, not 200.
                  jobs = {j.get("jobname"): j.get("active") for j in json.loads(r)} if 200 <= st < 300 else None
              except (ValueError, AttributeError, TypeError):
                  jobs = None
              for jn in ("ten270-oddspapi-postmatch-ping", "ten270-oddspapi-postmatch-check"):
                  if not jobs or jobs.get(jn) is not True:
                      bad.append(f"post-match cron job {jn} missing or inactive")
              # GitHub's reply body on a failed dispatch names the reason (e.g. the
              # token's repo or permission); it carries no secret.
              st, r = sql("select d.sent_at, d.request_id, d.note, r.status_code, r.timed_out, r.error_msg, "
                          "case when r.status_code not between 200 and 299 then left(r.content, 300) end as reply "
                          "from public.postmatch_dispatch_log d left join net._http_response r on r.id = d.request_id "
                          "order by d.sent_at desc limit 5")
              print(f"last 5 dispatches -> HTTP {st} {r[:1200]}")
              st, r = sql("select j.jobname, d.status, d.return_message, d.start_time from cron.job_run_details d "
                          "join cron.job j using (jobid) where j.jobname = 'ten270-oddspapi-postmatch-check' "
                          "order by d.start_time desc limit 3")
              print(f"checker job (last 3 runs) -> HTTP {st} {r[:900]}")
              st, r = sql("select condition, opened_at, last_sent_at, detail from public.postmatch_alerts where is_open")
              print(f"open alerts -> HTTP {st} {r[:900]}")
              # Keyed on the STORED delivery state (resolved by the checker from
              # pg_net): anything but 'sent' in 7 days — unsent, queued, failed.
              st, r = sql("select l.at, l.condition, l.kind, l.message, l.delivered "
                          "from public.postmatch_alert_log l "
                          "where l.at > now() - interval '7 days' and l.delivered <> 'sent' "
                          "order by l.at desc limit 20")
              try:
                  unsent = json.loads(r) if 200 <= st < 300 else None
              except ValueError:
                  unsent = None
              if not isinstance(unsent, (list, type(None))):
                  unsent = None
              if unsent is None:
                  print(f"post-match unsent alerts -> HTTP {st} (unreadable) {r[:300]}")
                  bad.append("post-match alert log unreadable")
              elif unsent:
                  print("::error::post-match ALERTS THAT NEVER REACHED TELEGRAM (last 7 days):")
                  for row in unsent:
                      print("  " + json.dumps(row))
                  bad.append(f"{len(unsent)} post-match alert(s) unsent")
              else:
                  print("post-match unsent alerts -> none")
          if act == "status":
              sk = os.environ["SUPABASE_SECRET_KEY"]
              st, r = call(f"{url}/rest/v1/kibl_now_price?kind=eq.heartbeat&select=written_at,note", key=sk)
              print(f"heartbeat -> HTTP {st} {r[:1500]}")
              st, r = call(f"{url}/rest/v1/kibl_now_price?kind=eq.price&select=card_key", key=sk,
                           prefer="count=exact")
              print(f"price rows -> HTTP {st} {len(json.loads(r)) if st == 200 else r[:200]}")
          if act == "unpublish-price":
              st, r = sql("do $$ begin if exists (select 1 from pg_publication_tables where pubname='supabase_realtime' "
                          "and schemaname='public' and tablename='kibl_now_price') then "
                          "alter publication supabase_realtime drop table public.kibl_now_price; end if; end $$")
              print(f"unpublish kibl_now_price -> HTTP {st} {r[:300]}")
              if st >= 400: bad.append("unpublish failed")
              st, r = sql("select tablename from pg_publication_tables where pubname='supabase_realtime' "
                          "and tablename like 'kibl_now%' order by 1")
              print(f"realtime publication -> {r}")
          if act == "realtime-config":
              tok = os.environ["SUPABASE_ACCESS_TOKEN"]
              api = f"https://api.supabase.com/v1/projects/{ref}/config/realtime"
              st, r = call(api, bearer=tok)
              print(f"realtime config (before) -> HTTP {st} {r[:1500]}")
              want = os.environ.get("MAX_EVENTS", "").strip()
              if want:
                  if not want.isdigit() or int(want) < 1:
                      print("::error::max_events must be a positive integer"); sys.exit(1)
                  st, r = call(api, "PATCH", {"max_events_per_second": int(want)}, bearer=tok)
                  print(f"PATCH max_events_per_second={want} -> HTTP {st} {r[:500]}")
                  if st >= 400: bad.append(f"PATCH refused ({st})")
                  st, r = call(api, bearer=tok)
                  print(f"realtime config (after) -> HTTP {st} {r[:1500]}")
          if act == "usage":
              import datetime as dt
              tok = os.environ["SUPABASE_ACCESS_TOKEN"]
              base = f"https://api.supabase.com/v1/projects/{ref}/analytics/endpoints"
              end = dt.datetime.now(dt.timezone.utc).replace(minute=0, second=0, microsecond=0)
              # A misspelt map key reads as '' (a silent zero), so the keys that
              # exist are printed first.
              EDGE = "source = 'edge_logs'"
              st, rows, r = logq(f"select arrayJoin(mapKeys(log_attributes)) as k, count() as n from logs "
                                 f"where {EDGE} group by k order by n desc limit 80",
                                 end - dt.timedelta(hours=1), end)
              print(f"=== edge_logs attribute keys (last hour) -> HTTP {st} {json.dumps(rows) if rows is not None else r[:800]}")
              A = lambda k: f"log_attributes['{k}']"
              q = (f"""select extract({A('request.path')}, '^(/[a-z]+/v1/[^/?]*)') as route, {A('request.method')} as method,
                  substring(if({A('request.headers.user_agent')} = '', '-', {A('request.headers.user_agent')}), 1, 40) as ua,
                  count() as n, sum(toInt64OrNull({A('response.headers.content_length')})) as bytes,
                  countIf({A('response.headers.content_length')} = '') as no_len
                  from logs where {EDGE}
                  group by route, method, ua order by bytes desc limit 40""")
              for d in range(14):
                  hi, lo = end - dt.timedelta(hours=12 * d), end - dt.timedelta(hours=12 * (d + 1))
                  st, rows, r = logq(q, lo, hi)
                  print(f"=== edge_logs {lo.isoformat()} .. {hi.isoformat()} -> HTTP {st}")
                  if rows is None:
                      print("body:", r[:800])
                      continue
                  for row in rows:
                      print(json.dumps(row))
              for ep in ("usage.api-counts?interval=7day", "usage.api-requests-count"):
                  st, r = call(f"{base}/{ep}", bearer=tok)
                  print(f"=== {ep} -> HTTP {st} {r[:3000]}")
              # REPLAY. REST GET responses are chunked, so the gateway log has no
              # Content-Length for them: their bytes are MEASURED here instead. The
              # logged GETs of the last 12 h are re-issued READ-ONLY with the server
              # key (GET only, /rest/v1 only, bodies never printed) and the response
              # bytes counted, weighted by how often each exact query was logged.
              import collections
              sk = os.environ["SUPABASE_SECRET_KEY"]
              lo, hi = end - dt.timedelta(hours=12), end
              rows2, used = None, None
              for field in ("request.search", "request.url"):
                  q2 = (f"""select {A('request.path')} as path, {A(field)} as qs,
                      substring(if({A('request.headers.user_agent')} = '', '-', {A('request.headers.user_agent')}), 1, 40) as ua,
                      count() as n from logs where {EDGE}
                      and {A('request.method')} = 'GET' and startsWith({A('request.path')}, '/rest/v1/')
                      group by path, qs, ua order by n desc limit 400""")
                  st, rows, r = logq(q2, lo, hi)
                  if rows is not None and any(x.get("qs") for x in rows):
                      rows2, used = rows, field
                      break
                  print(f"replay query with {field} -> HTTP {st} {r[:400]}")
              if rows2 is not None:
                  per = collections.defaultdict(lambda: {"n": 0, "wn": 0, "wb": 0, "k": 0})
                  budget = 160
                  for row in rows2:
                      route = "/".join((row["path"] or "").split("/")[:4])
                      key = (route, row.get("ua"))
                      g = per[key]
                      g["n"] += row["n"]
                      if g["k"] >= 6 or budget <= 0:
                          continue
                      qpart = row.get("qs") or ""
                      if used == "request.url":
                          qpart = urllib.parse.urlparse(qpart).query
                          qpart = ("?" + qpart) if qpart else ""
                      req = urllib.request.Request(url + row["path"] + qpart)
                      req.add_header("apikey", sk); req.add_header("Authorization", "Bearer " + sk)
                      # Match the caller's wire encoding: Python's urllib asks for none;
                      # fetch() in node / Deno / browsers asks for gzip by default.
                      if not str(row.get("ua") or "").startswith("Python-urllib"):
                          req.add_header("Accept-Encoding", "gzip")
                      try:
                          with urllib.request.urlopen(req, timeout=60) as resp:
                              nbytes = len(resp.read())
                      except urllib.error.HTTPError as e:
                          nbytes = len(e.read())
                      except Exception:
                          continue
                      budget -= 1
                      g["k"] += 1; g["wn"] += row["n"]; g["wb"] += nbytes * row["n"]
                  print(f"=== REPLAY (field {used}) window {z(lo)} .. {z(hi)}; route, caller, GETs in 12 h, "
                        "queries replayed, mean bytes/GET, est GB per 12 h, est GB per 30 days")
                  tot = 0.0
                  for (route, ua), g in sorted(per.items(), key=lambda kv: -(kv[1]["wb"] / kv[1]["wn"] * kv[1]["n"] if kv[1]["wn"] else 0)):
                      mean = g["wb"] / g["wn"] if g["wn"] else None
                      gb12 = (mean * g["n"] / 1e9) if mean is not None else None
                      tot += gb12 or 0
                      print(json.dumps({"route": route, "ua": ua, "gets_12h": g["n"], "replayed": g["k"],
                                        "mean_bytes": round(mean) if mean is not None else None,
                                        "gb_12h": round(gb12, 3) if gb12 is not None else None,
                                        "gb_30d": round(gb12 * 60, 1) if gb12 is not None else None}))
                  print(f"REPLAY TOTAL est GB per 12 h {tot:.3f}  per 30 days {tot * 60:.1f}")
          if act == "heartbeat-check":
              # READ-ONLY (founder usage question). Raw counts with denominators;
              # no conclusions. Window = the `window` input (blank = the first reading).
              import datetime as dt
              W = (os.environ.get("WINDOW") or "").strip()
              W0, W1 = [x.strip() for x in W.split("..")] if W else ("2026-09-24T08:54:00Z", "2026-09-25T00:52:00Z")
              if not (W0.endswith("Z") and W1.endswith("Z")) or W1 <= W0:
                  print(f"::error::window must be START..END in ISO Z, START < END (got {W!r})"); sys.exit(1)
              span_s = (dt.datetime.fromisoformat(W1[:-1]) - dt.datetime.fromisoformat(W0[:-1])).total_seconds()
              print(f"window {W0} .. {W1} = {span_s/60:.0f} min")
              st, r = sql("select at, condition, kind, delivered, left(message, 160) as message from public.postmatch_alert_log "
                          "where at > now() - interval '24 hours' order by at desc limit 20")
              print(f"Alerts (postmatch_alert_log, last 24 h) -> HTTP {st} {r[:2500]}")
              def q(label, text):
                  st, r = sql(text)
                  print(f"{label} -> HTTP {st} {r[:900]}")
                  try:
                      return json.loads(r) if 200 <= st < 300 else None
                  except ValueError:
                      return None
              q("(i-a) kibl_now_card rows whose LAST write is in the window (one row per card: a lower bound on writes)",
                f"select count(*) as rows_last_written_in_window, (select count(*) from public.kibl_now_card) as rows_total "
                f"from public.kibl_now_card where written_at >= '{W0}' and written_at < '{W1}'")
              hist = q("(i-b) kibl_now_history rows in the window, by source (one per side change the worker wrote)",
                       f"select source, count(*) as rows, count(distinct card_key) as cards, "
                       f"count(distinct (card_key, date_trunc('second', written_at))) as card_seconds "
                       f"from public.kibl_now_history where written_at >= '{W0}' and written_at < '{W1}' "
                       f"group by source order by source")
              hb = int(span_s // 60)
              print(f"(i-c) kibl_now_price heartbeat writes: ~{hb} (derived: window {span_s:.0f} s / HEARTBEAT_EVERY_S 60 in now_worker.py; not counted from data - the row is overwritten)")
              print("(i-d) kibl_now_price price-side writes: ~ the stream rows of (i-b) (one side write per history row; the table keeps only the latest per side)")
              z0 = dt.datetime.fromisoformat(W0[:-1]); z1 = dt.datetime.fromisoformat(W1[:-1])
              def lq(label, text):
                  st, rows, r = logq(text, z0, z1)
                  print(f"{label} -> HTTP {st} {json.dumps(rows)[:3000] if rows is not None else r[:800]}")
                  return rows
              # What the logs hold for the window, before any count is read off them:
              # a source with no rows here is a retention/plan limit, not a zero.
              RT = "source = 'realtime_logs'"
              M = lambda k: f"toFloat64OrNull(log_attributes['measurements.{k}'])"
              lq("(ii-a) log sources in the window: rows, first, last (a source missing here = not retained, not zero)",
                 "select source, count() as n, min(timestamp) as first, max(timestamp) as last "
                 "from logs group by source order by n desc")
              keys = lq("(ii-b) realtime_logs attribute keys",
                        f"select arrayJoin(mapKeys(log_attributes)) as k, count() as n from logs "
                        f"where {RT} group by k order by n desc limit 80")
              lq("(ii-c) realtime_logs message shapes (ids and digits masked), count each",
                 "select substring(replaceRegexpAll(replaceRegexpAll(event_message, 'eyJ[A-Za-z0-9_.-]+', '<jwt>'), "
                 f"'[0-9a-fA-F-]{{8,}}|[0-9]+', '#'), 1, 160) as shape, count() as n from logs "
                 f"where {RT} group by shape order by n desc limit 50")
              lq("(ii-d) first 30 measurement lines: connected / connected_cluster / limit / sum",
                 f"select timestamp, substring(event_message, 1, 100) as msg, {M('connected')} as connected, "
                 f"{M('connected_cluster')} as cluster, {M('limit')} as lim, {M('sum')} as sum from logs "
                 f"where {RT} and log_attributes['measurements.connected'] != '' order by timestamp limit 30")
              lq("(ii-e) measurement lines by hour: samples, max/avg connected, sum of measurements.sum",
                 f"select toStartOfHour(timestamp) as hour, count() as samples, max({M('connected')}) as max_conn, "
                 f"round(avg({M('connected')}), 2) as avg_conn, sum({M('sum')}) as sum_sum from logs "
                 f"where {RT} and log_attributes['measurements.connected'] != '' group by hour order by hour")
              tot = lq("(ii) window totals over the measurement lines",
                       f"select count() as samples, min(timestamp) as first, max(timestamp) as last, "
                       f"sum({M('connected')}) as conn_x_samples, max({M('connected')}) as max_conn, "
                       f"countIf({M('connected')} > 0) as samples_with_conn, sum({M('sum')}) as sum_sum "
                       f"from logs where {RT} and log_attributes['measurements.connected'] != ''")
              t = tot[0] if tot else None
              if not keys or not t or not t.get("samples"):
                  # No keys / no samples is a retention or schema gap, never a zero.
                  print("(ii) connection-minutes: - (no realtime measurement lines in the window; see (ii-a)/(ii-b))")
              else:
                  cad = span_s / 60 / t["samples"]
                  print(f"(ii) {t['samples']} measurement samples over {span_s/60:.0f} min = one per ~{cad:.2f} min; "
                        f"connected summed over samples {t['conn_x_samples']} -> connection-minutes ~ {t['conn_x_samples'] * cad:.0f} "
                        f"(assumes even sampling - check (ii-e)); peak {t['max_conn']}; measurements.sum total {t['sum_sum']}")
              EA = lambda k: f"log_attributes['{k}']"
              EDGE = "source = 'edge_logs'"
              pub = q("(ii-f) tables in supabase_realtime now",
                      "select tablename from pg_publication_tables where pubname = 'supabase_realtime' order by 1")
              pubs = [x.get("tablename") for x in (pub or [])]
              lq("(ii-g) gateway writes per table in the window (published tables are the Realtime sources)",
                 f"select extract({EA('request.path')}, '^/rest/v1/([^/?]+)') as tbl, {EA('request.method')} as method, "
                 f"count() as n from logs where {EDGE} and startsWith({EA('request.path')}, '/rest/v1/') "
                 f"and {EA('request.method')} in ('POST', 'PATCH', 'PUT', 'DELETE') group by tbl, method order by n desc limit 60")
              ws = lq("(ii-h) browser websocket connects (/realtime/v1/websocket): time, status, origin_time",
                      f"select timestamp, {EA('response.status_code')} as status, {EA('response.origin_time')} as origin_time, "
                      f"substring({EA('request.headers.user_agent')}, 1, 24) as ua from logs "
                      f"where {EDGE} and {EA('request.path')} = '/realtime/v1/websocket' order by timestamp limit 500")
              ev = lq("(ii-i) Realtime tenant lifecycle (up = first client connected; no_users = last one gone)",
                      "select timestamp, multiIf(match(event_message, 'is initializing'), 'up', "
                      "match(event_message, 'no connected users'), 'no_users', match(event_message, 'has been terminated'), 'terminated', "
                      "match(event_message, 'no active subscriptions'), 'no_subs', 'other') as ev from logs "
                      f"where {RT} and ev != 'other' order by timestamp limit 500")
              # Intervals with >= 1 connected client. The tenant stays up while any
              # client is connected; 'no connected users' is its own periodic check,
              # so each interval can run past the last disconnect by that check's lag.
              ivs = []
              if ev is not None:
                  cur = None
                  first_ev = next((x["ev"] for x in ev if x["ev"] in ("up", "no_users", "terminated")), None)
                  if first_ev in ("no_users", "terminated"):
                      cur = z0                       # already up when the window opened
                  for x in ev:
                      t = dt.datetime.fromisoformat(x["timestamp"][:19])
                      if x["ev"] == "up" and cur is None:
                          cur = t
                      elif x["ev"] in ("no_users", "terminated") and cur is not None:
                          ivs.append((cur, t)); cur = None
                  if cur is not None:
                      ivs.append((cur, z1))
              up_min = sum((b2 - a2).total_seconds() for a2, b2 in ivs) / 60
              for a2, b2 in ivs:
                  print(f"      up {a2:%m-%d %H:%M:%S} .. {b2:%m-%d %H:%M:%S}  {(b2 - a2).total_seconds() / 60:6.1f} min")
              print(f"(ii-j) tenant up-intervals: {len(ivs)}, total {up_min:.0f} min of {span_s/60:.0f} "
                    "(time with >= 1 connection, plus each interval's no-users check lag)" if ev is not None else "(ii-j) -")
              ot = [float(x["origin_time"]) for x in (ws or []) if str(x.get("origin_time") or "").replace(".", "", 1).isdigit()]
              print(f"(ii-k) websocket connects {len(ws) if ws is not None else '-'}; with a numeric origin_time {len(ot)}; "
                    f"origin_time sum {sum(ot):.0f}, max {max(ot) if ot else '-'} (units as logged; a session length only if it matches (ii-j))")
              inside = " or ".join(f"(written_at >= '{a2:%Y-%m-%dT%H:%M:%S}Z' and written_at < '{b2:%Y-%m-%dT%H:%M:%S}Z')" for a2, b2 in ivs) or "false"
              inw = q("(ii-l) stream writes while >= 1 client was connected: history rows, card-seconds (~ kibl_now_card writes)",
                      "select count(*) as rows, count(distinct (card_key, date_trunc('second', written_at))) as card_seconds "
                      f"from public.kibl_now_history where source = 'stream' and ({inside})")
              iw = (inw or [{}])[0]
              stream_rows = sum(int(x.get("rows") or 0) for x in (hist or []) if x.get("source") == "stream") if hist else None
              print("(iii) arithmetic, raw (subscriber counts per message are not logged, so deliveries are bounds):")
              print("      billed: the founder's dashboard delta for this window (+468 for the first reading)")
              print(f"      stream writes in the window {stream_rows}; of them while >= 1 client connected: rows {iw.get('rows', '-')}, "
                    f"card-seconds {iw.get('card_seconds', '-')}")
              print(f"      kibl_now_price heartbeat-row writes while connected (1 per 60 s): ~{up_min:.0f} "
                    f"(delivered only to tabs still subscribed to kibl_now_price; published now: {'kibl_now_price' in pubs})")
              print(f"      client heartbeats if >= 1 connection throughout the up-intervals (1 per 30 s): >= ~{2 * up_min:.0f} "
                    "less 2 x the no-users check lag per interval")
          if bad:
              print("::error::" + "; ".join(bad)); sys.exit(1)
          PY

      - name: Install flyctl
        if: inputs.action == 'deploy-worker' || inputs.action == 'logs'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN is not set — the founder has to create the Fly org and token first."
            exit 1
          fi
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Worker logs (read-only)
        if: inputs.action == 'logs'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP=$(sed -n 's/^app *= *"\(.*\)"/\1/p' kibl-stream/fly.toml)
          flyctl machine list --app "$APP" || true
          flyctl secrets list --app "$APP" || true
          flyctl logs --app "$APP" --no-tail | tail -150 || true

      - name: Fly secrets + deploy
        if: inputs.action == 'deploy-worker'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          KIBL_RMQ_HOST: ${{ secrets.KIBL_RMQ_HOST }}
          KIBL_RMQ_PORT: ${{ secrets.KIBL_RMQ_PORT }}
          KIBL_RMQ_VHOST: ${{ secrets.KIBL_RMQ_VHOST }}
          KIBL_RMQ_USER: ${{ secrets.KIBL_RMQ_USER }}
          KIBL_RMQ_PASS: ${{ secrets.KIBL_RMQ_PASS }}
          KIBL_RMQ_QUEUE: ${{ secrets.KIBL_RMQ_QUEUE }}
          KIBL_USERNAME: ${{ secrets.KIBL_USERNAME }}
          KIBL_PASSWORD: ${{ secrets.KIBL_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          APP=$(sed -n 's/^app *= *"\(.*\)"/\1/p' kibl-stream/fly.toml)
          # The app is created by the FOUNDER, not here: FLY_API_TOKEN is an
          # app-scoped deploy token, which can deploy and set secrets for its
          # own app but cannot create apps. So a missing app is a clear stop.
          if ! flyctl status --app "$APP" >/dev/null 2>&1; then
            echo "::error::Fly app '$APP' not found for this token — create it with: fly apps create $APP"
            exit 1
          fi
          # Values go over STDIN, one NAME=value per line — never argv, never echoed.
          # BASE64-ENCODED as NAME_B64: `secrets import` parses dotenv, which
          # mangled a real password (quotes/#/$/\ are interpreted). The worker
          # decodes NAME_B64 -> NAME at start-up (now_worker.decode_b64_env).
          python3 - <<'PY' | flyctl secrets import --app "$APP" --stage
          import base64, os
          for k in ("KIBL_RMQ_HOST","KIBL_RMQ_PORT","KIBL_RMQ_VHOST","KIBL_RMQ_USER","KIBL_RMQ_PASS",
                    "KIBL_RMQ_QUEUE","KIBL_USERNAME","KIBL_PASSWORD","SUPABASE_URL","SUPABASE_SECRET_KEY"):
              v = os.environ.get(k, "").strip()
              if not v:
                  raise SystemExit(f"missing secret {k}")
              print(f"{k}_B64={base64.b64encode(v.encode()).decode()}")
          PY
          flyctl deploy --config kibl-stream/fly.toml --dockerfile kibl-stream/Dockerfile \
                        --remote-only --ha=false --yes .
          flyctl status --app "$APP"
