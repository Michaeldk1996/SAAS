name: probe-r40 (branch only — items 1+2 live)
on:
  push:
    branches: [claude/wonderful-fermat-clvs94]
    paths: [tools/probe-r40/trigger]
permissions: { contents: read, actions: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: |
          A=$(cat tools/probe-r40/trigger | cut -d' ' -f1); B=$(cat tools/probe-r40/trigger | cut -d' ' -f2)
          gh run download "$A" -R "$GITHUB_REPOSITORY" -n site-data -D a
          gh run download "$B" -R "$GITHUB_REPOSITORY" -n site-data -D b
          node tools/probe-r40/ba.cjs a b
