# TEN-294 — the drops endpoint (founder ruling 2026-09-26: path B′). Branch-only: fires on a push to
# ten294-drops and nothing else. Never on main until the build is approved.
#   sql     install drops_api.snapshot() + role drops_reader (additive; changes no bot) and verify it —
#           results ENCRYPTED to tools/ten294-pub.pem (public repo; Bet105 prices are partner-granted).
#   deploy  only when FLY_DROPS_API_TOKEN exists: region check, drops_reader credential (SCRAM verifier, set
#           once, never printed), Fly secret, flyctl deploy, then a read-back of /status.json.
#   watchdog  once /health answers: Telegram secrets -> Vault (own names), install + schedule drops_watch,
#           send a test ping and go red unless Telegram CONFIRMED it (pg_net 2xx).
name: ten294-drops
on:
  push:
    branches: [ten294-drops]
permissions:
  contents: read
concurrency:
  group: ten294-drops
  cancel-in-progress: false
jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Suite
        run: node --test test-ten294-drops.mjs
      - name: SQL steps (encrypted output)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TEN294_STEPS: tools/ten294-steps-install.json
        run: python3 tools/ten294-sql.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ten294-sql
          path: |
            out/result.enc
            out/pass.enc
          retention-days: 2

  deploy:
    needs: sql
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_DROPS_API_TOKEN }}
    steps:
      - name: Token present?
        id: gate
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_DROPS_API_TOKEN is not set on this repo — deploy SKIPPED (not failed)."
            echo "go=0" >> "$GITHUB_OUTPUT"
          else
            echo "go=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == '1'
      - name: Install flyctl
        if: steps.gate.outputs.go == '1'
        run: |
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
      - name: Region is not deprecated
        if: steps.gate.outputs.go == '1'
        run: |
          r=$(grep -E '^primary_region' stennisfy-drops/fly.toml | cut -d'"' -f2)
          flyctl platform regions --json > regions.json
          python3 - "$r" <<'PY'
          import json, sys
          r = sys.argv[1]; regs = json.load(open('regions.json'))
          row = next((x for x in regs if (x.get('Code') or x.get('code')) == r), None)
          assert row is not None, f'region {r} not offered'
          dep = row.get('Deprecated') or row.get('deprecated')
          assert not dep, f'region {r} is deprecated'
          print(f'region {r} ok')
          PY
      - name: drops_reader credential + Fly secret (never printed; set once, not on every deploy)
        if: steps.gate.outputs.go == '1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Rotating on every deploy would lock the RUNNING machine out whenever the deploy itself then fails
          # (independent review) — so the credential is set only when the app has none yet.
          # A FAILED list must fail the step, never read as "absent" and rotate a live credential (second review).
          flyctl secrets list -a stennisfy-drops --json > fly-secrets.json
          if python3 -c 'import json,sys;sys.exit(0 if any(x.get("Name",x.get("name"))=="DROPS_DB_URL_B64" for x in json.load(open("fly-secrets.json"))) else 1)'; then
            echo "DROPS_DB_URL_B64 already set — credential unchanged"; exit 0
          fi
          python3 - <<'PY'
          import base64, hashlib, hmac, json, os, secrets, subprocess, urllib.parse, urllib.request
          ref = (urllib.parse.urlparse(os.environ['SUPABASE_URL']).hostname or '').split('.')[0]
          print(f'::add-mask::{ref}')
          def api(path, body=None):
              req = urllib.request.Request(f'https://api.supabase.com/v1/projects/{ref}{path}', method='POST' if body else 'GET',
                                           data=json.dumps(body).encode() if body else None)
              req.add_header('Authorization', 'Bearer ' + os.environ['SUPABASE_ACCESS_TOKEN'])
              req.add_header('Content-Type', 'application/json')
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read() or b'null')
          # the SESSION pooler (IPv4, Supabase-CA chain verified 2026-09-26); the direct db.<ref> host is IPv6-only
          pools = api('/config/database/pooler')
          pools = pools if isinstance(pools, list) else [pools]
          # the PRIMARY's session-mode pooler, never a read replica's entry
          cand = [p for p in pools if p.get('db_host') and str(p.get('database_type', 'PRIMARY')).upper() == 'PRIMARY']
          cand.sort(key=lambda p: 0 if p.get('pool_mode') == 'session' else 1)
          host = cand[0]['db_host']
          print(f'::add-mask::{host}')
          pw = secrets.token_urlsafe(32)
          print(f'::add-mask::{pw}')
          # SCRAM-SHA-256 verifier: the plain password never reaches the database (or its statement log)
          salt = secrets.token_bytes(16); it = 4096
          salted = hashlib.pbkdf2_hmac('sha256', pw.encode(), salt, it)
          ck = hmac.new(salted, b'Client Key', 'sha256').digest()
          stored = hashlib.sha256(ck).digest()
          server = hmac.new(salted, b'Server Key', 'sha256').digest()
          b = lambda x: base64.b64encode(x).decode()
          verifier = f'SCRAM-SHA-256${it}:{b(salt)}${b(stored)}:{b(server)}'
          api('/database/query', {'query': f"alter role drops_reader login password '{verifier}'; select 1 as ok"})
          url = f'postgresql://drops_reader.{ref}:{urllib.parse.quote(pw)}@{host}:5432/postgres'
          b64 = base64.b64encode(url.encode()).decode()
          print(f'::add-mask::{b64}')
          # stdin, never argv; base64 so flyctl's dotenv parsing cannot mangle it (kibl-stream trap)
          subprocess.run(['flyctl', 'secrets', 'import', '--stage', '-a', 'stennisfy-drops'],
                         input=f'DROPS_DB_URL_B64={b64}\n', text=True, check=True, capture_output=True)
          print('credential set, secret staged')
          PY
      - name: Deploy
        if: steps.gate.outputs.go == '1'
        run: flyctl deploy --remote-only --config stennisfy-drops/fly.toml --ha=false --yes stennisfy-drops
      - name: Read back
        if: steps.gate.outputs.go == '1'
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o status.json -w '%{http_code}' https://stennisfy-drops.fly.dev/status.json || true)
            if [ "$code" = "200" ] && python3 -c 'import json;s=json.load(open("status.json"));assert s["generatedAt"];print("generatedAt",s["generatedAt"],"rows",s["rowCount"],"fresh",s["freshness"]);[print(" ",x["id"],x["state"],x["ageS"]) for x in s["sources"]]'; then exit 0; fi
            sleep 10
          done
          echo "::error::no good /status.json after 2 min"; exit 1

  watchdog:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # a skipped deploy (no token) still leaves `deploy` green — never arm the watchdog on an endpoint that isn't up
      - name: Endpoint answers /health
        run: |
          code=$(curl -s -o health.json -w '%{http_code}' https://stennisfy-drops.fly.dev/health || true)
          python3 -c 'import json;h=json.load(open("health.json"));print("health",h["ok"],h["freshness"])' \
            || { echo "::error::no /health body (HTTP $code) — watchdog NOT installed"; exit 1; }
      - name: Install + schedule the watchdog, test ping (encrypted output)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEN294_STEPS: tools/ten294-steps-watchdog.json
        run: python3 tools/ten294-sql.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ten294-watchdog
          path: |
            out/result.enc
            out/pass.enc
          retention-days: 2
