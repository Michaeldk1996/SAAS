name: BSP admin log (append-only)
on:
  workflow_run:
    workflows: ["BSP data pipeline"]
    types: [completed]
concurrency:
  group: bsp-admin-log
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Append completed matches to admin log
        run: node tools/build-admin-log.js
      - name: Commit admin log (only if changed)
        run: |
          if git diff --quiet -- admin-log.json; then
            echo "No new entries — nothing to commit."
            exit 0
          fi
          git config user.name "bsp-admin-log-bot"
          git config user.email "bsp-admin-log-bot@users.noreply.github.com"
          git add admin-log.json
          git commit -m "chore(admin): append completed match log [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing."
            git pull --rebase origin main || true
          done
          echo "::error::Could not push after 3 attempts."
          exit 1
