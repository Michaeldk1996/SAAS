name: BSP odds-movement capture

# Laptop-independent capture of each upcoming match's opening -> now odds
# timeline (m.oddsMovement). Once a match finishes, its opening/closing odds are
# derived from this stored real series — so a match must be captured at least
# once WHILE it is still upcoming or its open/close are lost forever.
#
# This runs on its own cadence (independent of the main data pipeline) and is
# the ONLY workflow that commits matches.json back to the repo. The main
# pipeline (pipeline.yml) reads that committed file, preserves oddsMovement, and
# derives openingOdds/closingOdds on its next run, then publishes to Pages — so
# open/close reach the live site within one pipeline cycle of each capture.
#
# Note the loop that closes here: the pipeline never commits its rebuilt board,
# so the committed matches.json only ever advances when a refresher writes it.
# refresh-odds-history.py therefore seeds its fixture list from the PUBLISHED
# board (Pages) rather than from the committed file. Without that seed the
# capture freezes on the last hand-committed fixtures and reports success while
# capturing nothing — which is exactly what it did from 15-18 July 2026.
#
# Cost: refresh-odds-history.py draws exactly ONE oddspapi quota unit per run
# (the single /v4/fixtures lookup); the /v4/historical-odds calls are free. At
# every 3 hours that is ~240 units/month against the 5,000/month paid plan
# active since 2026-09-10 — under 5%. Hourly would be ~720/month (~14%).
# The script prints the live meter (/v4/account, itself free) before and after
# every run, so actual consumption is in the log rather than inferred.
#
# SETUP REQUIRED: add repo secret ODDSPAPI_KEY
# (Settings -> Secrets and variables -> Actions -> New repository secret).
# Without it the run fails fast with a clear error.

on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours (UTC). ~240 runs/month, under free tier.
  workflow_dispatch:          # allow manual "Run workflow" from the Actions tab

# Never let two capture runs overlap — they both write/push matches.json.
concurrency:
  group: bsp-odds-history
  cancel-in-progress: false

permissions:
  contents: write             # needed to commit the refreshed matches.json back

jobs:
  capture:
    runs-on: ubuntu-latest
    # A full board is now ~45 fixtures x ONE bet365 call x 5.5s = ~4 min of
    # pacing before retries (it was 2 batches + a 6-book single-retry fallback,
    # i.e. up to 8 calls/fixture = ~33 min, which could hit this ceiling).
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Capture odds-movement timelines
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          if [ -z "$ODDSPAPI_KEY" ]; then
            echo "::error::ODDSPAPI_KEY secret is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          python3 refresh-odds-history.py

      # Runs even when the capture step failed. A PARTIAL capture (exit 2) has
      # already written real prices into matches.json and those are worth
      # keeping; the run is still failed below so a shortfall can never read as
      # success. A total failure (exit 1) writes nothing, so this is a no-op.
      #
      # odds-open-monitor.json is committed alongside it ON PURPOSE (TEN-179 item 3).
      # The runner is ephemeral, so without persisting it every run would re-stamp
      # `firstSeenAt` at its own start instant and the posting-to-capture lag would read
      # ~0 forever — the prospective measurement the founder asked for would silently
      # never happen. It is not in the Pages copy list, so it never reaches the client.
      - name: Commit refreshed matches.json (only if changed)
        if: always()
        run: |
          if git diff --quiet -- matches.json odds-open-monitor.json; then
            echo "No odds-movement changes to commit."
            exit 0
          fi
          git config user.name  "bsp-odds-bot"
          git config user.email "bsp-odds-bot@users.noreply.github.com"
          git add matches.json odds-open-monitor.json
          git commit -m "chore(odds): capture opening->now odds movement [skip ci]"
          # Another run (or a manual commit) may have advanced main since checkout;
          # rebase and retry so the capture is never lost to a benign race.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed matches.json on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing on origin/main and retrying."
            git pull --rebase origin main || true
          done
          echo "::error::Could not push matches.json after 3 attempts."
          exit 1
