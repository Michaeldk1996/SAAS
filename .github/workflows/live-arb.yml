name: Live arbitrage (Kalshi x Polymarket)

# Founder 2026-11-02: live (in-play) arbitrage between Kalshi and Polymarket on ATP tour matches.
# tools/live-arb-recorder.mjs reads Polymarket's public order-book websocket and Kalshi's public market list every 2 s,
# and every 5 s pushes the current gaps after fees + a heartbeat to public.arb_live_push (tools/arb-engine.sql), which
# feeds Dropping Odds → Arbitrage → Live and posts ⚡ LIVE ARB to the drop chat (>= 1% after fees, >= $100 to lock in,
# once per match + direction per 10 min). Public endpoints only; the one write is that RPC (service key).
# Bet105 (founder 2026-11-10): pre-match and in-play prices from Kibl's REST API (feed 171, betting types 1 and 3; secrets
# KIBL_USERNAME / KIBL_PASSWORD); every direction with a Bet105 leg is checked beside Kalshi × Polymarket. odds-api.io is
# no longer read for the arbitrage.
#
# Always on: each run records for 350 min and, as it starts, queues its successor (workflow_dispatch with the job's own
# token — the one event GITHUB_TOKEN may trigger); the concurrency group holds that one pending run until the current one
# ends, so the next starts at once. The hourly schedule is a backstop (measured 2 Nov: GitHub had not yet started a
# scheduled run 2 h after the file landed). Runs from main only (self-chaining rule).
# Stop it: disable this workflow. The page drops the live section by itself 90 s after the last push.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutes to record (max 350)'
        default: '350'

concurrency:
  group: live-arb
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Queue the next run (waits in the concurrency group until this one ends)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live-arb.yml --repo "${{ github.repository }}" --ref main || echo "::warning::could not queue the next run (the hourly schedule is the backstop)"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Record + push live gaps
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Kalshi's live websocket (founder 2026-11-03): set both on the repo to switch from polling to the feed.
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          # Bet105 via Kibl (founder 2026-11-10); without them the worker runs Kalshi × Polymarket only
          KIBL_USERNAME: ${{ secrets.KIBL_USERNAME }}
          KIBL_PASSWORD: ${{ secrets.KIBL_PASSWORD }}
          KIBL_CLIENT_ID: ${{ secrets.KIBL_CLIENT_ID }}
        run: node tools/live-arb-recorder.mjs --minutes "${{ inputs.minutes || '350' }}" --out live-arb --push 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-arb-${{ github.run_id }}
          path: live-arb/
          retention-days: 14
