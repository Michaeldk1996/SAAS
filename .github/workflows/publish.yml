# Publish — the newest GATED code over the newest DATA, deployed to GitHub Pages.
#
# Founder 2026-10-12 ("do not mix the data with it and wait so long; everything automatic"):
#   - code: a code push runs the Code gate (gate.yml, every npm test command across machines, ~5 min);
#     when it passes, this workflow publishes it within ~2 min — it no longer waits for a data rebuild;
#   - data: every pipeline.yml run (every ~10 min) uploads the site it built as the `site-data` artifact after its
#     data checks passed; when it finishes, this workflow republishes with that data and the newest gated code.
# tools/publish-resolve.mjs picks both when the run STARTS (not when it was triggered), so a publish that waited
# behind another, or replaced a pending one, always takes the newest of both: nothing is lost to the queue.
# A code commit whose gate failed is never published; neither is data from a run whose checks failed.
#
# PUBLISH_DEPLOY is the switch. 'false' (shadow): the site is assembled, checked and uploaded as the `site-publish`
# artifact, and pipeline.yml still deploys. 'true': this workflow is the ONLY Pages deployer and pipeline.yml
# deploys nothing (stage 2 flips both together).
name: Publish site

on:
  workflow_run:
    workflows: ["Code gate", "BSP data pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One publish at a time, and the NEWEST trigger always wins: it cancels a publish still running or waiting
# (founder 2026-10-13, "we need to fix it"). Safe because every publish resolves the newest gated code and the
# newest data when it starts, so a cancelled one loses nothing, and Pages keeps the last finished deployment.
# Why: with cancel-in-progress false, run 38253661020 sat `waiting` on the github-pages environment from 12 Oct
# 13:09Z to 13 Oct 06:39Z (a GitHub-side stall, as pipeline.yml had on 6-7 Oct) and held the group, so ~110
# later publishes were cancelled behind it and nothing reached the site for 17.5 h. Now the next trigger (a
# data run, every ~10 min) cancels a stuck one. Backstop: pipeline-stall-guard.yml cancels a publish waiting
# > 20 min and Telegrams when the live site's build-info.json is > 40 min old.
concurrency:
  group: site-publish
  cancel-in-progress: true

env:
  PUBLISH_DEPLOY: 'true'

jobs:
  assemble:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      deploy: ${{ steps.mode.outputs.deploy }}
      ready: ${{ steps.resolve.outputs.ready }}
      code_sha: ${{ steps.resolve.outputs.codeSha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 300

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - id: mode
        run: echo "deploy=$PUBLISH_DEPLOY" >> "$GITHUB_OUTPUT"

      - name: Resolve the newest gated code and the newest data
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          node tools/publish-resolve.mjs
          rc=$?
          set -e
          if [ "$rc" = "0" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; elif [ "$rc" = "2" ]; then echo "ready=false" >> "$GITHUB_OUTPUT"; else exit "$rc"; fi

      - name: Check out the gated code
        if: steps.resolve.outputs.ready == 'true'
        run: git worktree add --detach "$RUNNER_TEMP/code" "${{ steps.resolve.outputs.codeSha }}"

      - name: Download the newest data
        if: steps.resolve.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site-data
          path: _site
          run-id: ${{ steps.resolve.outputs.dataRunId }}
          github-token: ${{ github.token }}

      - name: Lay the gated code over the data and stamp it
        if: steps.resolve.outputs.ready == 'true'
        env:
          CODE_SHA: ${{ steps.resolve.outputs.codeSha }}
          DATA_RUN_ID: ${{ steps.resolve.outputs.dataRunId }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          TIP=$(git rev-parse origin/main)
          export TIP
          if git merge-base --is-ancestor "$CODE_SHA" "$TIP"; then
            export ON_MAIN=true BEHIND=$(git rev-list --count "$CODE_SHA..$TIP")
          else
            echo "::error title=publish::$CODE_SHA is not on main ($TIP). Nothing is deployed."; exit 1
          fi
          node tools/publish-site.mjs --code "$RUNNER_TEMP/code" --site _site

      # Shadow only: the assembled site for inspection (~90 s for 109k files). Live mode skips it; Pages gets the site.
      - name: Upload the published site (shadow only)
        if: steps.resolve.outputs.ready == 'true' && steps.mode.outputs.deploy != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site-publish
          path: _site
          retention-days: 1
          compression-level: 1
          include-hidden-files: true

      # Founder brief 2026-10-14 (item 1): the deploy fails if the permanent Pinnacle archive ever holds fewer rows than
      # an archive job recorded, or has lost a protection (.claude/rules/pinnacle-archive.md). One read-only RPC with the
      # publishable key; an unreachable database is a loud SKIP, never a block.
      - name: Pinnacle archive guard (rows never go down)
        if: steps.resolve.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node tools/pinarch-guard.mjs

      # Founder brief 2026-10-16 (items 1-2): the same guard for the historical odds archive (Tennis-Data files and
      # closes, the export log). Unreachable or not installed yet = a loud SKIP, never a block.
      - name: Historical odds archive guard (rows never go down)
        if: steps.resolve.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node tools/histarch-guard.mjs

      # Founder brief 2026-10-16 (item 4): the private odds export and the archive's backups never reach the site. Any
      # odds CSV, export-named file or export header in the assembled site fails the publish (the site keeps its last
      # build).
      - name: No odds export in the published site
        if: steps.resolve.outputs.ready == 'true'
        run: node tools/no-odds-export-check.mjs --site _site

      - name: Upload Pages artifact
        if: steps.resolve.outputs.ready == 'true' && steps.mode.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: assemble
    if: needs.assemble.outputs.ready == 'true' && needs.assemble.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
