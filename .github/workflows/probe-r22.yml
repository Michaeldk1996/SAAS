name: probe-r22 (branch only — live read-back of the close-out)
on:
  push:
    branches: [claude/wonderful-fermat-clvs94]
    paths: [tools/probe-r22/trigger]
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Live read-back
        run: |
          head -n 90 tools/price-consistency.mjs > tools/probe-r22/run.mjs && cat tools/probe-r22/tail.mjs >> tools/probe-r22/run.mjs
          CHROME_BIN=google-chrome node tools/probe-r22/run.mjs --base https://michaeldk1996.github.io/SAAS/ 2>&1 | grep -E '^### v|price-consistency' | cut -c1-30000
