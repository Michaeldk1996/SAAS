name: BSP daily DNA ratings refresh

# TEN-319 (founder-approved 2026-09-28). Rebuilds dna-apitennis-ratings.json — the
# Playing Style DNA radar (Match analysis modal, H2H page, player profile Ratings) —
# and commits it back to main. pipeline.yml copies the committed file into _site, so a
# refresh reaches the live site on the next pipeline tick.
#
# Inputs, none of them from the checkout's stale copies (see the builder's header):
#   roster   DEPLOYED player-profiles.json via tools/deployed-store.js (fails closed
#            rather than read the committed July fossil)
#   surfaces DEPLOYED tournament-surfaces.json
#   boxes    api-tennis ATP (265) tier pages, 7-day windows 2024-03-06..today,
#            ~135 get_fixtures calls per run, fetched fresh every run (the runner
#            starts with an empty .dna-boxscores/)
#   elo      committed elo-ratings.json (elo.yml commits it back weekly)
#
# Cadence: twice daily. This repo's `schedule:` is throttled (hourly slots measured at
# ~27% delivery), so two slots make a daily refresh likely without an external pinger;
# a second run on an unchanged day commits nothing but the new generatedAt stamp.
# 06:40 UTC sits after the Americas' last matches have settled and after the 06:00
# surface-ratings run. workflow_dispatch allows a manual refresh.

on:
  schedule:
    - cron: '40 6 * * *'
    - cron: '40 18 * * *'
  workflow_dispatch:

concurrency:
  group: bsp-dna-ratings
  cancel-in-progress: false

permissions:
  contents: write            # needed to commit the refreshed file

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Record the committed file's rated count and corpus size
        run: |
          PREV=$(node -e 'let n=0;try{n=(require("./dna-apitennis-ratings.json").players||[]).length}catch(e){}; process.stdout.write(String(n))')
          echo "PREV_RATED=$PREV" >> "$GITHUB_ENV"
          PREVF=$(node -e 'let n=0;try{n=require("./dna-apitennis-ratings.json")._meta.ingest.fixturesSeen||0}catch(e){}; process.stdout.write(String(n))')
          echo "PREV_FIXTURES=$PREVF" >> "$GITHUB_ENV"

      - name: Rebuild DNA ratings
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        run: node dna-apitennis-ratings.js

      - name: Sanity-check the rebuilt file
        # A truncated build must never overwrite a good file.
        run: |
          node -e '
            const d = require("./dna-apitennis-ratings.json");
            const n = (d.players || []).length;
            const prev = parseInt(process.env.PREV_RATED, 10) || 0;
            const m = d._meta || {};
            if (!m.roster || m.roster.source !== "deployed") { console.error("::error::roster was not the deployed store — refusing to commit"); process.exit(1); }
            if (n < 200) { console.error(`::error::only ${n} rated players — refusing to commit`); process.exit(1); }
            if (n < Math.floor(prev * 0.9)) { console.error(`::error::rated count regressed ${prev} -> ${n} — refusing to commit`); process.exit(1); }
            // The 2024-03-06.. corpus only grows. A tier page that answered success with no
            // rows (a vendor hiccup reads exactly like an empty week) shows up here.
            const fx = (m.ingest || {}).fixturesSeen || 0, prevFx = parseInt(process.env.PREV_FIXTURES, 10) || 0;
            if (fx < Math.floor(prevFx * 0.98)) { console.error(`::error::box-score corpus shrank ${prevFx} -> ${fx} fixtures — refusing to commit`); process.exit(1); }
            console.log(`OK: ${n} rated of ${m.rosterSize} (was ${prev}), ${fx} fixtures (was ${prevFx}), generatedAt ${m.generatedAt}.`);
          '

      - name: Run the DNA suite on the rebuilt file
        # npm test gates every deploy and includes this suite, so a file that fails it
        # must never reach main — it would freeze the site on the next pipeline tick.
        run: node tools/test-dna-percentiles.js

      - name: Commit refreshed dna-apitennis-ratings.json
        run: |
          if git diff --quiet -- dna-apitennis-ratings.json; then
            echo "Nothing changed — nothing to commit."
            exit 0
          fi
          git config user.name  "bsp-dna-bot"
          git config user.email "bsp-dna-bot@users.noreply.github.com"
          # tools/commitback-push.sh rebases and retries on a race, and exits 2 (red) if
          # the commit itself conflicts — a bare `pull --rebase || true` loop could print
          # "Pushed" after losing the refresh.
          COMMITBACK_OWNED=dna-apitennis-ratings.json \
            bash tools/commitback-push.sh "chore(dna): daily DNA ratings refresh [skip ci]" dna-apitennis-ratings.json
