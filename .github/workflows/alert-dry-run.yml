name: Alert dry run
# Founder 2026-11-01, Task C: the alerts are proven on a REAL, deliberately broken run, not a local copy. Dispatch with
# mode=fail (the job fails), mode=cancel (it cancels itself mid-run), mode=nothing (it succeeds without uploading its data artifact,
# like a data run that publishes nothing) or mode=ok (it succeeds and uploads `alert-dry-data`, so a RECOVERED line follows a reported streak).
# Job failure alert (job-fail-alert.yml) watches it like any scheduled job.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: fail | cancel | nothing | ok
        required: true
        default: fail
permissions:
  actions: write
  contents: read
jobs:
  dry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The deliberately broken step
        env:
          MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "alert dry run: mode=${MODE}"
          case "$MODE" in
            fail) echo "::error::deliberately broken (Task C dry run)"; exit 1 ;;
            cancel) gh run cancel "${GITHUB_RUN_ID}" -R "${GITHUB_REPOSITORY}"; sleep 60 ;;
            nothing|ok) echo "no failure" ;;
            *) echo "::error::unknown mode ${MODE}"; exit 2 ;;
          esac
      - name: Upload site-data (mode=ok only)
        if: inputs.mode == 'ok'
        run: mkdir -p _dry && echo ok > _dry/ok.txt
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'ok'
        with:
          name: alert-dry-data   # never `site-data`: publish.yml would take it as the site's data
          path: _dry
          retention-days: 1
