name: TEN-232 kibl archive

# TEN-232 Part 1 — pre-match line archive for the Kibl feed.
#
# WHY THIS RUNS ON A SCHEDULE AND NOT ON DEMAND: Kibl has no history endpoint
# and no export endpoint. It serves the opening price and the current price and
# discards everything in between as soon as a new price lands. A sweep that does
# not run is not a sweep we run later — it is a price nobody has. The founder's
# instruction is explicit: archive first.
#
# Scope: men's leagues (ATP 19, Challenger 537, ITF Men 962), pre-match only.
# WTA / WTA-125K / ITF Women are deliberately excluded even though this account
# is entitled to them and they ARE priced.
#
# Writes to the private Supabase bucket `kibl-raw` and two Postgres tables with
# RLS on and zero policies. Touches no site surface and publishes nothing.

on:
  schedule:
    # Fires every 5 minutes; --cadence-gate decides whether a firing does any
    # work. Founder ruling 2026-09-18 item 2: 15-minute baseline, 5-minute from
    # T-60 to the start. Cron cannot see when a fixture starts, so the rule
    # lives in should_sweep() where it can be tested and counted, and the
    # schedule only has to fire often enough for it to be applicable.
    #
    # ⚠️ MEASURED 2026-09-18, and it is worse than 27%: this schedule delivered
    # ONE firing (05:07:36Z) in the 5h36m since the file landed on main at
    # 23:31Z — against ~67 due, so 1.5%. Repo-wide control over the same window:
    # 7 schedule runs across 7 distinct workflows, one each. Cron is not dead
    # here, it is throttled to roughly one firing per workflow per several
    # hours, and a `*/5` expression buys nothing over `@hourly`. The observed
    # inter-capture gaps under it were min 4 / median 65 / max 187 minutes
    # (n=6), independently recomputed from the GitHub run list.
    # The schedule is KEPT as a free backstop, but the cadence the
    # archive actually runs at comes from the Supabase pg_cron pinger installed
    # by `ten232-kibl-sweep-cron.yml` (same mechanism as TEN-141, measured ~100%
    # delivery), which dispatches this workflow with cadence_gate=true.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'sweep | backfill | report | cards | publish | audit | sides | books | gate | capability'
        default: 'sweep'
      feed_source_id:
        description: 'gate: the book under test, e.g. 171 for Bet105. No default on purpose — verified against the live entitlement before anything is reported.'
        default: ''
      section:
        description: 'capability: all | accuracy | markets | live | rows | endpoints | stream | coverage | limits'
        default: 'all'
      cadence_gate:
        description: 'sweep: apply should_sweep() before pulling (the pinger sets this)'
        default: 'false'
      horizon_days:
        description: 'sweep: how far forward, days'
        default: '3'
      from_days:
        description: 'backfill: oldest day to attempt'
        default: '35'
      to_days:
        description: 'backfill: newest day to attempt'
        default: '1'

concurrency:
  group: ten232-kibl-archive
  cancel-in-progress: false

# TEN-225 Part 3 — `write` so the publish step can commit odds-card-state.json.
# The sweep, the card fill and every report in this job stay read-only; the one
# writer is the publish step, and the one path it writes is that file.
# `actions: read` is for the circuit-breaker step, which reads this workflow's
# own run list to count consecutive failures.
permissions:
  contents: write
  actions: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      MGMT: https://api.supabase.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Guard — credentials present
        env:
          KIBL_USERNAME: ${{ secrets.KIBL_USERNAME }}
          KIBL_PASSWORD: ${{ secrets.KIBL_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          missing=
          for n in KIBL_USERNAME KIBL_PASSWORD SUPABASE_URL SUPABASE_SECRET_KEY; do
            eval "v=\$$n"
            [ -z "$(printf '%s' "$v" | tr -d '[:space:]')" ] && missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing secret(s):$missing"
            exit 1
          fi
          echo "all four credentials present (values never printed)"

      # Offline, no network. Locks the two properties that would corrupt the
      # archive silently: the is_opener pull axis (is_current does nothing, so a
      # merge built on it archives current prices twice and no openers) and the
      # refusal to issue a market call without feed_source_id (which returns 200
      # and an empty envelope).
      - name: Offline tests
        # All three harnesses, and -B so a cached .pyc from a previous job cannot
        # serve stale bytecode and report a false pass.
        run: |
          python3 -B test-kibl-client.py
          python3 -B test-ten232-report.py
          python3 -B test-ten232-bet105-capability.py
          python3 -B test-ten232-breaker.py
          python3 -B test-ten225-kibl-card-state.py
          python3 -B test-ten225-orientation.py
          python3 -B test-ten225-ddl-audit.py

      # DDL runs BEFORE the pull and is idempotent. Applying it every run is
      # what makes a dropped or drifted table a loud failure here rather than a
      # silent insert failure later, after the prices are already unrecoverable.
      - name: Apply the schema
        run: |
          set -euo pipefail
          REF=$(printf '%s' "$SUPABASE_URL" | sed -E 's#https?://([^./]+)\.supabase\.co/?.*#\1#')
          [ -n "$REF" ] && [ "$REF" != "$SUPABASE_URL" ] \
            || { echo "::error::could not derive project ref from SUPABASE_URL"; exit 1; }
          echo "PROJECT_REF=$REF" >> "$GITHUB_ENV"
          resp=$(jq -Rs '{query: .}' ten232-kibl-schema.sql | curl -sS -w $'\n%{http_code}' -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @- "$MGMT/v1/projects/$REF/database/query")
          code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::error::schema apply failed ($code): $body"; exit 1
          fi
          echo 'schema applied (idempotent).'

      # Proves the posture rather than asserting it: RLS on, zero policies. This
      # is odds data under a partner grant, not public data.
      - name: Verify RLS is on and no policy exists
        run: |
          set -euo pipefail
          read -r -d '' Q <<'SQL' || true
          SELECT c.relname,
                 c.relrowsecurity AS rls_enabled,
                 (SELECT count(*) FROM pg_policies p
                   WHERE p.schemaname='public' AND p.tablename=c.relname) AS policies
            FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
           WHERE n.nspname='public'
             AND c.relname IN ('kibl_line_observations','kibl_sweeps','kibl_fixtures')
           ORDER BY 1;
          SQL
          resp=$(jq -Rn --arg q "$Q" '{query: $q}' | curl -sS -w $'\n%{http_code}' -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @- "$MGMT/v1/projects/$PROJECT_REF/database/query")
          code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          echo "$body"
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::error::RLS check failed ($code)"; exit 1
          fi
          n=$(printf '%s' "$body" | jq '[.[] | select(.rls_enabled != true or .policies != 0)] | length')
          if [ "$n" != "0" ]; then
            echo "::error::a kibl table has RLS off or a policy attached"; exit 1
          fi
          tables=$(printf '%s' "$body" | jq 'length')
          if [ "$tables" != "3" ]; then
            echo "::error::expected 3 kibl tables, found $tables"; exit 1
          fi
          echo "RLS on, zero policies, all three tables present."

      - name: Sweep
        id: sweep
        if: github.event_name == 'schedule' || inputs.mode == 'sweep'
        env:
          KIBL_USERNAME: ${{ secrets.KIBL_USERNAME }}
          KIBL_PASSWORD: ${{ secrets.KIBL_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          # The gate applies to every AUTOMATIC firing — the schedule, and the
          # pg_cron pinger that dispatches with cadence_gate=true. A hand
          # dispatch defaults to false and always pulls, because when a person
          # asks for a sweep the answer "too soon" is not the one they want.
          python3 archive-kibl.py sweep \
            ${{ (github.event_name == 'schedule' || inputs.cadence_gate == 'true') && '--cadence-gate' || '' }} \
            --horizon-days "${{ github.event_name == 'schedule' && '3' || inputs.horizon_days }}"

      # One-time recovery of the ~30 days of finished fixtures that are still
      # reachable through start_time/end_time. That window slides forward daily.
      - name: Backfill
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'backfill'
        env:
          KIBL_USERNAME: ${{ secrets.KIBL_USERNAME }}
          KIBL_PASSWORD: ${{ secrets.KIBL_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python3 archive-kibl.py backfill \
            --from-days "${{ inputs.from_days }}" --to-days "${{ inputs.to_days }}"

      # TEN-225 Part 2/3 for the Kibl source. ZERO Kibl calls and zero oddspapi
      # units — a projection of what the archive already holds. Runs after the
      # sweep so a price captured this minute can reach a card in the same run.
      # Nothing member-visible: odds_card_state has RLS on and no policy, and no
      # surface reads it until Michael says go.
      - name: Card state (Open / Now / Close)
        # Only when the sweep actually ran. A skipped firing moved nothing, and
        # re-reading the whole card table twelve times an hour to project an
        # unchanged archive is cost with no output.
        if: |
          inputs.mode == 'cards' ||
          ((github.event_name == 'schedule' || inputs.mode == 'sweep') &&
           steps.sweep.outputs.swept != 'false')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # The FREE referee arm for the side-mapping gate. The board prices
          # Davis Cup and ATP, Kibl prices Challenger, and the two barely
          # intersect — measured on run 35297481674: 23 of 25 Kibl fixtures
          # unpaired, every one of them `not_on_board` and none a matcher fault.
          # api-tennis get_odds covers both tiers, bulk-by-date, and spends ZERO
          # oddspapi units (founder item 1: prefer free endpoints).
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        run: |
          set -euo pipefail
          resp=$(jq -Rs '{query: .}' ten225-card-state-schema.sql | curl -sS -w $'\n%{http_code}' -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @- "$MGMT/v1/projects/$PROJECT_REF/database/query")
          code=$(printf '%s' "$resp" | tail -n1)
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::error::card-state schema apply failed ($code): $(printf '%s' "$resp" | sed '$d')"; exit 1
          fi
          echo 'card-state schema applied (idempotent).'
          set -o pipefail
          # --use-live-flip: LADDER I(b), SWITCHED ON by founder item B
          # 2026-09-19 ("Ladder I(b): GO"). A Kibl fixture oddspapi does not
          # carry at all now cuts its Close at the live-flip lower bound
          # (last_not_live_seen_at) instead of having no Close at all. Both
          # ruled limbs still apply -- <=60 min lag and <=300 s flip gap, an
          # UNKNOWN gap being a rejection -- and the run prints a LIMB CHECK
          # verdict naming which limb rejected what, per limb, with n.
          python3 ten225-kibl-card-state.py --use-live-flip | tee -a "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------- PART 3
      # PUBLISH. odds_card_state has RLS on and zero policies and the product is
      # a static page, so there is no browser read path to the table and there
      # is not going to be one. The page reads a FILE; this is the only writer.
      #
      # Runs here rather than in its own workflow because the projection it
      # publishes is the one the step above just wrote — a separate schedule
      # would publish whatever the previous fill left, which on a 5-minute sweep
      # is yesterday's Open on today's card.
      - name: Publish odds-card-state.json
        id: publish
        if: |
          inputs.mode == 'publish' || inputs.mode == 'cards' ||
          ((github.event_name == 'schedule' || inputs.mode == 'sweep') &&
           steps.sweep.outputs.swept != 'false')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          # pipefail: without it a crashing publisher exits 0 through tee and
          # the run reports green on a file nobody wrote — the fail-open this
          # repo has been bitten by before (a dead probe reported a green run).
          set -o pipefail
          python3 -B test-ten225-publish-card-state.py | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -B ten225-publish-card-state.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit odds-card-state.json (only if changed)
        if: steps.publish.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name  "bsp-odds-bot"
          git config user.email "bsp-odds-bot@users.noreply.github.com"
          # Stage FIRST, then diff the index against HEAD: `git diff` only sees
          # TRACKED files, so the very first publish — the one that matters —
          # would read as "no changes" and never be committed.
          git add -- odds-card-state.json
          if git diff --cached --quiet; then
            echo "odds-card-state.json unchanged."
            exit 0
          fi
          git commit -m "chore(odds): publish odds_card_state projection [skip ci]"
          # Another run may have advanced main since checkout. Rebase and retry
          # so a benign race never loses a publish.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed odds-card-state.json on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing on origin/main."
            git pull --rebase origin main || true
          done
          echo "::error::could not push odds-card-state.json after 3 attempts"
          exit 1

      # TEN-225 founder directive 2026-09-18T22:01Z item 1 — FIND BET105.
      # Read-only: one /reference/sportsbooks call (free, no documented quota)
      # plus exact PostgREST counts. Writes nothing, archives nothing, publishes
      # nothing, spends zero oddspapi units.
      #
      # "Bet105 is not in our entitlement" exits 0 — it is a MEASUREMENT, not a
      # fault. /reference/sportsbooks IS the entitlement (a restricted account
      # returns 200 with fewer rows, never a 403), so an empty match there is an
      # answer, and the founder asked for it plainly rather than worked around.
      #
      # It exits 0 for a second reason that is not cosmetic: this job carries a
      # circuit breaker that unschedules the Supabase pinger after 3 consecutive
      # non-zero runs, and that pinger is the real cadence behind an archive
      # racing prices that vanish in 30-60 days. A read-only probe must never be
      # able to starve the job it is probing. Genuine faults still exit 1.
      # ENTITLEMENT WATCH — founder 2026-09-19 item 3: "Re-run this check on a
      # schedule from now on, say daily, and tell me the day it changes. I should
      # not have to ask."
      #
      # Runs on every SWEEP as well as on explicit dispatch, not on a daily cron.
      # Two measured reasons. (1) It is ONE free call -- /reference/sportsbooks
      # returned 510 bytes in 0.4 s -- so the marginal cost of checking every
      # sweep instead of once a day is nil. (2) This repo's `schedule:` cron is
      # THROTTLED: measured 1.5% delivery (one firing against ~67 due), which is
      # why the archive's real cadence comes from the Supabase pg_cron pinger.
      # A daily cron here would be a watch that mostly does not fire, which is
      # the failure this item exists to close.
      #
      # It speaks only when the entitlement DIFFERS from the committed baseline,
      # so a quiet run is quiet and the day it changes raises an ::error::
      # annotation that surfaces without anyone reading the log.
      - name: Find Bet105 / entitlement watch
        if: inputs.mode == 'books' || inputs.mode == 'sweep' || inputs.mode == ''
        env:
          KIBL_USERNAME: ${{ secrets.KIBL_USERNAME }}
          KIBL_PASSWORD: ${{ secrets.KIBL_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -o pipefail
          python3 -B ten232-bet105-find.py | tee -a "$GITHUB_STEP_SUMMARY"

      # The baseline is only rewritten when the entitlement actually changed, so
      # this commits nothing on a quiet run. Committed rather than cached: the
      # next runner must see the SAME baseline, or every run would diff against
      # an empty file and the watch would announce a change every time.
      - name: Commit the entitlement baseline (only if it changed)
        if: always() && (inputs.mode == 'books' || inputs.mode == 'sweep' || inputs.mode == '')
        run: |
          chmod +x ci-commit-push.sh
          ./ci-commit-push.sh "chore(kibl): entitlement baseline [skip ci]" \
            kibl-entitlement-baseline.json || true

      # Founder ruling 2026-09-18 item 4 — the generalisation of the
      # player1/player2 defect: a column declared in the DDL that NOTHING ever
      # writes cannot raise, so it has to be asked for. Read-only, header-count
      # only, no row bodies, no vendor calls. On demand, because the answer
      # changes only when a writer or the DDL changes.
      - name: DDL never-written audit
        if: inputs.mode == 'audit'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -o pipefail
          python3 ten225-ddl-null-audit.py | tee -a "$GITHUB_STEP_SUMMARY"

      # TEN-225 side-mapping diagnosis. Read-only, no vendor calls. Answers
      # what a Kibl side_id actually is, after the census showed side_id 1 never
      # appears and every priced fixture carries 2+3.
      # TEN-232 — the Bet105 gate. REPORT ONLY: it reads the book under test
      # directly instead of through VERIFIED_FEED_SOURCE_ID, because the card
      # path's filter is 43 and Bet105 is 171, so running the card path today
      # would read zero rows and print a clean 0% for every figure the founder
      # asked for. It writes nothing and renders nothing.
      #
      # API_TENNIS_KEY is passed because the side-mapping gate's free referee
      # arm needs it. Without it the gate sees the board alone, which on a
      # Challenger-heavy book is almost no referee at all.
      - name: Bet105 gate (report only)
        if: inputs.mode == 'gate'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          KIBL_USERNAME: ${{ secrets.KIBL_USERNAME }}
          KIBL_PASSWORD: ${{ secrets.KIBL_PASSWORD }}
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        run: |
          set -o pipefail
          python3 -B ten232-bet105-gate.py \
            --feed-source-id "${{ inputs.feed_source_id }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # TEN-225/232 founder directive 2026-09-21 — the full capability report.
      #
      # READ-ONLY, and the harness in the offline step proves it rather than
      # claiming it: no POST, no upsert, no PATCH, no DELETE, no file opened for
      # writing. It reads the archive this job fills and makes a short list of
      # GETs on endpoints we already hold entitlement for.
      #
      # WHY IT RUNS HERE AND NOT LOCALLY: SUPABASE_URL / SUPABASE_SECRET_KEY
      # exist only as Actions secrets. A local run reads nothing and would
      # report every figure as absent — which this script would correctly print
      # as a dash, and which would still be a wasted report.
      - name: Bet105 capability report (read only)
        if: inputs.mode == 'capability'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          KIBL_USERNAME: ${{ secrets.KIBL_USERNAME }}
          KIBL_PASSWORD: ${{ secrets.KIBL_PASSWORD }}
        run: |
          set -o pipefail
          python3 -B ten232-bet105-capability.py \
            --section "${{ inputs.section || 'all' }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Side-mapping probe
        if: inputs.mode == 'sides'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -o pipefail
          python3 ten225-kibl-side-probe.py | tee -a "$GITHUB_STEP_SUMMARY"

      # Runs even when the pull failed: whatever landed is real data, and the
      # size and reliability figures are how the 48h report and the gap alert are
      # read. Reported, never used to decide the cadence — that is the founder's.
      - name: Report
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        # pipefail: without it a crashing report exits 0 through tee and the run
        # reports green on a dead probe — the exact fail-open this repo has been
        # bitten by before.
        run: |
          set -o pipefail
          python3 archive-kibl.py report --days 3 | tee -a "$GITHUB_STEP_SUMMARY"

      # Standing rule: a self-dispatching job stops itself after 3 consecutive
      # non-zero runs. The pinger fires from Supabase and cannot see an outcome,
      # so the failure is reported from here. Counts THIS run as one of the
      # three — it only executes on failure() — plus the last two completed
      # runs, and unschedules the pinger when all three failed. Recovery is
      # deliberately manual: re-run ten232-kibl-sweep-cron.yml with
      # action=install once the cause is fixed.
      - name: Circuit breaker — stop the pinger after 3 consecutive failures
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION: breaker
        run: |
          set -o pipefail
          python3 -B ten232-kibl-sweep-cron.py | tee -a "$GITHUB_STEP_SUMMARY"
