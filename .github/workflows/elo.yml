name: BSP weekly Elo refresh

# Refreshes elo-ratings.json from the Tennis Abstract ATP Elo report, which
# itself updates weekly (Mondays). fetch-elo.js downloads + parses + caches the
# ratings locally so the dashboard never hits tennisabstract.com at runtime; it
# then commits elo-ratings.json back so the Playing Styles page shows current
# Elo on its next publish. No API keys or npm dependencies (uses Node's built-in
# fetch + fs).
#
# Cadence: Monday evening UTC, after Tennis Abstract has posted the week's update.
# Adjust the cron if the source's timing drifts. workflow_dispatch allows a manual
# refresh from the Actions tab any time.

# TEN-263 (founder ruling 2026-09-24): the Monday run stays. If Tennis Abstract's printed
# "Last update" has not moved, the job retries the next day, and daily until a new report is
# stored, then stops until next Monday. So the cron fires daily and the first step decides
# (tools/build-elo-history.mjs shouldFetch); a manual dispatch always fetches.
on:
  schedule:
    - cron: '0 20 * * *'    # daily 20:00 UTC; fetches on Monday, and on retry days only
  workflow_dispatch:

concurrency:
  group: bsp-elo
  cancel-in-progress: false

permissions:
  contents: write            # needed to commit the refreshed elo-ratings.json

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decide (Monday, or a retry day?)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch: fetching."; echo "fetch=true" >> "$GITHUB_OUTPUT"
          else
            node tools/build-elo-history.mjs --should-fetch
          fi

      - name: Fetch + parse Tennis Abstract Elo
        if: steps.gate.outputs.fetch == 'true'
        run: node fetch-elo.js

      # TEN-263 (founder ruling 2026-09-24): the Form tab reads Elo AT THE MATCH DATE, so every
      # new weekly report is appended to elo-history.json (append-only; unchanged ratings add
      # nothing). A failure here fails the job, so the history never silently stops growing.
      - name: Append to elo-history.json
        if: steps.gate.outputs.fetch == 'true'
        run: node tools/build-elo-history.mjs --append

      # A day with no new report commits nothing: elo-ratings.json would differ only in generatedAt.
      - name: Commit refreshed elo-ratings.json (only if a new report was stored)
        if: steps.gate.outputs.fetch == 'true'
        run: |
          if git diff --quiet -- elo-history.json; then
            echo "No new Tennis Abstract report; nothing to commit."
            exit 0
          fi
          git config user.name  "bsp-elo-bot"
          git config user.email "bsp-elo-bot@users.noreply.github.com"
          git add elo-ratings.json elo-history.json
          git commit -m "chore(elo): weekly Tennis Abstract Elo refresh [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed elo-ratings.json on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing on origin/main and retrying."
            git pull --rebase origin main || true
          done
          echo "::error::Could not push elo-ratings.json after 3 attempts."
          exit 1

      # Warn when the newest stored report is ELO_STALE_WARN_DAYS (8) or more days old. Red is off
      # (ELO_STALE_RED_DAYS = null) until Michael rules the threshold. Runs every day.
      - name: Elo staleness check
        if: always()
        run: node tools/build-elo-history.mjs --check-stale
