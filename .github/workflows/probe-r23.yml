name: probe-r23 (branch only — played-out non-results, old → new)
on:
  push:
    branches: [claude/wonderful-fermat-clvs94]
    paths: [tools/probe-r23/trigger]
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Live career-history shards
        run: |
          B=https://michaeldk1996.github.io/SAAS
          curl -sf "$B/career-history-index.json" -o career-history-index.json
          curl -sf "$B/player-profiles.json" -o player-profiles.json || true
          mkdir -p career-history
          node -e 'const i=require("./career-history-index.json");console.log(Object.keys(i.players||i).join("\n"))' > keys.txt
          wc -l keys.txt
          cat keys.txt | xargs -P 16 -I{} sh -c "curl -sf $B/career-history/{}.json -o career-history/{}.json || true"
          ls career-history | wc -l
      - name: New rule (this branch) and old rule (main), Tennis-Data basis
        run: |
          node tools/started-evidence.js --out ev-new.json
          mkdir -p new old
          DB_YIELD_STARTED=ev-new.json DB_YIELD_OUT_DIR=new node build-database-yield.js > new.log
          git worktree add /tmp/old origin/main -f >/dev/null 2>&1
          ln -s "$PWD/career-history" /tmp/old/career-history; cp career-history-index.json player-profiles.json /tmp/old/
          (mkdir -p /tmp/old/out && cd /tmp/old && node tools/started-evidence.js --out ev-old.json && DB_YIELD_STARTED=ev-old.json DB_YIELD_OUT_DIR=out node build-database-yield.js > old.log) ; mkdir -p /tmp/old/out
          node -e '
            const fs=require("fs");
            const ev=JSON.parse(fs.readFileSync("ev-new.json","utf8"));
            console.log("### counts "+JSON.stringify(ev.counts));
            for (const m of ev.matches.filter(x=>x.verdict==="completed")) console.log("### completed "+JSON.stringify([m.date,m.tournament,m.round,m.winner,m.loser,m.comment,m.says,m.winnerRow.row&&m.winnerRow.row.sets,m.loserRow.row&&m.loserRow.row.sets]));
            for (const m of ev.matches.filter(x=>x.verdict==="disagree")) console.log("### disagree "+JSON.stringify([m.date,m.tournament,m.round,m.winner,m.loser,m.comment,m.says]));
            const tb=(p)=>{try{return JSON.parse(fs.readFileSync(p,"utf8")).roles}catch(e){return String(e)}};
            const dy=(p)=>{try{const m=JSON.parse(fs.readFileSync(p,"utf8")).meta;return {started:m.started,ex:m.exclusions}}catch(e){return String(e)}};
            console.log("### old "+JSON.stringify(tb("/tmp/old/out/tour-baselines.json")));
            console.log("### new "+JSON.stringify(tb("new/tour-baselines.json")));
            console.log("### oldmeta "+JSON.stringify(dy("/tmp/old/out/database-yield.json")));
            console.log("### newmeta "+JSON.stringify(dy("new/database-yield.json")));
          '
