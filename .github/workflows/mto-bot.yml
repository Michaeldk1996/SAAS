name: mto-bot
# The 🩺 MEDICAL TIMEOUT Telegram alert + the permanent MTO archive (founder brief 2026-11-11). tools/mto-bot.sql;
# rules in .claude/rules/mto.md.
#   install  the throwaway-Postgres test first; apply tools/mto-bot.sql (additive, idempotent: schemas mto_rec + mto) and
#            tools/mto-levels.sql; copy the source's key (and the MTO chat id, when the secret exists) into Vault; schedule
#            the 10-second detector and the one-minute watch; one startup message to the MTO chat; the read-back.
#   report   the read-back only (counts, never a row).
#   weekly   send the weekly report now (it also goes out by itself every Monday 08:00 UTC, to the pipeline chat).
#   rollback unschedule the detector and the watch (the archive stays).
# Main only. Touches no other bot, no other chat and no existing Vault secret.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [report, install, rollback, weekly]
        default: report
permissions:
  contents: read
concurrency:
  group: mto-bot
  cancel-in-progress: false
jobs:
  mto:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - name: SQL test (throwaway Postgres, real captured payloads)
        if: inputs.mode == 'install'
        run: python3 tools/test-mto-bot-sql.py
      - name: Apply / roll back
        if: inputs.mode == 'install' || inputs.mode == 'rollback'
        env:
          LIVETENNISAPI_KEY: ${{ secrets.LIVETENNISAPI_KEY }}
          TELEGRAM_MTO_CHAT_ID: ${{ secrets.TELEGRAM_MTO_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error
          ref = re.sub(r'^https://([^.]+)\..*$', r'\1', os.environ['SUPABASE_URL'].strip())
          def sql(q):
              req = urllib.request.Request(f'https://api.supabase.com/v1/projects/{ref}/database/query',
                  data=json.dumps({'query': q}).encode(), headers={'Authorization': 'Bearer ' + os.environ['SUPABASE_ACCESS_TOKEN'],
                  'Content-Type': 'application/json', 'User-Agent': 'mto-bot'})
              try:
                  with urllib.request.urlopen(req, timeout=120) as r: return r.status, json.loads(r.read() or b'null')
              except urllib.error.HTTPError as e: return e.code, e.read()[:600].decode('utf8', 'replace')
          if os.environ['MODE'] == 'rollback':
              st, r = sql("select cron.unschedule(jobname) from cron.job where jobname in ('mto-detector', 'mto-watch', 'mto-weekly')")
              print('rollback HTTP', st, r if st >= 400 else ''); sys.exit(1 if st >= 400 else 0)
          key = (os.environ.get('LIVETENNISAPI_KEY') or '').strip()
          if not key: print('::error::LIVETENNISAPI_KEY is not set: the detector would have no source'); sys.exit(1)
          for attempt in (1, 2, 3):       # a re-install can deadlock with a running tick: retry
              st, r = sql(open('tools/mto-bot.sql').read()); print('apply HTTP', st)
              if st < 400: break
              print(r)
          if st >= 400: sys.exit(1)
          st, r = sql(open('tools/mto-levels.sql').read()); print('levels HTTP', st)
          if st >= 400: print(r); sys.exit(1)
          def vault(name, value, note):
              lit = "'" + value.replace("'", "''") + "'"
              st, r = sql(f"delete from vault.secrets where name = '{name}'; select vault.create_secret({lit}, '{name}', '{note}');")
              print(f'vault {name} store -> HTTP {st}')
              return st < 400
          if not vault('livetennisapi_key', key, 'MTO bot: Live Tennis API key'): sys.exit(1)
          chat = (os.environ.get('TELEGRAM_MTO_CHAT_ID') or '').strip()
          if chat:
              if not vault('mto_telegram_chat_id', chat, 'MTO bot: the MTO alerts chat'): sys.exit(1)
          else:
              print('::warning::TELEGRAM_MTO_CHAT_ID is not set: every MTO is archived, none is posted, until the chat exists')
          PY
      - name: Schedule the detector + the watch, startup message
        if: inputs.mode == 'install'
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error
          ref = re.sub(r'^https://([^.]+)\..*$', r'\1', os.environ['SUPABASE_URL'].strip())
          def sql(q):
              req = urllib.request.Request(f'https://api.supabase.com/v1/projects/{ref}/database/query',
                  data=json.dumps({'query': q}).encode(), headers={'Authorization': 'Bearer ' + os.environ['SUPABASE_ACCESS_TOKEN'],
                  'Content-Type': 'application/json', 'User-Agent': 'mto-bot'})
              try:
                  with urllib.request.urlopen(req, timeout=120) as r: return r.status, json.loads(r.read() or b'null')
              except urllib.error.HTTPError as e: return e.code, e.read()[:600].decode('utf8', 'replace')
          st, r = sql("select cron.schedule('mto-detector', '10 seconds', 'select mto_rec.tick()') a, cron.schedule('mto-watch', '* * * * *', 'select mto.watch_tick()') b, cron.schedule('mto-weekly', '0 8 * * 1', 'select mto.weekly_send()') c")
          print('schedule HTTP', st, r)
          if st >= 400: sys.exit(1)
          st, r = sql("select mto.startup() as rid"); print('startup HTTP', st, r)
          if st >= 400: sys.exit(1)
          PY
      - name: Weekly report now
        if: inputs.mode == 'weekly'
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error
          ref = re.sub(r'^https://([^.]+)\..*$', r'\1', os.environ['SUPABASE_URL'].strip())
          req = urllib.request.Request(f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': "select mto.weekly_send() r"}).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['SUPABASE_ACCESS_TOKEN'], 'Content-Type': 'application/json', 'User-Agent': 'mto-bot'})
          try:
              with urllib.request.urlopen(req, timeout=120) as r: print('weekly:', json.loads(r.read())[0]['r'])
          except urllib.error.HTTPError as e: print('weekly HTTP', e.code, e.read()[:400].decode('utf8', 'replace')); sys.exit(1)
          PY
      - name: Read-back
        if: inputs.mode != 'rollback'
        run: |
          [ "$MODE" = install ] && sleep 90
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error
          ref = re.sub(r'^https://([^.]+)\..*$', r'\1', os.environ['SUPABASE_URL'].strip())
          req = urllib.request.Request(f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': "select mto.settle(); select mto.report(24) r"}).encode(), headers={'Authorization': 'Bearer ' +
              os.environ['SUPABASE_ACCESS_TOKEN'], 'Content-Type': 'application/json', 'User-Agent': 'mto-bot'})
          try:
              with urllib.request.urlopen(req, timeout=120) as r: rep = json.loads(r.read())[0]['r']
          except urllib.error.HTTPError as e: print('read-back HTTP', e.code, e.read()[:400].decode('utf8', 'replace')); sys.exit(1)
          print(json.dumps(rep, indent=1))
          if os.environ['MODE'] == 'install':
              bad = []
              if len([j for j in (rep.get('cron') or []) if j.get('active')]) != 3: bad.append('cron jobs not all three active')
              if not rep.get('key'): bad.append('no source key in Vault')
              if ((rep.get('requests') or {}).get('ok') or 0) < 1: bad.append('no answer from the source recorded')
              if (rep.get('state') or {}).get('lastOkAt') is None: bad.append('the detector has not read its source')
              if rep.get('chat') and rep.get('startup') != 'sent': bad.append(f"startup message {rep.get('startup')}")
              if bad: print('::error::' + '; '.join(bad)); sys.exit(1)
          PY
