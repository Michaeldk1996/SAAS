name: BSP data pipeline

# Laptop-independent scheduler. Runs the same pipeline the local machine runs,
# but in GitHub's cloud so it fires whether or not the laptop is awake/online.
# It rebuilds the data, then publishes the dashboard + its JSON to GitHub Pages
# (Pages artifacts are ephemeral, so the 44 MB player-profiles.json does NOT
# bloat git history — unlike committing it back every run would).
#
# SETUP REQUIRED (see AUTOMATION.md): add repo secrets ODDS_API_KEY and
# API_TENNIS_KEY, and enable Pages (Settings → Pages → Source: GitHub Actions).

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes (UTC). GitHub may delay under load.
  workflow_dispatch:          # manual "Run workflow", and the external */10 ping
  #
  # ── TEN-178: the `push:` trigger was REMOVED, 2026-09-11 ───────────────────
  #
  # It used to auto-deploy an allowlist of frontend files so a dashboard change
  # didn't wait for a cron tick. Measured over the 100 runs to 2026-09-11T00:40Z,
  # that shortcut was the thing losing deploys:
  #
  #   GitHub's concurrency queue holds at most ONE running + ONE pending run per
  #   group, and a third arrival CANCELS the pending one. `cancel-in-progress: false`
  #   does not prevent that — it only protects the run already executing. This job's
  #   median runtime is 15.6 min (p90 21.9, max 25.6) and the external ping dispatches
  #   it every 10 minutes, so the queue is permanently at capacity. 21 of those 100
  #   runs ended `cancelled`, every one of them while pending — including run 2495,
  #   event `push`, head 8d116ee, "TEN-179 item 5: pin the FAV chip". That is how a
  #   merged commit sat on main looking shipped while Pages served the old bytes.
  #
  # A push run is just another arrival in that queue, so it was cancellable like any
  # other. With no push trigger there is no push run to cancel: every run is a tick,
  # every tick re-points itself at the tip of main (see the step below), and the ticks
  # are ten minutes apart. A merge therefore reaches Pages on the next tick —
  # ~26 min median, worst case ~35 — deterministically, instead of ~16 min most of the
  # time and never the rest of the time.
  #
  # Two alternatives were rejected, both measured:
  #   - Splitting the concurrency lane by event. This workflow is the ONLY caller of
  #     upload-pages-artifact/deploy-pages in the repo, so the single group is also the
  #     only serializer for Pages deployments. Splitting it allows two deploys to
  #     interleave: a slow tick that started before the merge can land AFTER the push
  #     deploy and roll the site back to pre-merge bytes for up to ~35 min, and the
  #     superseded deployment makes deploy-pages error — turning the push run red on
  #     exactly the path we are trying to protect.
  #   - Slowing the external ping below the job's p90. That works, but it is configured
  #     outside this repo and it costs board freshness (≤10 min becomes ≤30 min).
  #
  # If you need something live sooner than the next tick, DISPATCH the run.
  #
  # The job is deliberately the full pipeline, not a checkout-and-copy: Pages replaces
  # the whole site on every deploy and several served files (model-output.json, odds/,
  # form/, career-history/, setstats/, pbp/ shards) are built at runtime and are not in
  # git. A "fast deploy" would publish a site missing them.

# ONE group, on purpose — see above. It is also the only serializer for Pages
# deployments in this repo. cancel-in-progress stays OFF (founder ruling 2026-09-09).
concurrency:
  group: bsp-pipeline
  cancel-in-progress: false

permissions:
  contents: write      # was: read — needed so the run can commit admin-log.json back
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Bounded history for the merge-base guard below. NOT `0`: a full clone of
          # this repo is ~315 MB against ~25 MB shallow (3,443 commits on main, growing
          # ~124/day, matches.json rewritten 13x/day), and this job already runs to
          # 25.6 min against a 30-min timeout. 100 commits is ~19h of main — orders of
          # magnitude more than the few minutes a run can drift — so merge-base always
          # resolves well inside the graft boundary.
          fetch-depth: 100

      # TEN-178. With the push trigger gone, every run is a tick, and a tick's checkout
      # is pinned to the SHA that existed when it was QUEUED. In a saturated lane that
      # can be 15+ minutes stale, so a tick could publish a merge-old site even though
      # a newer main existed before it started building. Re-pointing at the tip first
      # makes every deploy carry the newest committed bytes, which is what lets the
      # "merge lands on the next tick" guarantee above actually hold.
      #
      # Safe here and only here: nothing has been generated, restored or installed yet,
      # and `reset --hard` does not touch untracked files in any case.
      - name: Re-point this run at the current tip of main
        run: |
          set -euo pipefail
          BEFORE=$(git rev-parse HEAD)
          if git fetch --quiet --depth=100 origin main; then
            git reset --hard FETCH_HEAD
            AFTER=$(git rev-parse HEAD)
            if [ "$BEFORE" = "$AFTER" ]; then
              echo "Already at the tip of main ($AFTER)."
            else
              echo "Advanced $BEFORE -> $AFTER before building."
            fi
          else
            # A transient fetch failure must not throw away a run. Build the SHA we
            # have; the guard before upload still asserts it is on main, and the next
            # tick is ten minutes away.
            echo "::warning::Could not fetch origin/main; building the checked-out SHA $BEFORE instead."
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # TEN-174 fail-closed pre-deploy gate. The progression source-guard
      # (tools/test-progression-seed.js, wired as `npm test`) fails the job if the
      # Player-progression win-detection reintroduces scoreline/resultDisplay parsing,
      # which credited eliminated losers a phantom win. Runs before the pipeline and
      # deploy so a regressed HTML never reaches Pages; fails fast (no API calls wasted).
      - name: Progression source-guard (fail-closed pre-deploy gate)
        run: npm test

      # Persist the heavy derived caches + TML archive between runs so each run
      # is fast and makes minimal API calls (matches how the local run reuses
      # them). Keyed per-day so it refreshes but still restores older caches.
      - name: Restore pipeline caches
        uses: actions/cache@v4
        with:
          path: |
            player-profiles-cache.json
            player-profiles.json
            player-tournament-history.json
            historical-match-stats.json
            tournament-profiles.json
            point-by-point-cache.json
            tml-cache
            model-output.json
            news-feed.json
            tournament-entries.json
          key: bsp-caches-${{ github.run_id }}
          restore-keys: |
            bsp-caches-

      - name: Run pipeline (with retry + health tracking)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
          # Stage 4 of the Tennis Edge Model (h2h-model): pre-bakes the Claude AI
          # match summary into model-output.json. The engine (Stages 1-3) runs with
          # or without this; only the summary field is gated on the key. Summaries
          # are hash-cached (see model-output.json in the cache below), so a run only
          # spends tokens on matches whose numbers actually changed.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DOTENV_CONFIG_QUIET: 'true'
        run: node run-pipeline.js github-actions

      # Backfill the stats + point logs behind the Overview / Career-record
      # drill-down, ONE call per tracked player (the player-keyed fixture window
      # already carries both inline). Runs BEFORE the shard build on purpose:
      # it only fills point-by-point-cache.json, and every match it caches is one
      # the next step then does NOT have to fetch per-match — so it speeds that
      # job up rather than competing with it. Self-terminating: once every
      # tracked player's rows are cached it makes no calls at all.
      - name: Backfill history match shards (best-effort)
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        run: node backfill-history-shards.js || true

      # Point-by-point sidecar (Task 4): lazy companion the dashboard fetches on
      # demand for finished matches. Best-effort — never block the deploy: a
      # failure here leaves the previous point-by-point.json (from cache) or none.
      - name: Build point-by-point sidecar (best-effort)
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        run: node build-point-by-point.js || true

      # News feed (TEN-8): pull the api-tennis get_news window and store every
      # article verbatim in news-feed.json for the dashboard's News page. Uses the
      # same API_TENNIS_KEY secret as the rest of the pipeline. Best-effort — a
      # failure keeps the previous news-feed.json (from cache) and never blocks the
      # deploy.
      - name: Build news feed (best-effort)
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        run: node build-news-feed.js || true

      # Tournament entries (TEN-8): for each current ATP-main-tour singles event,
      # the roster of players in it (derived from get_fixtures) enriched with ATP
      # rank + nationality (get_standings). Powers the News page tournament filter.
      # api-tennis has no entry-list/seed endpoint, so this is fixtures-derived and
      # seeds are omitted — see build-tournament-entries.js header. Best-effort: a
      # failure keeps the previous tournament-entries.json and never blocks deploy.
      - name: Build tournament entries (best-effort)
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        run: node build-tournament-entries.js || true

      # Market-performance shards, rebuilt every run against the profiles the pipeline
      # just refreshed. Reads only the committed odds-archive/ CSVs, so it makes no
      # network calls and cannot be broken by tennis-data.co.uk being down (it was, on
      # 2026-07-18). Rebuilding here rather than relying on the committed shards is what
      # keeps players who newly enter the profile roster from silently missing the block.
      - name: Build market performance shards (best-effort)
        run: node build-odds-performance.js || true

      # Per-tournament market performance (TEN-8 Tournaments Overview §4/§5):
      # flat-stake yields backing favourites/underdogs + favourite reliability,
      # grouped by tournament from the same committed odds-archive/ CSVs. No
      # network calls. Best-effort: a failure keeps the committed JSON.
      - name: Build tournament market (best-effort)
        run: node build-tournament-market.js || true

      # MARKET SIZE shards (TEN-8): per-match prediction-market 24h volume from
      # Kalshi (sum of both players' contract legs) and Polymarket (moneyline
      # market). Reads the matches.json the pipeline just wrote. Best-effort —
      # if a venue is unreachable, the previous run's committed shards remain
      # and are copied below, and any market already settled stays frozen at its
      # settlement snapshot (fetch-market-size.js never re-queries a frozen
      # venue). A venue outage must not break the pipeline.
      - name: Build market-size shards (best-effort)
        run: node fetch-market-size.js --slate matches.json --out market || true

      # TEN-151 Trading Report data layer (Route B, FUSED): per-player 24-month
      # situational splits (SH/SPW/RPW/BPS/BPW as numerator/denominator) built from
      # the same api-tennis get_fixtures the pipeline already fetches — one shard
      # per player + a gating index (with the name/rank/country meta map). ~428
      # get_fixtures/run; call volume is not a constraint on the top plan (founder
      # ruling 2026-09-05).
      #
      # ISOLATED FAIL-LOUD (founder ruling 2026-09-05, second comment): the Trading
      # Report is the newest and least-tested surface, and it must NOT hold the
      # core board's deploy hostage. So `continue-on-error` lets the core board
      # deploy even when this generator fails — but the failure is NOT swallowed:
      # the "Re-raise Trading Report generator failure" step at the end of the job
      # turns the whole RUN red (and writes the run summary) AFTER the deploy has
      # published. Loud failure, isolated failure. The generator itself refuses to
      # publish an empty roster (zero-shard guard) so a clean-exit-empty can no
      # longer green the pipeline. NOTE: on a failure the trading shards are simply
      # not refreshed this run — "keep last good rather than ship empty" persistence
      # is a separate open decision (there is no in-repo shard snapshot yet).
      - name: Build Trading Report splits (isolated fail-loud)
        id: trading_splits
        continue-on-error: true
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        run: node build-trading-splits.js

      # TEN-168 Series page data layer. Current streaks for today/tomorrow's slate,
      # built from fetchRecentSinglesFixtures (same source as the Trading Report) +
      # the committed playing-styles / tournament-surfaces maps + player-profiles.json
      # (built earlier this run). Writes series.json only — read-only otherwise.
      # ISOLATED + best-effort (|| true): like the Trading Report, this newest surface
      # must never hold the core board's deploy hostage. The engine writes atomically
      # (tmp + rename) and refuses a partial write, and a committed series.json seed
      # is served if this run doesn't refresh it, so the page is never empty.
      - name: Build Series streaks (best-effort)
        continue-on-error: true
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        run: node build-series.js || true

      # Assemble the static site: the dashboard as index.html + the JSON files it
      # fetches (all same-origin, relative paths) + the health file.
      #
      # Every file the browser can ask for must be copied here explicitly — the
      # repo is NOT the document root, only _site is. Anything committed but not
      # copied 404s silently at runtime, which is how sign-in stayed broken.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp bsp-consult-dashboard.html _site/index.html
          # The auth pages link to the dashboard by its repo filename, so publish
          # it under that name too, not just as index.html.
          cp bsp-consult-dashboard.html _site/bsp-consult-dashboard.html
          cp auth.html account.html funnel.html verify.html auth.js analytics.js _site/
          # TEN-107 Live tab: the standalone Live page reads the Supabase live_snapshot
          # row via PostgREST. Committed but not copied = silent 404 → the Live tab stays
          # dark even with the flag on. Public Supabase creds are injected below.
          cp live-tab.js _site/
          cp admin.html admin-config.js _site/ 2>/dev/null || true
          cp matches.json tournament-profiles.json tournament-progression.json player-profiles.json _site/
          cp career-splits.json _site/
          # TEN-173 Points at Risk: static artifact refreshed daily by
          # points-at-risk.yml (its own fail-closed workflow). The profile "Points
          # at Risk" tile reads it once, keyed by player_key. Assert-gated below.
          cp points-at-risk.json _site/
          # TEN-162: per-player match lists behind each split row (the profile
          # splits drawer). Committed by the local career-splits refresh alongside
          # career-splits.json (TA-sourced, CI can't fetch it). Index-gated on the
          # client, so a missing shard degrades to an empty drawer, never a broken
          # table — tolerant copy, NOT in the assert list.
          cp splits-matches-index.json _site/ 2>/dev/null || true
          cp -r splits-matches _site/ 2>/dev/null || true
          # TEN-146 Database tab: yield-by-odds-band artefacts (base + lazy names shard),
          # built by build-database-yield.js from odds-archive/*.csv. Committed but not
          # copied = silent 404 → the Database tab renders empty. Required when the flag is on.
          cp database-yield.json database-yield-players.json _site/
          # TEN-136: ATP headshot alias map ({player_key: ATP_ALIAS}), hand-committed,
          # written by no job. The dashboard avatar chain fetches it as the ATP step
          # above the api-tennis logo. Committed but not copied = silent 404, which
          # makes the entire ATP headshot layer disappear (every player falls back to
          # the api-tennis logo). Required — in the assert list below.
          cp player-atp-aliases.json _site/
          # ASAP Sports "Player's own words" readiness signal (TEN-8), keyed by
          # profile key; asapsports.yml rebuilds it twice daily. Tolerant cp (may
          # not exist before that workflow's first run) — NOT in the assert list.
          cp asapsports-signal.json _site/ 2>/dev/null || true
          # Tennis Edge Model output (h2h-model engine + pre-baked AI summary),
          # one entry per match. Committed but not copied = silent 404, which
          # empties the entire Edge Model page. bsp-pipeline.js writes it last,
          # after matches.json, on every run.
          cp model-output.json _site/ 2>/dev/null || true
          # Career-record drill-down, one shard per player. The index gates every
          # request, so if it doesn't ship, no cell in the Career-record table
          # opens at all — publish both or neither.
          cp career-history-index.json _site/ 2>/dev/null || true
          cp -r career-history _site/ 2>/dev/null || true
          cp point-by-point.json _site/ 2>/dev/null || true
          cp pbp-index.json _site/ 2>/dev/null || true
          cp -r pbp _site/ 2>/dev/null || true
          cp setstats-index.json _site/ 2>/dev/null || true
          cp matchstats-index.json _site/ 2>/dev/null || true
          cp -r setstats _site/ 2>/dev/null || true
          cp form-index.json _site/ 2>/dev/null || true
          cp -r form _site/ 2>/dev/null || true
          # Per-book odds timelines, lazy per match. The index gates the Odds
          # tab: without it every match silently falls back to the reduced view,
          # which is exactly how the movement chart went missing for three days.
          cp odds-index.json _site/ 2>/dev/null || true
          cp -r odds _site/ 2>/dev/null || true
          # BET365 HISTORY ARCHIVE (TEN-179 item 1): per-month shards of the
          # reduced open->close series, written by bet365-archive.yml. Published
          # so a later change can read it, but deliberately NOT on any startup
          # path — nothing fetches its index.json at boot, so this cannot regress
          # the payload budget that matches.json already dominates. Separate from
          # odds-archive/ (the Pinnacle 2010-2025 set) and from the odds/ shards.
          cp -r bet365-history _site/ 2>/dev/null || true
          # MARKET SIZE (TEN-8): the index gates every shard fetch, exactly like
          # odds-index.json — without it the dashboard never asks for a shard and
          # the block silently hides. The health file feeds the admin all-time vs
          # 24h view + split coverage counters. All three are best-effort copies.
          cp market-index.json _site/ 2>/dev/null || true
          cp -r market _site/ 2>/dev/null || true
          cp market-size-health.json _site/ 2>/dev/null || true
          cp pipeline-health.json _site/ 2>/dev/null || true
          # News feed (TEN-8): every article from the api-tennis get_news window,
          # stored verbatim by build-news-feed.js. Committed but not copied = silent
          # 404, which empties the News page.
          cp news-feed.json _site/ 2>/dev/null || true
          # Tournament entries (TEN-8): per-ATP-draw rosters that power the News
          # page tournament filter. Committed but not copied = silent 404, which
          # just hides the filter (the feed still shows).
          cp tournament-entries.json _site/ 2>/dev/null || true
          # Playing Styles + Player Profile redesign data: Elo pill, clutch rating,
          # archetype rosters, and the self-computed matchup matrix. Committed but
          # not copied = silent 404 (Elo pill degrades; the Styles tab goes empty).
          cp elo-ratings.json _site/ 2>/dev/null || true
          cp clutch-rating.json _site/ 2>/dev/null || true
          cp surface-ratings.json _site/ 2>/dev/null || true
          cp archetypes-classified.json _site/ 2>/dev/null || true
          cp matchup-matrix.json _site/ 2>/dev/null || true
          cp playing-styles.json _site/ 2>/dev/null || true
          # Break/Hold heatmap shard (TEN-107, founder ruling 2026-09-01: 24M
          # window, bucketed axis). Built by build-holdbreak.js in the styles
          # cron from the harvested pbp cache. Committed but not copied = silent
          # 404. Best-effort copy so an absent shard never blocks the deploy.
          cp holdbreak.json _site/ 2>/dev/null || true
          # Entry Lists shard (TEN-150): per-tournament acceptance lists scraped daily by
          # tools/entry-lists/build-entry-lists.py via launchd cron. Committed but not
          # copied = silent 404 (Entry Lists tab shows "unavailable"). Best-effort so an
          # absent shard (first-boot, before the cron runs) never blocks the deploy.
          cp entry_lists.json _site/ 2>/dev/null || true
          # Entry Lists ADVANCE shard (TEN-150): upcoming-week acceptance lists scraped
          # daily from ticktocktennis by tools/entry-lists/build-entry-lists-advance.mjs.
          # The Entry Lists tab merges this (advance regime) with entry_lists.json (draw
          # regime). Committed but not copied = silent 404 and the tab loses discovery /
          # every upcoming tournament. Best-effort so an absent shard never blocks deploy.
          cp entry_lists_advance.json _site/ 2>/dev/null || true
          # TEN-88 option B: per-player CAREER meeting shards + their index gate the
          # "vs this style" detail list on the Playing-style tab. The index gates the
          # fetch, so committed-but-not-copied = silent 404 and the list falls back to
          # its honest empty state. Publish both or neither.
          cp style-meetings-index.json _site/ 2>/dev/null || true
          cp -r style-meetings _site/ 2>/dev/null || true
          # Six-axis style radar for the Match Analysis "Playing style" tab.
          # Percentile block only — tools/build-style-radar.js strips the raw
          # Match Charting rates, which are internal-only and must not be served.
          cp style-radar.json _site/ 2>/dev/null || true
          # TEN-103 Playing Style DNA radar (H2H compare page): 5 api-tennis-native
          # axes (Serve / Return / Under Pressure / Dominance Ratio / Surface Elo),
          # percentile-banded. Committed static data — NO workflow regenerates it, so
          # the committed copy IS the source of truth. Not copied = silent 404 and the
          # H2H DNA radar (a paid feature) goes empty. In the assert list below.
          cp dna-apitennis-ratings.json _site/ 2>/dev/null || true
          # Market performance: the index gates the profile block (no entry = no block,
          # so a missing index silently hides the feature for every player), the shards
          # carry the detail. odds-archive/ is deliberately NOT copied — it is the raw
          # source the builder reads, never fetched by the browser.
          cp odds-performance-index.json _site/ 2>/dev/null || true
          cp -r odds-performance _site/ 2>/dev/null || true
          # Per-tournament market performance (Tournaments Overview §4/§5). Fetched
          # by the dashboard; a missing file just em-dashes those two blocks.
          cp tournament-market.json _site/ 2>/dev/null || true
          # TEN-151 Trading Report (flag-gated OFF): the module, the splits index +
          # per-player shards, and the tournament→surface map the board joins on.
          # The index gates the shard fetches; committed/built-but-not-copied =
          # silent 404 and the board dashes. Best-effort so an absent shard (before
          # the build step's first run) never blocks the deploy.
          cp trading-report.js _site/ 2>/dev/null || true
          # TEN-168 Series page: the module + its stylesheet + the streak data. The
          # HTML references series.js/series.css, so both are asserted below. series.json
          # is the committed seed refreshed by the build step above; tolerant copy so an
          # absent/failed build never blocks the deploy (the page dashes to its honest
          # empty state instead of a broken tab).
          cp series.js series.css _site/ 2>/dev/null || true
          cp series.json _site/ 2>/dev/null || true
          cp trading-splits-index.json _site/ 2>/dev/null || true
          cp -r trading-splits _site/ 2>/dev/null || true
          # Wikidata-P18 headshot override map (enrich-player-photos.py). Committed
          # but never copied → 404 at runtime → _photos={} → EVERY avatar (Trading
          # Report AND the main dashboard) fell back to a monogram. Publishing it is
          # what actually makes the photos appear; the render/URL logic was fine.
          cp player-photos.json _site/ 2>/dev/null || true
          # tournament_key → surface map: the Trading Report reads it client-side to
          # label each live row's surface and pick the surface split. Same map the
          # generator used, so the board can't diverge. Not previously published.
          cp tournament-surfaces.json _site/ 2>/dev/null || true

      # TEN-107: inject the PUBLIC Supabase creds into the served dashboard. The
      # project URL + publishable (anon) key are browser-safe by design — RLS
      # allows anon to SELECT only the single live_snapshot row and nothing else.
      # Placeholders (__SUPABASE_URL__ / __SUPABASE_ANON_KEY__) stay in git; only
      # the deployed _site copies carry the values. Literal string replace (no
      # sed metachar hazards on the URL/key). No-op if the secrets are unset —
      # live-tab.js rejects the leftover "__" placeholders and stays dark.
      - name: Inject Supabase public config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Supabase public creds not set — leaving placeholders (Live tab stays off)."
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const url = process.env.SUPABASE_URL.replace(/\/+$/, "");
            const key = process.env.SUPABASE_PUBLISHABLE_KEY;
            for (const f of ["_site/index.html", "_site/bsp-consult-dashboard.html"]) {
              let s = fs.readFileSync(f, "utf8");
              s = s.split("__SUPABASE_URL__").join(url).split("__SUPABASE_ANON_KEY__").join(key);
              fs.writeFileSync(f, s);
            }
            console.log("Injected Supabase public config into served dashboard.");
          '
          # Fail loudly if a placeholder survived (would silently disable Live).
          if grep -q "__SUPABASE_URL__\|__SUPABASE_ANON_KEY__" _site/index.html; then
            echo "::error::Supabase placeholder left in _site/index.html"; exit 1
          fi

      # Fail loudly if a file the pages reference is missing from the artifact.
      # A 404 on auth.js only shows up as a dead button in the browser, so catch
      # it here where it is still a build error.
      - name: Assert site completeness
        run: |
          # form-index.json gates the Form tab: the dashboard reads it before it
          # will fetch a single form shard, so if it 404s the tab is empty for
          # every match and nothing else complains. bsp-pipeline.js writes it on
          # every run alongside matches.json.
          for f in index.html bsp-consult-dashboard.html auth.html auth.js analytics.js account.html funnel.html verify.html \
                   live-tab.js \
                   matches.json player-profiles.json career-splits.json form-index.json \
                   points-at-risk.json \
                   player-atp-aliases.json \
                   matchup-matrix.json playing-styles.json style-radar.json \
                   dna-apitennis-ratings.json \
                   style-meetings-index.json \
                   odds-performance-index.json odds-index.json \
                   series.js series.css; do
            [ -s "_site/$f" ] || { echo "MISSING from _site: $f"; exit 1; }
          done
          # style-meetings-index.json gates the "vs this style" detail list exactly
          # like form-index gates the Form tab, but the rows live in the shard DIR —
          # index present + dir empty (a silent `cp -r` failure) would 404 every
          # shard. Enforce the diff's "publish both or neither".
          [ -d _site/style-meetings ] && [ -n "$(ls -A _site/style-meetings 2>/dev/null)" ] \
            || { echo "MISSING from _site: style-meetings/ shard dir is absent or empty"; exit 1; }
          echo "All referenced files present in _site."

      # TEN-178 scope item 2 — the merge-ancestor guard.
      #
      # Two separate jobs, both of which have to be true before anything ships:
      #
      #   1. The commit we are about to publish must be ON main. A deploy from a
      #      SHA that is not an ancestor of origin/main is a deploy of something the
      #      founder never merged, and it fails the run rather than reaching Pages.
      #   2. The artifact must CARRY that commit. Without a stamp inside _site there
      #      is no way to tell from the live URL whether a green run's bytes actually
      #      arrived — which is the exact failure class this issue exists to close.
      #      build-info.json makes it a one-line check against the deployed site:
      #        curl -s https://michaeldk1996.github.io/SAAS/build-info.json
      #
      # A tip that has moved on since checkout is reported loudly but does NOT fail the
      # run: data commits land on main every few minutes, so failing on that would fail
      # almost every run. The next tick republishes from the newer tip regardless.
      - name: Deploy ancestor guard + build stamp
        run: |
          set -uo pipefail       # NOT -e: every failure below is handled explicitly
          SHA=$(git rev-parse HEAD)
          TIP=""; BEHIND=-1; VERIFIED=false

          # A transient fetch failure must not bin a completed pipeline at the last
          # gate — that would throw away ~20 min of work and the API spend with it.
          # It degrades to an unverified deploy, recorded as such in the stamp.
          if git fetch --quiet --depth=100 origin main; then
            TIP=$(git rev-parse FETCH_HEAD)
            # --is-ancestor exits 1 for "not an ancestor" and 128 for "git failed"
            # (bad object, shallow graft, corrupt pack). Conflating them turns an
            # infrastructure blip into a confident, wrong accusation that a merged
            # commit is not on main — in the one step whose job is trustworthy
            # diagnosis. Branch on the status.
            # No `set +e`/`set -e` pair here: errexit is never on in this step (see the
            # `set -uo pipefail` above), so `set -e` would not RESTORE anything — it
            # would switch errexit ON for the rest of the step and contradict this
            # step's whole contract, letting an incidental non-zero exit bin a
            # completed pipeline at the last gate. `RC=$?` captures the status either
            # way; every failure below stays explicitly handled.
            git merge-base --is-ancestor "$SHA" "$TIP"
            RC=$?
            if [ "$RC" -eq 0 ]; then
              VERIFIED=true
              BEHIND=$(git rev-list --count "$SHA..$TIP" 2>/dev/null || echo -1)
              if [ "$BEHIND" -gt 0 ]; then
                echo "::warning::Publishing $SHA while origin/main is $BEHIND commit(s) ahead ($TIP). The next tick republishes from the newer tip."
                # Informational only — never let the listing itself fail the deploy.
                git log --oneline "$SHA..$TIP" 2>/dev/null | sed 's/^/  ahead: /' || true
              fi
            elif [ "$RC" -eq 1 ]; then
              echo "::error::Refusing to publish $SHA — it is not an ancestor of origin/main ($TIP). Nothing was deployed."
              exit 1
            else
              echo "::warning::merge-base failed with status $RC (not a merge problem — git could not answer). Publishing $SHA unverified."
            fi
          else
            echo "::warning::Could not fetch origin/main. Publishing $SHA unverified."
          fi

          export SHA TIP BEHIND VERIFIED
          node -e '
            const fs = require("fs");
            fs.writeFileSync("_site/build-info.json", JSON.stringify({
              commit:     process.env.SHA,
              tip:        process.env.TIP || null,
              behindTip:  Number(process.env.BEHIND),   // -1 = could not be determined
              onMain:     process.env.VERIFIED === "true",
              event:      process.env.GITHUB_EVENT_NAME,
              runId:      process.env.GITHUB_RUN_ID,
              runNumber:  Number(process.env.GITHUB_RUN_NUMBER),
              builtAt:    new Date().toISOString(),
            }, null, 2) + "\n");
          '
          echo "Stamped _site/build-info.json:"
          cat _site/build-info.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # Surface failures loudly: if the pipeline could not produce a fresh
      # success, fail the job so GitHub emails/notifies (and the health file
      # published above shows the banner on the live dashboard).
      - name: Assert pipeline freshness
        run: |
          node -e '
            const h = require("./pipeline-health.json");
            const ageMin = (Date.now() - new Date(h.lastSuccess).getTime()) / 60000;
            if (!h.lastSuccess || ageMin > 30) {
              console.error("Pipeline health stale/failed:", JSON.stringify(h));
              process.exit(1);
            }
            console.log("Pipeline healthy; last success", Math.round(ageMin), "min ago");
          '
      # TEN-27 admin performance ledger. Runs only after the freshness gate
      # passes, appends newly-completed matches to admin-log.json, commits it
      # back to main. Guard + [skip ci] => a missing builder or an empty run
      # never breaks the deploy and the commit never re-triggers CI.
      # Replaces the standalone admin-log.yml (deleted in Edit 3).
      - name: Append completed matches to admin log (best-effort)
        run: |
          node build-admin-log.js || true
          node push-admin-log-to-firestore.js || true
      - name: Commit admin log (only if changed)
        run: |
          if [ -z "$(git status --porcelain -- admin-log.json)" ]; then
            echo "No new admin-log entries — nothing to commit."
            exit 0
          fi
          git config user.name "bsp-admin-log-bot"
          git config user.email "bsp-admin-log-bot@users.noreply.github.com"
          git add admin-log.json
          git commit -m "chore(admin): append completed match log [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then echo "Pushed on attempt $attempt."; exit 0; fi
            echo "Push rejected (attempt $attempt) — rebasing."
            git pull --rebase --autostash origin main || true
          done
          echo "::error::Could not push after 3 attempts."; exit 1

      # TEN-168 Series outcomes ledger (fix #3, founder 2026-09-07). build-series.js (run
      # earlier this deploy) appends CONTINUED/BROKEN evaluations for streaks whose
      # upcoming match has already been played, keyed idempotently by (eventKey|player|
      # family). Committing it back is what makes the record ACCUMULATE across days into a
      # measured per-streak hit-rate — same mechanism as admin-log.json above. Only-if-
      # changed + [skip ci] so an idle slate never commits and the commit never re-triggers.
      - name: Commit series outcomes ledger (only if changed)
        run: |
          if [ -z "$(git status --porcelain -- series-outcomes.json)" ]; then
            echo "No new series-outcome evaluations — nothing to commit."
            exit 0
          fi
          git config user.name "bsp-series-outcomes-bot"
          git config user.email "bsp-series-outcomes-bot@users.noreply.github.com"
          git add series-outcomes.json
          git commit -m "chore(series): append streak outcome evaluations [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then echo "Pushed on attempt $attempt."; exit 0; fi
            echo "Push rejected (attempt $attempt) — rebasing."
            git pull --rebase --autostash origin main || true
          done
          echo "::error::Could not push series-outcomes after 3 attempts."; exit 1

      # TEN-151 (founder ruling 2026-09-05, second comment): the Trading Report
      # generator runs ISOLATED (continue-on-error above) so its failure never
      # blocks the core board's deploy. But an isolated failure must still be
      # LOUD — never a green run. This runs last, AFTER the core deploy has
      # already published, and turns the whole RUN red if the generator failed,
      # writing the reason into the run summary. Loud failure, isolated failure:
      # the core board is fresh; the run is red so the alarm is seen.
      - name: Re-raise Trading Report generator failure (loud, non-blocking)
        if: always() && steps.trading_splits.outcome == 'failure'
        run: |
          DEPLOY_OUTCOME="${{ steps.deploy.outcome }}"
          echo "::error title=Trading Report generator failed::build-trading-splits.js exited non-zero this run (core deploy outcome: ${DEPLOY_OUTCOME}). Trading shards were NOT refreshed."
          {
            echo "### ❌ Trading Report generator failed"
            echo ""
            echo "\`build-trading-splits.js\` exited non-zero this run."
            echo ""
            if [ "$DEPLOY_OUTCOME" = "success" ]; then
              echo "- The **core board deployed normally** — this failure is isolated and did not block the deploy."
            else
              echo "- ⚠️ The core deploy did **not** succeed this run (deploy outcome: \`${DEPLOY_OUTCOME}\`) — this run has more than one failure; check the deploy step too."
            fi
            echo "- The **trading shards were not refreshed** this run."
            echo "- See the *Build Trading Report splits* step log above; re-run once fixed."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
