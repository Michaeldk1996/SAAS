name: probe-r35 (branch only — name audit)
on:
  push:
    branches: [claude/wonderful-fermat-clvs94]
    paths: [tools/probe-r35/trigger]
permissions: { contents: read, actions: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Live data
        run: |
          RID=$(gh run list -R "$GITHUB_REPOSITORY" --workflow pipeline.yml --status success -L 1 --json databaseId -q '.[0].databaseId')
          gh run download "$RID" -R "$GITHUB_REPOSITORY" -n site-data -D live
      - run: node tools/probe-r35/audit.cjs live > probe-out.txt 2>&1; cat probe-out.txt
