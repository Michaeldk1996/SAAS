name: TEN-216 change-row audit (READ-ONLY)

# TEN-216 — verification only. SELECTs against the test table so a review finding
# can be confirmed with numbers instead of inferred from reltuples.
# Refuses any statement that is not a SELECT. Creates and alters nothing.

on:
  workflow_dispatch:

concurrency:
  group: ten216-rowcheck
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Audit change rows
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, re, json, urllib.request, urllib.error
          url = os.environ["SUPABASE_URL"].strip().rstrip("/")
          tok = os.environ["SUPABASE_ACCESS_TOKEN"].strip()
          ref = re.search(r"https?://([a-z0-9]+)\.supabase\.co", url).group(1)

          def sql(q):
              if not re.match(r"^\s*select\b", q, re.I):
                  raise SystemExit("REFUSED non-SELECT")
              req = urllib.request.Request(
                  f"https://api.supabase.com/v1/projects/{ref}/database/query",
                  method="POST",
                  headers={"Authorization": f"Bearer {tok}", "Content-Type": "application/json"},
                  data=json.dumps({"query": q}).encode())
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return json.loads(r.read().decode() or "null")
              except urllib.error.HTTPError as e:
                  return {"http_error": e.code, "body": e.read().decode()[:300]}

          print("EXACT TOTAL:", json.dumps(sql(
              "select count(*) as rows from public.ten216_test_odds_changes")))

          print("\nPER POLL x CHANGE_KIND:")
          print(json.dumps(sql(
              "select poll_id, change_kind, count(*) as n from public.ten216_test_odds_changes "
              "group by poll_id, change_kind order by poll_id, change_kind"), indent=1))

          print("\nPHANTOM MOVES (change_kind='changed' but prev_price = price numerically):")
          print(json.dumps(sql(
              "select count(*) as phantom from public.ten216_test_odds_changes "
              "where change_kind='changed' and prev_price is not null and prev_price = price")))

          print("\nREAL MOVES (changed and prices differ):")
          print(json.dumps(sql(
              "select count(*) as real_moves from public.ten216_test_odds_changes "
              "where change_kind='changed' and prev_price is distinct from price")))

          print("\nDISTINCT QUOTES vs FIRST_SEEN ROWS (a quote first_seen twice = fabricated Open):")
          print(json.dumps(sql(
              "select count(*) as first_seen_rows, "
              "count(distinct (match_key, market, coalesce(line,''), selection, bookmaker)) as distinct_quotes "
              "from public.ten216_test_odds_changes where change_kind='first_seen'")))

          # A quote first_seen twice is either (a) a quote that left the board and came
          # back, which the state map legitimately forgets on 'removed', or (b) the
          # fabricated-Open bug returning. Those look identical in the count above, so
          # split them instead of guessing which one it is.
          print("\nDUPLICATE first_seen, SPLIT BY WHETHER THE QUOTE WAS EVER REMOVED:")
          print(json.dumps(sql(
              "select count(*) filter (where has_removed) as dup_after_removal, "
              "count(*) filter (where not has_removed) as dup_without_removal from ("
              "  select match_key, market, coalesce(line,'') as l, selection, bookmaker, "
              "         count(*) filter (where change_kind='first_seen') as fs, "
              "         bool_or(change_kind='removed') as has_removed "
              "  from public.ten216_test_odds_changes group by 1,2,3,4,5) t where fs > 1")))

          print("\nSAME-POLL DUPLICATE first_seen (must be 0 — a quote cannot open twice in one poll):")
          print(json.dumps(sql(
              "select count(*) as same_poll_dupes from ("
              "  select poll_id, match_key, market, coalesce(line,'') as l, selection, bookmaker "
              "  from public.ten216_test_odds_changes where change_kind='first_seen' "
              "  group by 1,2,3,4,5,6 having count(*) > 1) t")))

          # --- restart-cleanliness audit (TEN-216 Part A confirmation 1) -------------
          # The table and the raw bucket were restarted together. If either still holds
          # rows or objects from the corrupted series, the 7-day window is measuring a
          # mixture and the day-7 report is worthless. Prove it, do not assume it.
          print("\nSERIES BOUNDS (first tick anchors the 7-day window):")
          print(json.dumps(sql(
              "select min(observed_at) as first_tick, max(observed_at) as last_tick, "
              "count(distinct poll_id) as polls from public.ten216_test_odds_changes")))

          print("\nRAW BUCKET ten216-test-raw:")
          print(json.dumps(sql(
              "select count(*) as objects, min(created_at) as oldest, max(created_at) as newest "
              "from storage.objects where bucket_id = 'ten216-test-raw'")))

          # Raw is uploaded on EVERY poll for the first 24h, so the object list is the
          # only complete record of when we actually polled. Change-row poll_ids show
          # only the polls that saw something move — silence and a dead collector are
          # indistinguishable without this.
          print("\nEVERY POLL (raw object per tick — the true cadence):")
          print(json.dumps(sql(
              "select name, (metadata->>'size')::bigint as gz_bytes, created_at "
              "from storage.objects "
              "where bucket_id = 'ten216-test-raw' order by created_at asc"), indent=1))

          print("\nRAW DEBRIS (objects older than the first change row — must be 0):")
          print(json.dumps(sql(
              "select count(*) as stale_objects from storage.objects "
              "where bucket_id = 'ten216-test-raw' "
              "and created_at < (select min(observed_at) from public.ten216_test_odds_changes)")))
          PY
