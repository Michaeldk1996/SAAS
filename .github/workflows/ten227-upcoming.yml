name: TEN-227 upcoming odds reliability check

# TEN-227, second brief (board comment 2026-09-17T09:08Z): does BetsAPI give a
# trustworthy Open / Now / Close for matches that have NOT started yet, and how
# does it compare to Oddspapi bet365 and api-tennis at the same moment.
#
# REPORT ONLY. Nothing here is a product surface.
#
# ISOLATION
#   * No `schedule:` trigger. It runs only when dispatched and hands off to its
#     own successor, so cadence comes from inside the job rather than GitHub's
#     best-effort scheduler — this repo's cron has been throttled to 27%
#     delivery before, and a sparse sample of the quantity under measurement is
#     worthless.
#   * Writes ONLY to Supabase tables named `betsapi_upcoming_test_*` (RLS on,
#     zero policies), behind a DDL allowlist that is unit-tested before the job
#     is allowed to touch the database.
#   * Reads the TEN-216 collector's table and does not write to it. Makes no
#     /v4/historical-odds call at all, so it never competes with the TEN-225
#     archive for that endpoint's rate limit.
#
# BUDGETS
#   * BetsAPI: 400 requests/hour, a quarter of the 1,600/h ceiling, leaving the
#     rest of the trial free for other work.
#   * Oddspapi: /v4/odds-by-tournaments, chunked at 5 tournamentIds (a 6th is a
#     billable HTTP 400). The tool refuses to spend past 80% of request_limit
#     and reports the meter before and after every loop.
#
# OFF SWITCH: re-dispatch with stop=yes, or disable this workflow in the UI.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'setup | select | loop | report'
        required: true
        default: 'loop'
      interval_min:
        description: 'Minutes between polls'
        required: false
        default: '15'
      loop_minutes:
        description: 'Minutes to loop before handing off to a successor'
        required: false
        default: '320'
      start_poll_no:
        description: 'Poll counter to resume from'
        required: false
        default: '0'
      stop:
        description: 'Set to "yes" to stand down without re-dispatching'
        required: false
        default: 'no'

concurrency:
  group: ten227-upcoming          # a second dispatch queues; it never double-polls
  cancel-in-progress: false

permissions:
  contents: read
  actions: write                  # lets the loop dispatch its own successor

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # The DDL allowlist is the only thing between this probe and the
      # production Supabase project. Run its test BEFORE anything can reach the
      # database, not after.
      - name: Guard test — DDL allowlist and pairing rules
        run: node --test tools/test-ten227-upcoming.js

      - name: Run
        id: run
        env:
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BETSAPI_RATE_PER_HOUR: '400'
          INTERVAL_MIN: ${{ github.event.inputs.interval_min }}
          LOOP_MINUTES: ${{ github.event.inputs.loop_minutes }}
          START_POLL_NO: ${{ github.event.inputs.start_poll_no }}
        run: |
          set -o pipefail
          node tools/ten227-upcoming.mjs "${{ github.event.inputs.mode }}" 2>&1 | tee run.log
          rc=${PIPESTATUS[0]}
          # A `tee` without pipefail reports the tee's exit code, which is how a
          # dead probe once produced a green run on this repo. Keep both.
          exit $rc

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ten227-upcoming-${{ github.event.inputs.mode }}-${{ github.run_id }}
          path: |
            betsapi-out/
            run.log
          if-no-files-found: warn
          retention-days: 14

      # Hand off only while matches are still inside their poll window. The tool
      # writes more_work=0 once every selected match is past poll_until, which is
      # how this chain ENDS rather than running forever.
      - name: Hand off to successor
        if: ${{ always() && github.event.inputs.mode == 'loop' && github.event.inputs.stop != 'yes' && steps.run.outputs.more_work != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          INTERVAL: ${{ github.event.inputs.interval_min }}
          LOOP: ${{ github.event.inputs.loop_minutes }}
          NEXT: ${{ steps.run.outputs.next_poll_no }}
        run: |
          set -euo pipefail
          BEFORE=$(gh run list --workflow ten227-upcoming.yml --limit 20 --json databaseId \
                     --jq 'map(.databaseId) | max')
          gh workflow run ten227-upcoming.yml --ref "${{ github.ref_name }}" \
             -f mode=loop -f interval_min="$INTERVAL" -f loop_minutes="$LOOP" \
             -f start_poll_no="${NEXT:-0}" -f stop=no
          # A dead chain and a healthy one otherwise produce identical logs.
          for i in $(seq 1 12); do
            sleep 5
            AFTER=$(gh run list --workflow ten227-upcoming.yml --limit 20 --json databaseId \
                      --jq 'map(.databaseId) | max')
            if [ "$AFTER" != "$BEFORE" ]; then
              echo "successor dispatched: run $AFTER"; exit 0
            fi
          done
          echo "::error::successor run never appeared — the polling chain is BROKEN"
          exit 1
