name: probe-ops
on:
  push:
    branches: ['claude/probe-te-queue']
    paths: [tools/probe-ops/**]
permissions:
  contents: read
jobs:
  build-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: bash tools/probe-ops/run.sh
        env:
          STORE_TOKEN: ${{ secrets.TE_STORE_READ_TOKEN }}
          OPS_TOKEN: ${{ secrets.WORKFLOW_PAT }}
