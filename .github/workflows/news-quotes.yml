name: News ticker quotes
on:
  workflow_dispatch:
    inputs:
      clip:
        description: clip URL
        default: https://www.tennistv.com/videos/4607963/stockholm-2026-r2-rune-interview
concurrency:
  group: news-ttv-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ORG }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Ensure app
        run: flyctl apps create stennisfy-interviews --org personal 2>/dev/null || echo "app exists"
      - name: Stage secrets
        run: flyctl secrets set --stage -a stennisfy-interviews TENNISTV_EMAIL="${{ secrets.TENNISTV_EMAIL }}" TENNISTV_PASSWORD="${{ secrets.TENNISTV_PASSWORD }}"
      - name: Build & push image
        id: build
        working-directory: interviews-worker
        run: |
          flyctl deploy --build-only --push -a stennisfy-interviews --image-label probe 2>&1 | tee /tmp/b.log
          echo "image=registry.fly.io/stennisfy-interviews:probe" >> "$GITHUB_OUTPUT"
      - name: Run one clip
        run: |
          set -o pipefail
          flyctl machine run "${{ steps.build.outputs.image }}" -a stennisfy-interviews \
            --vm-cpus 2 --vm-memory 4096 --restart no --env CLIP_URL="${{ inputs.clip }}" \
            --env TENNISTV_EMAIL="${{ secrets.TENNISTV_EMAIL }}" --env TENNISTV_PASSWORD="${{ secrets.TENNISTV_PASSWORD }}" \
            2>&1 | tee /tmp/run.log
          MID=$(grep -oE 'Machine [0-9a-f]+' /tmp/run.log | head -1 | awk '{print $2}')
          echo "machine $MID"
          timeout 420 flyctl logs -a stennisfy-interviews 2>&1 | tee /tmp/logs.txt &
          LP=$!
          for i in $(seq 1 42); do grep -q 'TRANSCRIPT\|process exited\|error' /tmp/logs.txt 2>/dev/null && break; sleep 10; done
          sleep 3; kill $LP 2>/dev/null || true
          echo "=== captured ==="; sed -n '1,200p' /tmp/logs.txt
          [ -n "$MID" ] && flyctl machine destroy "$MID" -a stennisfy-interviews --force 2>/dev/null || true
