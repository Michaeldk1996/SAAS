name: News ticker quotes
on:
  workflow_dispatch:
concurrency:
  group: news-voice-probe
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Voice probe (read-only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node tools/news-ticker/voice-probe.mjs
