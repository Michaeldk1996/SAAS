name: News ticker quotes
on:
  workflow_dispatch:
concurrency:
  group: news-ttv-probe
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tennis TV sign-in probe (read-only)
        env:
          TENNISTV_EMAIL: ${{ secrets.TENNISTV_EMAIL }}
          TENNISTV_PASSWORD: ${{ secrets.TENNISTV_PASSWORD }}
        run: node tools/news-ticker/ttv-login-probe.mjs
