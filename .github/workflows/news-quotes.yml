name: News ticker quotes
on:
  workflow_dispatch:
    inputs:
      frames:
        description: JSON array of {url,slug} replays whose last minutes are captured as frames
        required: false
        default: ''
      discover:
        description: one replay URL whose in-player stats panel is opened and read
        required: false
        default: ''
      clips:
        description: JSON array of {url,slug} clips to transcribe (audio)
        required: false
        default: ''
permissions:
  contents: read
jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ORG }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Build & push image
        working-directory: interviews-worker
        run: flyctl deploy --build-only --push -a stennisfy-interviews --image-label frames-${{ github.run_id }} --build-arg WHISPER_MODEL=small.en 2>&1 | tail -5
      - name: Capture frames
        shell: bash
        run: |
          set +e
          MID=""
          for try in 1 2 3 4 5 6; do
            OUT=$(flyctl machine run registry.fly.io/stennisfy-interviews:frames-${{ github.run_id }} -a stennisfy-interviews \
              --vm-cpu-kind performance --vm-cpus 2 --vm-memory 4096 --restart no \
              ${{ inputs.discover != '' && format('--env DISCOVER_URL={0}', inputs.discover) || inputs.clips != '' && format('--env CLIP_URLS=''{0}''', inputs.clips) || format('--env FRAME_CLIPS=''{0}'' --env FRAME_TAIL=540', inputs.frames) }} \
              --env TENNISTV_EMAIL="${{ secrets.TENNISTV_EMAIL }}" --env TENNISTV_PASSWORD="${{ secrets.TENNISTV_PASSWORD }}" 2>&1)
            MID=$(echo "$OUT" | grep -oE 'Machine ID: [0-9a-f]+' | awk '{print $3}')
            [ -n "$MID" ] && break
            echo "launch attempt $try failed"; echo "$OUT" | tail -3; sleep 30
          done
          echo "MID=$MID"; [ -z "$MID" ] && exit 1
          ( flyctl logs -a stennisfy-interviews -i "$MID" > /tmp/logs.txt 2>&1 ) &
          LOGPID=$!
          for i in $(seq 1 400); do
            grep -q "FRAMES_READY" /tmp/logs.txt && break
            ST=$(flyctl machine status "$MID" -a stennisfy-interviews 2>/dev/null | grep -iE 'state' | head -1)
            echo "$ST" | grep -qiE "stopped|destroyed|failed" && break
            sleep 15
          done
          sed -E 's/\x1b\[[0-9;]*m//g; s/^.*\[info\]//' /tmp/logs.txt | grep -aE "frames|duration|seek|FAILED|sign-in|FRAMES_READY|ok ·|RESULTS"
          flyctl ssh console -a stennisfy-interviews --machine "$MID" -C "base64 -w0 /tmp/frames.tgz" > /tmp/frames.b64 2>/tmp/ssh.err
          tail -3 /tmp/ssh.err
          base64 -d /tmp/frames.b64 > /tmp/frames.tgz 2>/dev/null; ls -la /tmp/frames.tgz
          kill "$LOGPID" 2>/dev/null
          flyctl machine destroy "$MID" -a stennisfy-interviews --force 2>/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-frames
          path: |
            /tmp/frames.tgz
            /tmp/logs.txt
          if-no-files-found: warn
