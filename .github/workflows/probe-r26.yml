name: probe-r26 (branch only — live read-back 14b52fc)
on:
  push:
    branches: [claude/wonderful-fermat-clvs94]
    paths: [tools/probe-r26/trigger]
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node tools/probe-r26/live.mjs
