name: probe-r34 (branch only — coverage for the close-out)
on:
  push:
    branches: [claude/wonderful-fermat-clvs94]
    paths: [tools/probe-r34/trigger]
permissions: { contents: read, actions: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Live data + read-only export
        run: |
          RID=$(gh run list -R "$GITHUB_REPOSITORY" --workflow pipeline.yml --status success -L 1 --json databaseId -q '.[0].databaseId')
          echo "site-data from pipeline run $RID"
          gh run download "$RID" -R "$GITHUB_REPOSITORY" -n site-data -D live
          ls live/database-yield-master.json
          python3 tools/pinarch.py export live/pinnacle-closes.json > /dev/null
      - run: node tools/probe-r34/cov.mjs live
