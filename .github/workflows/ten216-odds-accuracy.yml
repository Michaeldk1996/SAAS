name: TEN-216 odds accuracy collector (ISOLATED TEST)

# TEN-216 — founder-authorised isolated test collector, 2026-09-16.
#
# ISOLATION GUARANTEES — read these before changing anything here:
#   * This workflow exists ONLY on the branch `ten216-odds-accuracy`. It is not
#     on main and must never be merged to main.
#   * There is NO `schedule:` trigger. A scheduled workflow only ever runs from
#     the default branch, so putting one here would do nothing; more importantly
#     its absence means this file cannot fire by itself. It runs only when
#     dispatched, and it re-dispatches itself on THIS branch.
#   * It writes only under `ten216-data/` on this branch. It never touches
#     matches.json, model-output.json, config.js, refresh-odds.py,
#     odds-history.yml, odds-now.yml, or any model layer.
#   * Nothing it produces feeds the live board or the model.
#
# CADENCE: the loop, not the cron, is what makes 5-minute polling real. The
# production capture loop documents 27% delivery on an hourly GitHub schedule;
# one dispatch here buys 5h30m of 5-minute ticks and then hands off to its own
# successor, which is why a `workflow_dispatch`-only workflow can still cover
# 7 continuous days.

on:
  workflow_dispatch:
    inputs:
      interval_min:
        description: 'Minutes between ticks'
        required: false
        default: '5'
      loop_minutes:
        description: 'Minutes to loop before handing off to a successor'
        required: false
        default: '330'
      stop:
        description: 'Set to "yes" to stand down without re-dispatching'
        required: false
        default: 'no'

concurrency:
  group: ten216-odds-accuracy
  cancel-in-progress: false

permissions:
  contents: write
  actions: write        # lets the loop dispatch its own successor

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ten216-odds-accuracy

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
          TEN216_INTERVAL_MIN: ${{ github.event.inputs.interval_min }}
          TEN216_LOOP_MINUTES: ${{ github.event.inputs.loop_minutes }}
        run: |
          if [ -z "$API_TENNIS_KEY" ]; then
            echo "::error::API_TENNIS_KEY secret is not set."; exit 1
          fi
          git config user.name  "ten216-collector"
          git config user.email "ten216-collector@users.noreply.github.com"

          # Commit whatever has been written, every 10 minutes, so a runner
          # eviction costs at most one commit window rather than the whole loop.
          (
            while true; do
              sleep 600
              git add -A ten216-data 2>/dev/null || true
              if ! git diff --cached --quiet 2>/dev/null; then
                git commit -m "ten216: collector data $(date -u +%FT%TZ) [skip ci]" -q || true
                for i in 1 2 3 4 5; do
                  git pull --rebase -q origin ten216-odds-accuracy 2>/dev/null || true
                  git push -q origin HEAD:ten216-odds-accuracy 2>/dev/null && break
                  sleep $((i * 5))
                done
              fi
            done
          ) &
          COMMITTER=$!

          node ten216-collector.mjs || echo "::warning::collector exited non-zero"
          kill $COMMITTER 2>/dev/null || true

      - name: Final commit
        if: always()
        run: |
          git config user.name  "ten216-collector"
          git config user.email "ten216-collector@users.noreply.github.com"
          git add -A ten216-data 2>/dev/null || true
          if ! git diff --cached --quiet 2>/dev/null; then
            git commit -m "ten216: collector data final $(date -u +%FT%TZ) [skip ci]" -q || true
            for i in 1 2 3 4 5; do
              git pull --rebase -q origin ten216-odds-accuracy 2>/dev/null || true
              git push -q origin HEAD:ten216-odds-accuracy 2>/dev/null && break
              sleep $((i * 5))
            done
          fi

      # The handoff. Queue the successor on THIS branch so coverage survives a
      # dead loop without waiting for a human. `stop: yes` is the off switch.
      - name: Dispatch successor
        if: always() && github.event.inputs.stop != 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ten216-odds-accuracy.yml/dispatches" \
            -d '{"ref":"ten216-odds-accuracy","inputs":{"interval_min":"${{ github.event.inputs.interval_min }}","loop_minutes":"${{ github.event.inputs.loop_minutes }}","stop":"no"}}' \
            && echo "successor dispatched"
