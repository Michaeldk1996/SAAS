# TEN-216 — ISOLATED odds-accuracy test collector.
#
# ISOLATION GUARANTEES — read before changing anything here:
#   * This workflow exists ONLY on the branch `ten216-odds-accuracy`. It is not on main
#     and must not be merged to main.
#   * There is deliberately NO `schedule:` trigger. A scheduled workflow only ever fires
#     from the default branch, so a cron here would do nothing — and its absence means
#     this file cannot fire by itself. It runs only when dispatched, and hands off to its
#     own successor on this same branch.
#   * It writes only to the orphan branch `ten216-data`. It never touches matches.json,
#     model-output.json, config.js, refresh-odds.py, refresh-odds-history.py,
#     odds-history.yml, odds-now.yml, fetchApiTennisMatchOdds, or any model layer.
#   * Nothing it produces feeds the live board or the model.
#
# WHY A LOOP AND NOT CRON. The cadence has to come from inside the job. GitHub's
# scheduler is best-effort and this repo's cron has been throttled before, so a `*/5`
# schedule would deliver a sparse sample of precisely the quantity under measurement.
# One dispatch buys `loop_minutes` of real 5-minute ticks and then queues a successor,
# which is how a dispatch-only workflow still covers 7 continuous days.
#
# OFF SWITCH: re-dispatch with `stop: yes`, or just delete this branch.
name: TEN-216 odds accuracy collector (ISOLATED TEST)

on:
  workflow_dispatch:
    inputs:
      interval_min:
        description: 'Minutes between ticks'
        required: false
        default: '5'
      loop_minutes:
        description: 'Minutes to loop before handing off to a successor'
        required: false
        default: '330'
      stop:
        description: 'Set to "yes" to stand down without re-dispatching'
        required: false
        default: 'no'

concurrency:
  group: ten216-odds-accuracy
  cancel-in-progress: false

permissions:
  contents: write
  actions: write          # lets the loop dispatch its own successor

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout collector (code branch)
        uses: actions/checkout@v4
        with:
          ref: ten216-odds-accuracy
          path: code
          fetch-depth: 1

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: ten216-data
          path: data
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
          INTERVAL_MIN: ${{ github.event.inputs.interval_min || '5' }}
          LOOP_MINUTES: ${{ github.event.inputs.loop_minutes || '330' }}
        working-directory: data
        run: |
          set -uo pipefail
          if [ -z "${API_TENNIS_KEY:-}" ]; then
            echo "::error::API_TENNIS_KEY secret is not set."; exit 1
          fi
          git config user.name  'ten216-collector'
          git config user.email 'ten216-collector@users.noreply.github.com'

          # Push what has been written every 10 minutes, so a runner eviction costs at
          # most one commit window rather than the whole loop.
          (
            while true; do
              sleep 600
              git add -A ten216-data 2>/dev/null || true
              if ! git diff --cached --quiet 2>/dev/null; then
                git commit -q -m "ten216: poll data $(date -u +%FT%TZ) [skip ci]" || true
                for i in 1 2 3 4 5; do
                  git push -q origin HEAD:ten216-data 2>/dev/null && break
                  git fetch -q origin ten216-data || true
                  git rebase -q origin/ten216-data || git rebase --abort || true
                  sleep $((i * 5))
                done
              fi
            done
          ) &
          COMMITTER=$!

          node ../code/tools/ten216-odds-collector.mjs \
            --mode loop --out ten216-data \
            --interval-min "$INTERVAL_MIN" --loop-minutes "$LOOP_MINUTES" \
            || echo '::warning::collector exited non-zero'
          kill $COMMITTER 2>/dev/null || true

      - name: Final commit
        if: always()
        working-directory: data
        run: |
          set -uo pipefail
          git config user.name  'ten216-collector'
          git config user.email 'ten216-collector@users.noreply.github.com'
          git add -A ten216-data 2>/dev/null || true
          if git diff --cached --quiet 2>/dev/null; then
            echo 'nothing to commit'; exit 0
          fi
          git commit -q -m "ten216: poll data final $(date -u +%FT%TZ) [skip ci]" || true
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:ten216-data && exit 0
            git fetch -q origin ten216-data || true
            git rebase -q origin/ten216-data || git rebase --abort || true
            sleep $((i * 5))
          done
          echo '::error::could not push collected data after 5 attempts'; exit 1

      # The handoff. Queue the successor on THIS branch so coverage survives a dead loop
      # without waiting for a human. workflow_dispatch is the documented exception to
      # GitHub's "GITHUB_TOKEN cannot trigger a workflow" recursion block — but that is a
      # claim, so the step verifies a successor run actually appeared and fails loudly if
      # not. A silently broken chain looks exactly like a healthy one.
      - name: Dispatch successor
        if: always() && github.event.inputs.stop != 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INTERVAL_MIN: ${{ github.event.inputs.interval_min || '5' }}
          LOOP_MINUTES: ${{ github.event.inputs.loop_minutes || '330' }}
        run: |
          set -uo pipefail
          BEFORE=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ten216-odds-accuracy.yml/runs?per_page=1" --jq '.total_count')
          gh api -X POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ten216-odds-accuracy.yml/dispatches" \
            -f ref=ten216-odds-accuracy \
            -f "inputs[interval_min]=$INTERVAL_MIN" \
            -f "inputs[loop_minutes]=$LOOP_MINUTES" \
            -f 'inputs[stop]=no'
          echo "dispatch accepted; confirming a run actually queued..."
          for i in $(seq 1 12); do
            sleep 5
            AFTER=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ten216-odds-accuracy.yml/runs?per_page=1" --jq '.total_count')
            if [ "$AFTER" -gt "$BEFORE" ]; then
              echo "successor confirmed (runs $BEFORE -> $AFTER)"; exit 0
            fi
          done
          echo "::error::dispatch returned success but NO successor run appeared after 60s — the handoff chain is broken and collection will stop here."
          exit 1
