name: ATP_Entry W/UE card harvest (Layer #8)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: One page of the timeline (read-only probe)
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: node tools/x-probe.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: x-posts
          path: /tmp/x-posts.json
