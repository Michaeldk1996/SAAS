name: Historical odds archive
# Founder brief 2026-10-16, items 1-4 (.claude/rules/historical-odds-archive.md): every Tennis-Data file byte for byte,
# every Tennis-Data close 2010+ (Pinnacle and Bet365 as separate sources), the private CSV export and the daily dated
# backup — all into the private ops repo and the append-only Supabase tables. Main only.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: install | daily | verify-export | restore-check | inventory | approx-import | start10-dry-run | start10-import | lower-dry-run | lower-import
        required: true
        default: daily
permissions:
  contents: read
concurrency:
  group: historical-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # the lower-level import reads every day from 2021 (founder brief 2026-10-19)
    env:
      MODE: ${{ github.event.inputs.mode || 'daily' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refuse to run off main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then echo "::error::the archive jobs run from main only (got ${GITHUB_REF})"; exit 1; fi
      - name: install — apply the additive migrations (the archive, then the Pinnacle (approx.) snapshots)
        if: env.MODE == 'install'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          REF=$(printf '%s' "$SUPABASE_URL" | sed -E 's#https://([a-z0-9]+)\.supabase\.co.*#\1#')
          for MIG in supabase/migrations/20261016090000_historical_odds_archive.sql supabase/migrations/20261016150000_historical_snapshot.sql supabase/migrations/20261017090000_historical_snapshot_start10.sql supabase/migrations/20261019090000_historical_snapshot_bet365.sql; do
            resp=$(jq -Rs '{query: .}' "$MIG" | curl -sS -w $'\n%{http_code}' -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @- \
              "https://api.supabase.com/v1/projects/$REF/database/query")
            code=$(printf '%s' "$resp" | tail -n1); body=$(printf '%s' "$resp" | sed '$d')
            echo "$MIG http $code: $body" | head -c 800; echo
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then echo "::error::migration http $code"; exit 1; fi
            if printf '%s' "$body" | jq -e 'type=="object" and (has("message") or has("error"))' >/dev/null 2>&1; then echo "::error::migration failed"; exit 1; fi
          done
          sleep 15                                                  # PostgREST reloads its schema cache
          python3 tools/tdarch.py counts --record install
          python3 tools/tdarch.py snapshot-counts --record install
      - name: inventory — every Tennis-Data file this checkout holds (no write)
        if: env.MODE == 'inventory'
        run: python3 tools/tdarch.py inventory
      - name: daily — files, closes, the private CSV export and the backup
        if: env.MODE == 'daily'
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          set -euo pipefail
          pip3 install --quiet xlrd==2.0.1          # the pre-2013 originals are .xls (only to describe them; the bytes are stored either way)
          python3 tools/pinarch.py export pinnacle-closes.json
          python3 tools/tdarch.py daily pinnacle-closes.json
          python3 tools/tdarch.py counts --record daily
          python3 tools/tdarch.py snapshot-counts --record daily
          # founder ruling 2026-10-18 (item 3): the lower levels' snapshots, again each day (insert-only: only what is new —
          # e.g. the ITF payloads the back-fill pulled since — is added), and their unpriced reasons for the pipeline
          python3 tools/tdarch.py lower-import --unpriced lower-unpriced.json
      - name: approx-import — Pinnacle (approx.) snapshots from api-tennis (founder ruling 2026-10-16; insert-only)
        if: env.MODE == 'approx-import'
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        run: python3 tools/tdarch.py approx-import
      - name: start10 — Pinnacle (approx.) from the Oddspapi Pinnacle archive at start − 10 (founder ruling 2026-10-17; insert-only)
        if: env.MODE == 'start10-import' || env.MODE == 'start10-dry-run'
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        run: python3 tools/tdarch.py start10-import ${{ env.MODE == 'start10-dry-run' && '--dry-run' || '' }}
      - name: lower levels — ATP qualifying, Challenger, ITF and the events Tennis-Data does not cover; snapshots (start − 10, api-tennis Pinnacle, api-tennis Bet365) 2021 – 16 Sep 2026 (founder ruling 2026-10-18 item 3, brief 2026-10-19; insert-only)
        if: env.MODE == 'lower-import' || env.MODE == 'lower-dry-run'
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        run: python3 tools/tdarch.py lower-import --unpriced lower-unpriced.json ${{ env.MODE == 'lower-dry-run' && '--dry-run' || '' }}
      - name: lower levels — hand the unpriced reasons to the pipeline (founder ruling 2026-10-18 item 5)
        if: (env.MODE == 'lower-import' || env.MODE == 'daily') && hashFiles('lower-unpriced.json') != ''
        uses: actions/upload-artifact@v4
        with: { name: lower-unpriced, path: lower-unpriced.json, retention-days: 90 }
      - name: verify-export / restore-check — rebuild from the backups, compare with the archive (no write)
        if: env.MODE == 'verify-export' || env.MODE == 'restore-check'
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none "https://x-access-token:${WORKFLOW_PAT}@github.com/Michaeldk1996/stennisfy-ops.git" ops
          python3 tools/tdarch.py restore-check ops
          python3 tools/tdarch.py verify-export ops
