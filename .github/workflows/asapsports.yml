name: BSP ASAP Sports readiness signal

# PROOF BRANCH (ten8-asap-board-fix). Same scrape+extract as main, but two changes:
#   1. Fetch the LIVE deployed board (fresh, main-draw) before extracting, instead
#      of the stale committed matches.json (which lags to the qualifier board and
#      is why the signal came back empty).
#   2. Upload the signal as an ARTIFACT — do NOT push to main. This lets us prove
#      populated bullets with zero impact on the live site until the founder approves.

on:
  workflow_dispatch:

concurrency:
  group: bsp-asapsports-proof
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch LIVE board (fresh main-draw, what the founder sees)
        run: |
          curl -sSf https://michaeldk1996.github.io/SAAS/matches.json -o matches.json
          node -e 'const m=require("./matches.json");console.log("Live board:",m.length,"matches; dates",[...new Set(m.map(x=>x.date))].sort().join(","));'

      - name: Scrape + extract readiness signal (real LLM bullets)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node tools/asapsports-signal.js

      - name: Upload signal artifact (PROOF — no push to main)
        uses: actions/upload-artifact@v4
        with:
          name: asap-signal-proof
          path: asapsports-signal.json
          if-no-files-found: error
