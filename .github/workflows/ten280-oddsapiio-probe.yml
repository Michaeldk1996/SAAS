# TEN-280 — read-only odds-api.io REST probe. Branch-only: fires on a push to
# ten280-probe and nothing else. No schedule, no dispatch, never on main.
name: ten280-oddsapiio-probe
on:
  push:
    branches: [ten280-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: SQL steps (encrypted output)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TEN280_STEPS: tools/ten280-steps-export.json
        run: python3 tools/ten280-sql.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ten280-sql
          path: |
            out/result.enc
            out/pass.enc
          retention-days: 1
