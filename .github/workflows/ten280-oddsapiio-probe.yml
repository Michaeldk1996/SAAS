# TEN-280 — odds-api.io probes, now the Bet105 drop bot's READ-ONLY status read.
# Stop the bot (SQL): select cron.unschedule('ten280-bet105-drop-bot');
# Branch-only: fires on a push to
# ten280-probe and nothing else. No schedule, no dispatch, never on main.
name: ten280-oddsapiio-probe
on:
  push:
    branches: [ten280-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: SQL steps (encrypted output)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # READ-ONLY status. The live install ran once (run 36099383252); a push never reinstalls.
          TEN280_STEPS: tools/ten280-steps-report.json   # READ-ONLY report; the update (run 36104147709) never re-runs
        run: python3 tools/ten280-sql.py
      - name: odds-api.io books probe (REST only, read-only, encrypted)
        if: always()
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
        run: python3 tools/ten280-books-probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ten280-sql
          path: |
            out/result.enc
            out/pass.enc
            out/books.enc
            out/books-pass.enc
          retention-days: 1
