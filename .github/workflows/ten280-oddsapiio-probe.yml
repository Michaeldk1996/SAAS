# TEN-280 — odds-api.io probes, now the Bet105 drop bot's READ-ONLY status read.
# Stop the bot (SQL): select cron.unschedule('ten280-bet105-drop-bot');
# Branch-only: fires on a push to
# ten280-probe and nothing else. No schedule, no dispatch, never on main.
name: ten280-oddsapiio-probe
on:
  push:
    branches: [ten280-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: SQL steps (encrypted output)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # TEN-282 Part A: alert layout v3 (Pre-drop + Since open). Idempotent install inside
          # one transaction with the self-test + regression gate; the one format-test send is
          # guarded by an events row, so a re-push re-installs identical code and sends nothing.
          TEN280_STEPS: tools/ten280-steps-v3.json
        run: python3 tools/ten280-sql.py
      - name: odds-api.io rotation scan + outright check (REST only, read-only, encrypted)
        if: always()
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
        run: python3 tools/ten280-rotation-probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ten280-sql
          path: |
            out/result.enc
            out/pass.enc
            out/rot.enc
            out/rot-pass.enc
          retention-days: 1
