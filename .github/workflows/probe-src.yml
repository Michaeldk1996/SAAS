name: probe-src (branch only — removed before landing)
on:
  push:
    branches: [claude/wonderful-fermat-clvs94]
    paths: [tools/probe-src/trigger]
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Source closeness on the lower levels (read-only; SportsAPI365 capped at 36 requests)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
          SPORTSAPI365_KEY: ${{ secrets.SPORTSAPI365_KEY }}
        run: |
          python3 tools/pinarch.py export pc.json | tail -3
          python3 tools/probe-src/run.py
