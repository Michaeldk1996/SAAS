# Permanent Pinnacle archive (founder brief 2026-10-14, item 1). Rules: .claude/rules/pinnacle-archive.md.
#   install  apply supabase/migrations/20261014120000_pinnacle_archive.sql (additive) and verify the guard
#   import   captured-closes-pinnacle.json + the oddspapi-raw bucket -> the archive tables (rows are only ever added)
#   derive   archive closes ('from Pinnacle history') for the matches our live poller saw start (--days)
#   pull-backlog  pull the Pinnacle +30 history of every match started in the last --days with no archive close and
#            no Pinnacle +30 payload (own 5 s slot, never the odds loop's key gate), then derive their closes
#   backup   today's dated copy into the private ops repo (Michaeldk1996/stennisfy-ops), never replacing a day
#   restore-check  rebuild every row from the backups into restore SQL and compare its counts with the live tables
#   derive-held  archive closes for held Pinnacle +30 payloads whose match has NO live-flip row, cut at Oddspapi's
#            trueStart (founder 2026-10-16; window from / to, default the ruled 13-30 Apr; dry_run inserts nothing)
#   daily    import + derive + backup (the schedule). Runs from main only.
name: Pinnacle archive
on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: install | import | derive | derive-held | pull-backlog | backup | restore-check | false-starts-report | false-starts-ticks | false-starts-recut | daily
        required: true
        default: daily
      days:
        description: derive — how many days of live-flipped matches to derive closes for (daily = 3)
        required: false
        default: '3'
      from:
        description: derive-held — first day (UTC, inclusive); the ruling covers 2026-04-13 .. 2026-04-30
        required: false
        default: '2026-04-13'
      to:
        description: derive-held — day after the last (UTC, exclusive)
        required: false
        default: '2026-05-01'
      dry_run:
        description: derive-held / false-starts-recut — 'yes' counts what it would add and inserts nothing
        required: false
        default: 'yes'
permissions:
  contents: read
concurrency:
  group: pinnacle-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      MODE: ${{ github.event.inputs.mode || 'daily' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50
      - name: Refuse to run off main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then echo "::error::the archive jobs run from main only (got ${GITHUB_REF})"; exit 1; fi
      - name: install — apply the additive migration
        if: env.MODE == 'install'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          REF=$(printf '%s' "$SUPABASE_URL" | sed -E 's#https://([a-z0-9]+)\.supabase\.co.*#\1#')
          resp=$(jq -Rs '{query: .}' supabase/migrations/20261014120000_pinnacle_archive.sql | curl -sS -w $'\n%{http_code}' -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @- \
            "https://api.supabase.com/v1/projects/$REF/database/query")
          code=$(printf '%s' "$resp" | tail -n1); body=$(printf '%s' "$resp" | sed '$d')
          echo "http $code: $body" | head -c 800; echo
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then echo "::error::migration http $code"; exit 1; fi
          if printf '%s' "$body" | jq -e 'type=="object" and (has("message") or has("error"))' >/dev/null 2>&1; then echo "::error::migration failed"; exit 1; fi
          python3 tools/pinarch.py counts --record install
      - name: import — captured closes and the raw bucket
        if: env.MODE == 'import' || env.MODE == 'daily'
        run: |
          set -euo pipefail
          git fetch -q origin main && git checkout -q origin/main -- captured-closes-pinnacle.json
          export CAPTURED_COMMIT=$(git log -1 --format=%H origin/main -- captured-closes-pinnacle.json)
          python3 tools/pinarch.py counts --record before-import
          python3 tools/pinarch.py import-captured captured-closes-pinnacle.json
          python3 tools/pinarch.py import-bucket
          python3 tools/pinarch.py counts --record import
      - name: derive — archive closes from the payloads it holds (our live-flip start)
        if: env.MODE == 'derive' || env.MODE == 'daily'
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PINARCH_FIXTURES: .pinarch-fixtures.json
        run: |
          set -euo pipefail
          python3 tools/pinarch.py derive --days "${{ github.event.inputs.days || '3' }}"
          python3 tools/pinarch.py counts --record derive
      - name: derive-held — closes for held payloads with no live-flip row (Oddspapi trueStart cut; no metered call)
        if: env.MODE == 'derive-held'
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'yes' }}
          FROM: ${{ github.event.inputs.from || '2026-04-13' }}
          TO: ${{ github.event.inputs.to || '2026-05-01' }}
        run: |
          set -euo pipefail
          # fail closed: only the exact value "no" writes to the permanent archive; anything else is a dry run or an error
          case "$DRY_RUN" in
            yes) python3 tools/pinarch.py derive-held --from "$FROM" --to "$TO" --dry-run ;;
            no)  python3 tools/pinarch.py derive-held --from "$FROM" --to "$TO"
                 python3 tools/pinarch.py counts --record derive-held ;;
            *)   echo "dry_run must be exactly 'yes' or 'no' (got '$DRY_RUN') — nothing run" >&2; exit 2 ;;
          esac
      - name: pull-backlog — Pinnacle +30 history for started matches with no archive close, then their closes
        if: env.MODE == 'pull-backlog'
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PINARCH_FIXTURES: .pinarch-fixtures.json
        run: |
          set -euo pipefail
          python3 tools/pinarch.py pull --hours "$(( ${{ github.event.inputs.days || '3' }} * 24 ))" --budget 8000
          python3 tools/pinarch.py counts --record pull-backlog
      - name: backup — today's dated copy to the private ops repo
        if: env.MODE == 'backup' || env.MODE == 'daily'
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          set -euo pipefail
          python3 tools/pinarch.py backup
          python3 tools/pinarch.py counts --record backup
      - name: false-starts-report — 0-0 live flags since 24 Oct and the closes cut on them (READ-ONLY)
        if: env.MODE == 'false-starts-report'
        run: |
          set -euo pipefail
          python3 tools/pinarch.py false-starts-report --since 2026-10-24

      - name: false-starts-ticks — Pinnacle entries around the false starts, from stored payloads (READ-ONLY, 0 units)
        if: env.MODE == 'false-starts-ticks'
        run: |
          set -euo pipefail
          python3 tools/pinarch.py false-starts-ticks

      - name: false-starts-recut — Berrettini + Vacherot re-cut at Oddspapi trueStart (free history pull; dry run unless 'no')
        if: env.MODE == 'false-starts-recut'
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'yes' }}
        run: |
          set -euo pipefail
          # fail closed, as derive-held: only the exact value "no" writes to the permanent archive
          case "$DRY_RUN" in
            yes) python3 tools/pinarch.py false-starts-recut ;;
            no)  python3 tools/pinarch.py false-starts-recut --write
                 python3 tools/pinarch.py counts --record false-starts-recut ;;
            *)   echo "dry_run must be exactly 'yes' or 'no' (got '$DRY_RUN') — nothing run" >&2; exit 2 ;;
          esac
      - name: restore-check — rebuild every row from the backups (no write)
        if: env.MODE == 'restore-check'
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 "https://x-access-token:${WORKFLOW_PAT}@github.com/Michaeldk1996/stennisfy-ops.git" ops
          python3 tools/pinarch.py restore ops --sql-out /tmp/restore.sql --compare
          python3 tools/pinarch.py counts
