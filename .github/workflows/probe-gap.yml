name: probe-gap (branch only — removed before landing)
on:
  push:
    branches: [claude/wonderful-fermat-clvs94]
    paths: [tools/probe-gap/trigger]
permissions: { contents: read, actions: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Coverage before / after this branch's join + report changes, on the published data (read-only)
        run: |
          git fetch -q --depth 1 origin main
          RID=$(gh run list -R "$GITHUB_REPOSITORY" --workflow pipeline.yml --status success -L 1 --json databaseId -q '.[0].databaseId')
          echo "site-data from run $RID"
          gh run download "$RID" -R "$GITHUB_REPOSITORY" -n site-data -D live
          git show origin/main:tools/price-consistency.mjs > tools/pc-main.mjs
          CHROME_BIN=google-chrome node tools/pc-main.mjs --site live --coverage-out before.json --sample 1000000 > b.log 2>&1 || tail -5 b.log
          cp bsp-consult-dashboard.html live/bsp-consult-dashboard.html
          [ -f live/index.html ] && cmp -s live/index.html live/bsp-consult-dashboard.html || echo "note: index.html differs from the dashboard"
          CHROME_BIN=google-chrome node tools/price-consistency.mjs --site live --coverage-out after.json --sample 1000000 > a.log 2>&1 || tail -5 a.log
          grep '^price-consistency' b.log a.log
          python3 tools/probe-gap/ba.py before.json after.json
