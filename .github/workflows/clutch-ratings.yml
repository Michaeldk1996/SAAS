name: BSP weekly clutch-ratings refresh

# Rebuilds clutch-rating.json (Under-Pressure / Clutch Rating — four component
# percentages derived from TML match data: BP saved %, BP converted %, tiebreak
# win %, deciding-set win %) from the cached TML CSVs, then commits it to main.
#
# No API key required — all source data is from the public TML-Database mirror
# (raw.githubusercontent.com/Tennismylife/TML-Database). The current-year CSV is
# deleted before the rebuild so the script re-fetches it (getCsv only downloads
# a year it doesn't already have). Older years are immutable and stay cached.
#
# Cadence: Monday 22:00 UTC — two hours after Elo refresh. workflow_dispatch
# allows a manual refresh at any time.

on:
  schedule:
    - cron: '0 22 * * 1'    # Mondays 22:00 UTC
  workflow_dispatch:

concurrency:
  group: bsp-clutch-ratings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Record committed player count (regression baseline)
        run: |
          PREV=$(node -e 'let n=0;try{n=(require("./clutch-rating.json").players||[]).length}catch(e){}; process.stdout.write(String(n))')
          echo "PREV_PLAYERS=$PREV" >> "$GITHUB_ENV"

      - name: Evict current-year TML CSV so it is re-fetched
        run: |
          Y=$(date -u +%Y)
          rm -f "tml-cache/$Y.csv"
          echo "Removed tml-cache/$Y.csv (will be re-fetched by clutch-rating.js)."

      - name: Rebuild clutch ratings
        run: node clutch-rating.js

      - name: Sanity-check rebuilt file
        run: |
          node -e '
            const d = require("./clutch-rating.json");
            const n = (d.players || []).length;
            const prev = parseInt(process.env.PREV_PLAYERS, 10) || 0;
            if (!n) { console.error("::error::clutch-rating.json has no players — refusing to commit"); process.exit(1); }
            if (prev > 0 && n < Math.floor(prev * 0.95)) {
              console.error("::error::player count regressed " + prev + " -> " + n + " — refusing to commit");
              process.exit(1);
            }
            console.log("OK: " + n + " players (was " + prev + "), generatedAt " + d.generatedAt + ".");
          '

      - name: Commit refreshed clutch-rating.json
        run: |
          git add clutch-rating.json
          if git diff --cached --quiet; then
            echo "Nothing changed — nothing to commit."
            exit 0
          fi
          git config user.name  "bsp-clutch-bot"
          git config user.email "bsp-clutch-bot@users.noreply.github.com"
          git commit -m "chore(clutch-ratings): weekly Under-Pressure refresh [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing and retrying."
            git pull --rebase origin main || true
          done
          echo "::error::Could not push clutch-rating.json after 3 attempts."
          exit 1
