name: TEN-225 live-flip recorder
# THROWAWAY probe branch (read-only SELECT through the Management API). Deleted after use.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      MGMT: https://api.supabase.com
    steps:
      - uses: actions/checkout@v4
      - name: query
        run: |
          REF=$(printf '%s' "$SUPABASE_URL" | sed -E 's#https?://([^./]+)\.supabase\.co/?.*#\1#')
          for f in .probe/*.sql; do
            echo "=== $f"
            jq -Rs '{query: .}' "$f" | curl -sS -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @- "$MGMT/v1/projects/$REF/database/query" | jq -c '.[]?' || echo failed
          done
          exit 0
