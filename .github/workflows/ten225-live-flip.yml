name: TEN-225 live-flip recorder

# TEN-225 item 2a (Michael, 2026-09-17T09:11Z):
#   "Record the flip from the existing ~10-second live poller, not from a
#    5-minute odds collector: append-only table (fixture, first_live_seen_at,
#    last_not_live_seen_at, poller, gap_seconds). Report the median gap after
#    48h."
#
# TWO MODES
#   install — apply the additive migration, run the harness, and ONLY THEN
#             replace write_snapshot. The order is the whole point: write_snapshot
#             is on the member read path and there is no local Postgres to
#             rehearse against, so the function it calls is proven first.
#   report  — read back the gap distribution. This is the 48h median-gap report.
#             Runs on a schedule so the number accrues without anyone remembering.
#
# NOTHING MEMBER-VISIBLE. Two new tables, RLS on, zero policies — no browser role
# can read them. The Live tab's board is byte-for-byte what it was: write_snapshot
# keeps its signature and its effect on live_snapshot, and the recorder call is
# exception-wrapped so a recorder fault cannot reach the board.
#
# DO-NOT-TOUCH compliance: no existing TABLE, POLICY or pg_cron JOB is altered.
# write_snapshot (a FUNCTION) is changed under Michael's explicit instruction to
# record the flip from this poller.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'install (apply + harness + wire), report (48h gap report), or supersede (false 0-0 starts, founder 2026-10-27)'
        type: choice
        options: [install, report, supersede]
        default: install
  schedule:
    # Hourly read-back. The 48h median-gap report is just this, read after the
    # table has had 48h of ticks; scheduling it means the number is always there.
    - cron: '35 * * * *'

concurrency:
  group: ten225-live-flip
  cancel-in-progress: false

jobs:
  flip:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: bash probe_runs.sh
