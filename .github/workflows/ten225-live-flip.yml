name: TEN-225 live-flip recorder
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - name: kalshi times vs api-tennis starts (read-only)
        run: |
          curl -s "https://api.elections.kalshi.com/trade-api/v2/markets?series_ticker=KXATPMATCH&status=open&limit=200" | jq -r '[.markets[]|{e:.event_ticker,o:.occurrence_datetime,x:.expected_expiration_time,c:.close_time,w:.yes_sub_title}]|unique_by(.e)[]|"\(.e) occ=\(.o) exp=\(.x) | \(.w)"' | head -30
          REF=$(echo "$SUPABASE_URL" | sed -E 's#https://([^.]+)\..*#\1#')
          q() { jq -n --arg q "$1" '{query:$q}' | curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @- | jq -c '.' | cut -c1-1500; }
          echo "== kalshi alerts by delivery"; q "select delivery, count(*) from kalshi_bot.alerts where mode='live' group by 1"
          echo "== api-tennis starts"; q "select first_player, second_player, start_utc from drops_scope.fixture where event_type_type='Atp Singles' and start_utc > now() - interval '3 hours' order by start_utc limit 12"
          exit 0
