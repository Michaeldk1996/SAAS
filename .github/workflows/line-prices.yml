name: bet105 line prices

# Founder brief 2026-10-24 (bet105-line-prices, Part 2): Kibl (bet105) is the only line-price source, refreshed every
# 15 minutes. build-line-prices.py pulls the men's pre-match markets, joins them to api-tennis (master for fixtures,
# names, status), runs the fail-closed guards (line_prices.py), appends changed prices to line_price_ticks
# (append-only), upserts line_prices_current, and writes line-prices/<date>.json. This job commits those shards; the
# pipeline copies line-prices/ into the site (the browser reads JSON only; every key stays in Actions secrets).
# A failed or EMPTY Kibl pull exits 1 and commits nothing: the published shards age past the page's 30-minute rule
# and dash.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: line-prices
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KIBL_USERNAME: ${{ secrets.KIBL_USERNAME }}
      KIBL_PASSWORD: ${{ secrets.KIBL_PASSWORD }}
      KIBL_CLIENT_ID: ${{ secrets.KIBL_CLIENT_ID }}
      API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Offline harness (no network)
        run: python3 test-line-prices.py

      - name: Apply the schema (idempotent)
        run: |
          set -euo pipefail
          REF=$(printf '%s' "$SUPABASE_URL" | sed -E 's#https?://([^./]+)\.supabase\.co/?.*#\1#')
          code=$(jq -Rs '{query: .}' line-prices-schema.sql | curl -sS -o /tmp/schema.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @- "https://api.supabase.com/v1/projects/$REF/database/query")
          echo "schema http $code"
          [ "$code" = 200 ] || [ "$code" = 201 ] || { echo "::error::line-prices schema apply failed ($code): $(cat /tmp/schema.out)"; exit 1; }

      - name: Pull, guard, store, project
        run: python3 -u build-line-prices.py

      - name: Commit line-prices/ (only if changed)
        run: |
          if git diff --quiet -- line-prices && [ -z "$(git ls-files --others --exclude-standard -- line-prices)" ]; then
            echo "line-prices unchanged."
            exit 0
          fi
          git config user.name "bsp-bot"
          git config user.email "bsp-bot@users.noreply.github.com"
          git add -A -- line-prices
          git commit -m "chore(odds): bet105 line prices [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && { echo "pushed on attempt $attempt"; exit 0; }
            sleep $((attempt * 7))
          done
          echo "::error::could not push line-prices after 3 attempts"; exit 1
