# TEN-287 — odds-api.io Betfair Exchange + Superbet read-only probe.
# Branch-only: fires on a push to ten287-probe and nothing else. No schedule, no dispatch, never on main.
name: ten287-probe
on:
  push:
    branches: [ten287-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Run 4: INSTALL the TEN-287 recorder (founder answer b758d347: recorder only, no alerts). Install +
      # self-test in ONE transaction; cron scheduled only after live ticks arrive for both books. Sends nothing.
      - name: SQL steps (encrypted output)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          TEN287_STEPS: tools/ten287-steps-install.json
        run: python3 tools/ten287-sql.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ten287-sql
          path: |
            out/result.enc
            out/pass.enc
          retention-days: 1
