# TEN-287 — odds-api.io Betfair Exchange + Superbet read-only probe.
# Branch-only: fires on a push to ten287-probe and nothing else. No schedule, no dispatch, never on main.
name: ten287-probe
on:
  push:
    branches: [ten287-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Run 9: ENABLE the Superbet drop bot (founder 2026-09-26, comment 3840b895): schedule every 30 s +
      # one startup test message (sent at most once; a re-push never re-sends it).
      - name: SQL steps (encrypted output)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEN287_STEPS: tools/ten287-steps-bot-enable.json
        run: python3 tools/ten287-sql.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ten287-sql
          path: |
            out/result.enc
            out/pass.enc
          retention-days: 1
