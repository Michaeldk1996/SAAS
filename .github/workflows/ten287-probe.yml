# TEN-287 — odds-api.io Betfair Exchange + Superbet read-only probe.
# Branch-only: fires on a push to ten287-probe and nothing else. No schedule, no dispatch, never on main.
name: ten287-probe
on:
  push:
    branches: [ten287-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      # Run 2: near-start sampler (the one-shot probe ran as run 36198963732; not re-run).
      - name: odds-api.io near-start sampler, every 5 min (REST only, read-only, encrypted output)
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          TEN287_MINUTES: "335"
        run: python3 tools/ten287-sampler.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ten287-probe
          path: |
            out/samples.enc
            out/spass.enc
          retention-days: 1
