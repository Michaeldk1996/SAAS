# TEN-287 — odds-api.io Betfair Exchange + Superbet read-only probe.
# Branch-only: fires on a push to ten287-probe and nothing else. No schedule, no dispatch, never on main.
name: ten287-probe
on:
  push:
    branches: [ten287-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Run 7: READ-ONLY odds-api.io historical/closing-lines probe for the odds-source strategy report.
      - name: odds-api.io historical probe (REST only, read-only, encrypted output)
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
        run: python3 tools/ten287-histprobe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ten287-sql
          path: |
            out/hist.enc
            out/hpass.enc
          retention-days: 1
